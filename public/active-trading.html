<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活跃成交</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #1a1a1a;
    color: #ddd;
    padding: 20px;
    line-height: 1.6;
  }
  .container { max-width: 1600px; margin: 0 auto; }

  /* ── 导航 ── */
  .nav-links { text-align: center; margin-bottom: 20px; }
  .nav-links a {
    color: #007acc; text-decoration: none; padding: 6px 14px; margin: 0 6px;
    border: 1px solid #007acc; border-radius: 4px; transition: all 0.2s;
    display: inline-block; font-size: 13px;
  }
  .nav-links a:hover { background-color: #007acc; color: white; }
  .nav-links a.active { background-color: #007acc; color: white; }

  /* ── 标题栏 ── */
  .header-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; border-bottom: 1px solid #333; padding-bottom: 12px;
  }
  .title { font-size: 1.4em; color: #ddd; font-weight: normal; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .refresh-info { font-size: 12px; color: #888; white-space: nowrap; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #555; margin-right: 6px; vertical-align: middle;
    transition: background 0.3s;
  }
  .status-dot.live  { background: #26a69a; box-shadow: 0 0 5px #26a69a; }
  .status-dot.error { background: #ef5350; }

  /* ── 筛选面板 ── */
  .filter-panel-wrap { margin-bottom: 14px; }
  .filter-toggle-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 14px; background: #2a2a2a; border-radius: 6px;
    cursor: pointer; user-select: none;
    border: 1px solid #333; transition: border-color 0.15s;
  }
  .filter-toggle-bar:hover { border-color: #444; }
  .filter-toggle-left { display: flex; align-items: center; gap: 10px; }
  .filter-toggle-label { font-size: 12px; color: #666; }
  .filter-active-pills { display: flex; gap: 5px; flex-wrap: wrap; }
  .filter-pill {
    font-size: 11px; padding: 1px 8px; border-radius: 10px;
    background: #007acc1a; border: 1px solid #007acc44; color: #7ac0f0;
  }
  .filter-chevron { font-size: 10px; color: #555; transition: transform 0.2s ease; }
  .filter-chevron.open { transform: rotate(180deg); }
  .filter-body {
    overflow: hidden; max-height: 0; opacity: 0;
    transition: max-height 0.25s ease, opacity 0.2s ease;
  }
  .filter-body.open { max-height: 180px; opacity: 1; }
  .filter-panel {
    background: #2a2a2a; padding: 12px 16px 14px;
    border-radius: 0 0 6px 6px; border-top: 1px solid #333;
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end;
  }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 12px; color: #888; }
  .filter-row { display: flex; align-items: center; gap: 5px; }
  .filter-sep { font-size: 12px; color: #555; }

  input[type=number], input[type=text] {
    background: #1a1a1a; border: 1px solid #444; color: #ddd;
    padding: 5px 8px; border-radius: 4px; font-size: 13px;
    outline: none; transition: border-color 0.15s;
  }
  input[type=number] { width: 80px; -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number]:focus, input[type=text]:focus { border-color: #007acc; }
  input[type=number]::placeholder,
  input[type=text]::placeholder { color: #555; }
  input[type=number].has-value { border-color: #007acc55; color: #7ac0f0; }

  .filter-actions { display: flex; align-items: flex-end; gap: 8px; margin-left: auto; }
  .btn {
    padding: 6px 16px; border-radius: 4px; border: 1px solid #444;
    background: #1a1a1a; color: #ccc; font-size: 13px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { border-color: #888; color: #fff; }
  .btn.primary { border-color: #007acc; color: #7ac0f0; background: #007acc18; }
  .btn.primary:hover { background: #007acc30; }

  /* ── 屏蔽管理按钮 ── */
  .block-btn {
    background: #1a1a1a; border: 1px solid #444; color: #aaa;
    padding: 5px 12px; border-radius: 4px; font-size: 13px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .block-btn:hover { border-color: #ef5350; color: #ef5350; }
  .block-btn.has-blocked { border-color: #ef5350; color: #ef5350; }

  /* ── 右键菜单 ── */
  #ctx-menu {
    position: fixed; background: #2a2a2a; border: 1px solid #444;
    border-radius: 4px; padding: 4px 0; z-index: 9999; min-width: 150px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5); display: none;
  }
  #ctx-menu .ctx-item { padding: 8px 14px; font-size: 13px; cursor: pointer; color: #ddd; white-space: nowrap; }
  #ctx-menu .ctx-item:hover { background: #3a3a3a; }
  #ctx-menu .ctx-item.danger { color: #ef5350; }

  /* ── 屏蔽管理浮层 ── */
  #block-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 9000; align-items: center; justify-content: center;
  }
  #block-modal-overlay.open { display: flex; }
  #block-modal {
    background: #252525; border: 1px solid #444; border-radius: 8px;
    width: 420px; max-height: 70vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid #333; font-size: 14px; color: #ddd;
  }
  .modal-close { background: none; border: none; color: #666; font-size: 18px; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: #ddd; }
  .modal-add { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #333; }
  .modal-add input { flex: 1; }
  .modal-add button {
    background: none; border: 1px solid #555; color: #aaa; padding: 5px 12px;
    border-radius: 3px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .modal-add button:hover { border-color: #ef5350; color: #ef5350; }
  .modal-body { flex: 1; overflow-y: auto; padding: 10px 16px; }
  .modal-empty { text-align: center; padding: 30px; color: #555; font-size: 13px; }
  .block-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid #2e2e2e; font-size: 13px;
  }
  .block-item:last-child { border-bottom: none; }
  .block-item-code { color: #fff; font-weight: 600; }
  .unblock-btn {
    background: none; border: 1px solid #555; color: #aaa; padding: 2px 8px;
    border-radius: 3px; font-size: 12px; cursor: pointer;
  }
  .unblock-btn:hover { border-color: #26a69a; color: #26a69a; }
  .modal-footer { padding: 10px 16px; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 8px; }
  .modal-footer button {
    padding: 5px 14px; border-radius: 3px; font-size: 13px; cursor: pointer;
    border: 1px solid #555; background: none; color: #aaa;
  }
  .modal-footer button:hover { border-color: #ddd; color: #ddd; }
  .modal-footer .btn-danger { border-color: #ef5350; color: #ef5350; }
  .modal-footer .btn-danger:hover { background: rgba(239,83,80,0.12); }

  /* ── 代码列：行内屏蔽按钮，hover 时显示 ── */
  .symbol-cell { display: inline-flex; align-items: center; gap: 5px; }
  .btn-block-inline {
    display: none; background: none; border: 1px solid #555; color: #777;
    font-size: 11px; line-height: 1; padding: 1px 4px; border-radius: 3px;
    cursor: pointer; flex-shrink: 0;
  }
  tr:hover .btn-block-inline { display: inline-block; }
  .btn-block-inline:hover { border-color: #ef5350; color: #ef5350; }

  /* ── 状态栏 ── */
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: #888; margin-bottom: 8px; padding: 0 2px;
  }
  .rule-summary { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .rule-tag {
    padding: 2px 8px; border-radius: 3px; font-size: 11px;
    border: 1px solid #26a69a44; color: #26a69a; background: #26a69a0a;
  }

  /* ── 表格 ── */
  table {
    width: 100%; border-collapse: collapse;
    background-color: #252525; border-radius: 8px; overflow: hidden;
    font-size: 13px;
  }
  th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid #2e2e2e; }
  th {
    background-color: #333; color: #bbb; font-weight: 600;
    font-size: 12px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { color: #fff; }
  th.sort-asc::after  { content: ' ↑'; color: #007acc; }
  th.sort-desc::after { content: ' ↓'; color: #007acc; }
  th:first-child, td:first-child { text-align: left; padding-left: 14px; }
  tr:hover td { background-color: #2a2a2a; }

  .sym { font-weight: bold; color: #fff; font-size: 14px; }
  .up   { color: #26a69a; }
  .down { color: #ef5350; }
  .flat { color: #888; }
  .no-data { color: #555; }

  .vol-cell { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
  .mini-bar { width: 32px; height: 3px; background: #333; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
  .mini-bar-fill { height: 100%; background: #007acc; border-radius: 2px; }

  .nodata-badge {
    font-size: 10px; padding: 1px 5px; border-radius: 2px;
    background: #66666622; border: 1px solid #66666655;
    color: #888; margin-left: 5px; vertical-align: middle;
  }

  /* ── 宽限期保留行（已掉出活跃列表，仍在保留期内显示）── */
  tr.grace-row td {
    background-color: rgba(240, 160, 32, 0.06);
  }
  tr.grace-row:hover td {
    background-color: rgba(240, 160, 32, 0.12);
  }
  tr.grace-row td:first-child {
    border-left: 3px solid #f0a02066;
  }
  tr.grace-row .sym {
    color: #f0c060;
  }
  /* 置顶保留档（成交次数达标，保留5分钟并置顶）：颜色更深更醒目 */
  tr.grace-row.grace-pinned td {
    background-color: rgba(240, 160, 32, 0.11);
  }
  tr.grace-row.grace-pinned:hover td {
    background-color: rgba(240, 160, 32, 0.17);
  }
  tr.grace-row.grace-pinned td:first-child {
    border-left: 3px solid #f0a020;
  }
  tr.grace-row.grace-pinned .sym {
    color: #ffb74d;
  }
  .grace-badge {
    font-size: 10px; padding: 1px 5px; border-radius: 2px;
    background: #f0a02022; border: 1px solid #f0a02055;
    color: #f0c060; margin-left: 5px; vertical-align: middle; white-space: nowrap;
  }
  .grace-badge.pinned {
    background: #f0a02038; border: 1px solid #f0a02088;
    color: #ffb74d; font-weight: 600;
  }

  /* ── 冰山爆单（连击） ── */
  tr.iceberg-row td {
    background-color: rgba(233, 30, 99, 0.08);
  }
  tr.iceberg-row:hover td {
    background-color: rgba(233, 30, 99, 0.15);
  }
  tr.iceberg-row td:first-child {
    border-left: 3px solid #e91e63;
  }
  tr.iceberg-row .sym {
    color: #f48fb1;
  }
  
  /* 刚触发时的呼吸闪烁 */
  @keyframes burst-flash {
    0%, 100% { background-color: rgba(233, 30, 99, 0.08); }
    50% { background-color: rgba(233, 30, 99, 0.25); }
  }
  tr.iceberg-flash td {
    animation: burst-flash 1s infinite;
  }

  .burst-badge {
    font-size: 10px; padding: 1px 5px; border-radius: 2px;
    background: #e91e6322; border: 1px solid #e91e6355;
    color: #f48fb1; margin-left: 5px; vertical-align: middle; white-space: nowrap; font-weight: bold;
    box-shadow: 0 0 5px rgba(233, 30, 99, 0.3);
  }

  .empty-row td { text-align: center; padding: 60px; color: #555; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #333; border-top-color: #007acc;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .filter-panel { gap: 10px; }
    .header-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
    #block-modal { width: 90vw; }
  }

  /* ── 跨股冰山联动区块 ── */ 
  #cross-iceberg-section { 
    margin-bottom: 16px; display: none; 
  } 
  #cross-iceberg-section.visible { display: block; } 
  .cross-ice-header { 
    font-size: 13px; color: #ce93d8; margin-bottom: 8px; 
    display: flex; align-items: center; gap: 8px; 
  } 
  .cross-ice-header .dot { 
    width: 8px; height: 8px; border-radius: 50%; 
    background: #ab47bc; box-shadow: 0 0 6px #ab47bc; 
  } 
  .cross-ice-table { 
    width: 100%; border-collapse: collapse; 
    background: #252525; border-radius: 8px; overflow: hidden; font-size: 13px; 
  } 
  .cross-ice-table th { 
    background: #2e2e2e; color: #ce93d8; font-weight: 600; 
    padding: 8px 12px; text-align: left; font-size: 12px; 
  } 
  .cross-ice-table td { 
    padding: 8px 12px; border-bottom: 1px solid #2e2e2e; color: #ddd; 
  } 
  .cross-ice-table tr { 
    border-left: 3px solid #ab47bc; 
  } 
  .cross-ice-table tr:hover td { background: #2a2a2a; } 
  .cross-ice-core { 
    font-weight: bold; color: #ce93d8; font-size: 14px; 
  } 
  .cross-ice-pair { 
    font-size: 12px; color: #bbb; margin-left: 4px; 
  } 
  .cross-ice-pair .partner { color: #e1bee7; font-weight: 600; } 
  .cross-ice-pair .detail { color: #888; } 

  @keyframes cross-ice-flash { 
    0%, 100% { background-color: rgba(171, 71, 188, 0.08); } 
    50% { background-color: rgba(171, 71, 188, 0.28); } 
  } 
  .cross-ice-table tr.cross-flash td { 
    animation: cross-ice-flash 1s infinite; 
  } 
</style>
</head>
<body>
<div class="container">

  <!-- 导航 -->
  <div class="nav-links">
    <a href="/alerts">价格提醒</a>
    <a href="/volume-alerts">放量提醒</a>
    <a href="/hills">山丘形态</a>
    <a href="/hill-alerts">山丘放量</a>
    <a href="/ranking">涨跌排名</a>
    <a href="/l2-alerts">L2大单</a>
    <a href="/screener">选股器</a>
    <a href="/swing-screener">波段扫描</a>
    <a href="/stable-screener">稳定选股</a>
    <a href="/oscillator-screener">震荡筛选</a>
    <a href="/boundary-alerts">边界预警</a>
    <a href="/active-trading" class="active">活跃主买</a>
    <a href="/abnormal-trades">异常成交</a>
    <span id="wl-status" style="font-size:12px;color:#ff9800;margin-left:12px;display:inline-block;vertical-align:middle;"></span>
    </div>

  <div class="header-bar">
    <span class="title">活跃成交股票</span>
    <div class="header-right">
      <button class="block-btn" id="btn-manage-block" onclick="openBlockModal()">🚫 屏蔽管理</button>
      <span id="status-text" style="font-size:12px;color:#888;">
        <span class="status-dot" id="status-dot"></span>初始化
      </span>
      <span class="refresh-info" id="refresh-timer">10s 后刷新</span>
    </div>
  </div>

  <!-- 筛选面板 -->
  <div class="filter-panel-wrap">
    <div class="filter-toggle-bar" onclick="toggleFilter()">
      <div class="filter-toggle-left">
        <span class="filter-toggle-label">筛选条件</span>
        <div class="filter-active-pills" id="filterPills"></div>
      </div>
      <span class="filter-chevron" id="filterChevron">▼</span>
    </div>
    <div class="filter-body" id="filterBody">
      <div class="filter-panel">
        <div class="filter-group">
          <label>价格区间</label>
          <div class="filter-row">
            <input type="number" id="priceMin" placeholder="最低" step="0.01">
            <span class="filter-sep">—</span>
            <input type="number" id="priceMax" placeholder="最高" step="0.01">
          </div>
        </div>
        <div class="filter-group">
          <label>成交量区间</label>
          <div class="filter-row">
            <input type="number" id="volMin" placeholder="最低" step="1">
            <span class="filter-sep">—</span>
            <input type="number" id="volMax" placeholder="最高" step="1">
          </div>
        </div>
        <div class="filter-group">
          <label>当日波动区间（高-低，元）</label>
          <div class="filter-row">
            <input type="number" id="dayRangeMin" placeholder="最低" step="0.01">
            <span class="filter-sep">—</span>
            <input type="number" id="dayRangeMax" placeholder="最高" step="0.01">
          </div>
        </div>
        <div class="filter-group">
          <label>挂单价差区间（买卖价差，元）</label>
          <div class="filter-row">
            <input type="number" id="spreadMin" placeholder="最低" step="0.001">
            <span class="filter-sep">—</span>
            <input type="number" id="spreadMax" placeholder="最高" step="0.001">
          </div>
        </div>
        <div class="filter-group">
          <input type="text" id="blockInput" placeholder="屏蔽代码，如 AAPL, TSLA" style="width: 140px; text-transform: uppercase;">
          <div class="filter-row" style="margin-top:4px;">
            <button class="btn" onclick="addBlocked()">屏蔽</button>
          </div>
          <div class="filter-active-pills" id="blockedPills" style="margin-top: 6px; max-width: 220px;"></div>
        </div>
        <div class="filter-actions">
          <button class="btn" onclick="clearFilters()">清除</button>
          <button class="btn primary" onclick="applyFilter()">筛选</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="rule-summary">
      <span class="rule-tag">数据源：market_data.active_trading_symbols</span>
      <span class="rule-tag">预警条件：1分钟内成交次数 &gt; 3</span>
      <span class="rule-tag" style="border-color:#e91e6344;color:#e91e63;background:#e91e630a;">冰山捕捉：2秒内同股数连击 &gt; 3次</span>
    </div>
    <span id="count-info">—</span>
  </div>

  <!-- 跨股冰山联动 --> 
  <div id="cross-iceberg-section"> 
    <div class="cross-ice-header"> 
      <span class="dot"></span> 
      <span>跨股冰山联动</span> 
    </div> 
    <table class="cross-ice-table"> 
      <thead> 
        <tr> 
          <th>核心股票</th> 
          <th>联动配对</th> 
          <th>首次检测</th> 
        </tr> 
      </thead> 
      <tbody id="cross-ice-tbody"></tbody> 
    </table> 
  </div> 

  <!-- 主表格 -->
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('symbol')">代码</th>
        <th onclick="sortBy('last_price')">现价</th>
        <th onclick="sortBy('change_pct')">涨跌%</th>
        <th onclick="sortBy('total_volume')">成交量</th>
        <th onclick="sortBy('day_range')" title="今日最高价-最低价">当日波动</th>
        <th onclick="sortBy('bid')" title="买一/卖一价">买一 / 卖一</th>
        <th onclick="sortBy('spread')" title="卖一-买一">价差</th>
        <th onclick="sortBy('trade_count')" title="过去window_secs秒内的成交次数" class="sort-desc">1分钟成交次数</th>
        <th onclick="sortBy('first_detected_at')" title="本次被判定为活跃的起始时间">首次检测</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr class="empty-row"><td colspan="9"><span class="spinner"></span>加载中…</td></tr>
    </tbody>
  </table>

</div>

<!-- 右键菜单 -->
<div id="ctx-menu">
  <div class="ctx-item danger" id="ctx-block">屏蔽此股票</div>
</div>

<!-- 屏蔽管理浮层 -->
<div id="block-modal-overlay" onclick="closeBlockModal(event)">
  <div id="block-modal">
    <div class="modal-header">
      <span>🚫 屏蔽股票管理 <span style="color:#555;font-size:12px;margin-left:8px">所有页面同步，仅存本机浏览器</span></span>
      <button class="modal-close" onclick="closeBlockModal()">×</button>
    </div>
    <div class="modal-add">
      <input type="text" id="manual-block-input" placeholder="手动输入代码,如 AAPL">
      <button onclick="addManualBlock()">添加屏蔽</button>
    </div>
    <div class="modal-body" id="block-list"></div>
    <div class="modal-footer">
      <button class="btn-danger" onclick="clearAllBlocked()">清空全部</button>
      <button onclick="closeBlockModal()">关闭</button>
    </div>
  </div>
</div>

<script src="/js/whitelist.js"></script>
<script>
// ── STATE ────────────────────────────────────────────────────────────────
let allData = [];
let sortedData = [];
let sortKey = 'trade_count';
let sortDir = -1;
let filterOpen = false;
let countdown = 10;
let maxVol = 1;
let blockedStocks = JSON.parse(localStorage.getItem('sharedBlockedStocks') || '[]');

const FILTER_IDS = ['priceMin','priceMax','volMin','volMax','dayRangeMin','dayRangeMax','spreadMin','spreadMax'];
const FILTER_QUERY_KEYS = FILTER_IDS.map(id => id.replace(/([A-Z])/g, '_$1').toLowerCase());
const NAV_STATE_KEY = 'rememberedFilterUrls';
const NAV_PERSIST_PATHS = new Set(['/ranking','/screener','/stable-screener','/active-trading','/swing-screener','/oscillator-screener','/abnormal-trades']);

function queryKeyToId(key) {
  return key.replace(/_([a-z])/g, (_, ch) => ch.toUpperCase());
}
function readFiltersFromDom() {
  const filters = {};
  FILTER_IDS.forEach(id => {
    const value = document.getElementById(id)?.value.trim();
    if (value) filters[id.replace(/([A-Z])/g, '_$1').toLowerCase()] = value;
  });
  return filters;
}
function writeFiltersToDom(filters) {
  FILTER_QUERY_KEYS.forEach(key => {
    const el = document.getElementById(queryKeyToId(key));
    if (el) el.value = filters[key] || '';
  });
}
function syncFiltersToUrl() {
  const url = new URL(window.location.href);
  FILTER_QUERY_KEYS.forEach(key => url.searchParams.delete(key));
  Object.entries(readFiltersFromDom()).forEach(([key, value]) => {
    if (value) url.searchParams.set(key, value);
  });
  window.history.replaceState({}, '', url);
  rememberCurrentUrl();
  hydrateRememberedNavLinks();
}
function restoreFiltersFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const filters = {};
  FILTER_QUERY_KEYS.forEach(key => {
    const value = params.get(key);
    if (value !== null) filters[key] = value;
  });
  writeFiltersToDom(filters);
}
function loadRememberedNavUrls() {
  try {
    return JSON.parse(sessionStorage.getItem(NAV_STATE_KEY) || '{}');
  } catch (_) {
    return {};
  }
}
function hydrateRememberedNavLinks() {
  const saved = loadRememberedNavUrls();
  document.querySelectorAll('.nav-links a[href]').forEach(link => {
    const href = link.getAttribute('href');
    if (NAV_PERSIST_PATHS.has(href) && saved[href]) link.href = saved[href];
  });
}
function rememberCurrentUrl() {
  const path = window.location.pathname;
  if (!NAV_PERSIST_PATHS.has(path)) return;
  const saved = loadRememberedNavUrls();
  saved[path] = `${path}${window.location.search}${window.location.hash}`;
  sessionStorage.setItem(NAV_STATE_KEY, JSON.stringify(saved));
}

// ── 宽限期保留：股票掉出活跃列表后，按掉线前成交次数保留一段时间再彻底移除 ──
const GRACE_LOW_MS  = 2 * 60 * 1000;  // 成交次数 < 10：保留 2 分钟
const GRACE_HIGH_MS = 5 * 60 * 1000;  // 成交次数 >= 10：保留 5 分钟并置顶
const GRACE_HIGH_THRESHOLD = 10;
let trackedMap = new Map(); // symbol -> 行数据（跨多次拉取持久化，承载宽限期状态）

// ── FETCH ────────────────────────────────────────────────────────────────
// 注：价格/成交量/当日波动/价差筛选完全在前端 applyFilter() 中处理，不向后端传递，
// 因为后端 active_trading_symbols 表的语义是"当前全量活跃股票"——一旦按这些条件筛选，
// 前端宽限期保留逻辑（mergeFreshData）就无法分辨"真的掉出活跃列表"和"仅仅不满足筛选范围"，
// 会把被筛掉的股票误判为已掉线，导致筛选条件被宽限期机制绕过、看起来"时好时坏"。
// ── 跨股冰山联动：归并 + 渲染 ────────────────────────────────────────── 
function mergeCrossIceberg(rows) { 
  if (!rows || rows.length === 0) return []; 

  // 统计每只股票出现次数 
  const freq = {}; 
  for (const r of rows) { 
    const syms = r.symbol_group.split(','); 
    for (const s of syms) freq[s] = (freq[s] || 0) + 1; 
  } 

  // 归并：确定核心股票 
  const groups = {}; // core -> [{partner, size, seconds, times, updated_at, detected_at}] 
  for (const r of rows) { 
    const syms = r.symbol_group.split(','); 
    // 核心 = 出现次数多的；相同则字母序靠前 
    const sorted = [...syms].sort((a, b) => { 
      const diff = (freq[b] || 0) - (freq[a] || 0); 
      if (diff !== 0) return diff; 
      return a.localeCompare(b); 
    }); 
    const core = sorted[0]; 
    const partner = sorted.length > 1 ? sorted[1] : ''; 
    if (!groups[core]) groups[core] = { pairs: [], detected_at: r.detected_at, updated_at: r.updated_at }; 
    groups[core].pairs.push({ 
      partner, 
      size: r.trade_size, 
      seconds: r.match_count, 
      times: r.matched_times, 
      updated_at: r.updated_at, 
    }); 
    // 取最早的 detected_at 
    if (r.detected_at < groups[core].detected_at) groups[core].detected_at = r.detected_at; 
    // 取最新的 updated_at 
    if (r.updated_at > groups[core].updated_at) groups[core].updated_at = r.updated_at; 
  } 

  // 转为数组，按配对数量降序 
  return Object.entries(groups) 
    .map(([core, g]) => ({ core, ...g })) 
    .sort((a, b) => b.pairs.length - a.pairs.length); 
} 

function renderCrossIceberg(grouped) { 
  const section = document.getElementById('cross-iceberg-section'); 
  const tbody = document.getElementById('cross-ice-tbody'); 
  if (!grouped || grouped.length === 0) { 
    section.classList.remove('visible'); 
    return; 
  } 
  section.classList.add('visible'); 

  const now = Date.now(); 
  let html = ''; 
  for (const g of grouped) { 
    const updMs = new Date(g.updated_at).getTime(); 
    const flash = (now - updMs) < 5000 ? ' cross-flash' : ''; 
    const pairsHtml = g.pairs.map(p => 
      `<span class="cross-ice-pair"><span class="partner">${p.partner}</span><span class="detail">(${p.size}×${p.seconds}s)</span></span>` 
    ).join(', '); 
    const detectedTime = g.detected_at 
      ? new Date(g.detected_at).toLocaleTimeString('zh-CN', { hour12: false }) 
      : '-'; 
    html += `<tr class="${flash}"> 
      <td><span class="cross-ice-core">${g.core}</span></td> 
      <td>${pairsHtml}</td> 
      <td>${detectedTime}</td> 
    </tr>`; 
  } 
  tbody.innerHTML = html; 
} 

let isFetching = false;
async function fetchData() {
  if (isFetching) return;
  isFetching = true;
  const dot  = document.getElementById('status-dot');
  const stxt = document.getElementById('status-text');
  try {
    const res = await fetch('/api/active-trading');
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    mergeFreshData(window.Whitelist ? window.Whitelist.filter(json.symbols || []) : (json.symbols || []));

    maxVol = allData.reduce((m, r) => Math.max(m, Number(r.total_volume)||0), 1);

    if (dot) dot.className = 'status-dot live';
    if (stxt) stxt.innerHTML = `<span class="status-dot live"></span>实时 · ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`;

    // 跨股冰山联动 
    const crossGrouped = mergeCrossIceberg(json.cross_iceberg || []); 
    renderCrossIceberg(crossGrouped); 

    applyFilter();
  } catch(e) {
    if (dot) dot.className = 'status-dot error';
    if (stxt) stxt.innerHTML = `<span class="status-dot error"></span>连接失败`;
    console.error(e);
  } finally {
    isFetching = false;
  }
}

// ── 合并本次拉取结果到 trackedMap，处理掉出活跃列表股票的宽限期保留 ──────────
function mergeFreshData(freshRows) {
  const now = Date.now();
  const freshSymbols = new Set();

  for (const r of freshRows) {
    freshSymbols.add(r.symbol);
    r._firstDetectedMs = r.first_detected_at ? new Date(r.first_detected_at).getTime() : null;
    r._active = true;
    r._graceUntilMs = null;
    r._pinned = false;
    
    // 如果 trade_count 为 null (仅在 iceberg 表中存在)，尝试从 trackedMap 继承旧数据
    if (r.trade_count == null && trackedMap.has(r.symbol)) {
      const oldRow = trackedMap.get(r.symbol);
      r.trade_count = oldRow.trade_count;
      r.first_detected_at = oldRow.first_detected_at;
      r._firstDetectedMs = oldRow._firstDetectedMs;
    }

    // 冰山单判断
    r._icebergPinned = !!r.iceberg_updated_at;
    if (r.iceberg_updated_at) {
      const iceMs = new Date(r.iceberg_updated_at).getTime();
      // 如果 updated_at 在最近 5 秒内，开启闪烁效果
      r._icebergFlash = (now - iceMs) < 5000;
    } else {
      r._icebergFlash = false;
    }

    trackedMap.set(r.symbol, r);
  }

  const toDelete = [];
  for (const [sym, row] of trackedMap) {
    if (freshSymbols.has(sym)) continue; // 本次仍在活跃列表中

    if (row._active === false) {
      // 已处于宽限期，检查是否到期
      if (row._graceUntilMs != null && now >= row._graceUntilMs) toDelete.push(sym);
      continue;
    }

    // 本次首次掉出活跃列表
    if (!row.has_market_data) {
      // 本就没有行情数据、从未展示过，无需保留
      toDelete.push(sym);
      continue;
    }
    const tc = Number(row.trade_count) || 0;
    const isHigh = tc >= GRACE_HIGH_THRESHOLD;
    row._active = false;
    row._pinned = isHigh;
    row._icebergPinned = false; // 掉出活跃列表时取消冰山置顶状态
    row._icebergFlash = false;
    row._graceUntilMs = now + (isHigh ? GRACE_HIGH_MS : GRACE_LOW_MS);
  }
  toDelete.forEach(sym => trackedMap.delete(sym));

  allData = Array.from(trackedMap.values());
}

// ── APPLY FILTER & SORT ───────────────────────────────────────────────────
function applyFilter() {
  syncFiltersToUrl();
  updateHighlights();
  const priceMin    = getV('priceMin');
  const priceMax    = getV('priceMax');
  const volMin      = getV('volMin');
  const volMax      = getV('volMax');
  const dayRangeMin = getV('dayRangeMin');
  const dayRangeMax = getV('dayRangeMax');
  const spreadMin   = getV('spreadMin');
  const spreadMax   = getV('spreadMax');

  const filtered = allData.filter(row => {
    if (blockedStocks.includes(row.symbol)) return false;

    // 没有行情数据的股票直接过滤掉，不在列表中显示
    if (!row.has_market_data) return false;

    // 宽限期内的股票（已掉出活跃列表，仍在保留期）同样受筛选条件约束，
    // 只是用掉线前最后一次的数据快照参与判断——宽限期只负责延迟移除时机，
    // 不应成为绕开筛选条件的后门。
    const price    = Number(row.last_price)  || 0;
    const vol      = Number(row.total_volume) || 0;
    const dayRange = row.day_range != null ? Number(row.day_range) : null;
    const spread   = row.spread    != null ? Number(row.spread)    : null;
    if (priceMin    !== null && price    < priceMin)    return false;
    if (priceMax    !== null && price    > priceMax)    return false;
    if (volMin      !== null && vol      < volMin)      return false;
    if (volMax      !== null && vol      > volMax)      return false;
    if (dayRangeMin !== null && (dayRange === null || dayRange < dayRangeMin)) return false;
    if (dayRangeMax !== null && (dayRange === null || dayRange > dayRangeMax)) return false;
    if (spreadMin   !== null && (spread === null || spread < spreadMin))       return false;
    if (spreadMax   !== null && (spread === null || spread > spreadMax))       return false;
    return true;
  });

  sortedData = [...filtered].sort((a, b) => {
    // 冰山连击最高优先级置顶
    const iceA = a._icebergPinned ? 0 : 1;
    const iceB = b._icebergPinned ? 0 : 1;
    if (iceA !== iceB) return iceA - iceB;

    // 高保留档（成交次数>=10的宽限期股票）次级置顶
    const pinA = a._pinned ? 0 : 1;
    const pinB = b._pinned ? 0 : 1;
    if (pinA !== pinB) return pinA - pinB;

    const va = sortKey === 'symbol'
      ? a[sortKey]
      : sortKey === 'first_detected_at'
        ? (a._firstDetectedMs ?? -Infinity)
        : (a[sortKey] != null ? Number(a[sortKey]) : -Infinity);
    const vb = sortKey === 'symbol'
      ? b[sortKey]
      : sortKey === 'first_detected_at'
        ? (b._firstDetectedMs ?? -Infinity)
        : (b[sortKey] != null ? Number(b[sortKey]) : -Infinity);
    return va < vb ? sortDir : va > vb ? -sortDir : 0;
  });

  const activeCount = allData.filter(r => r._active !== false).length;
  document.getElementById('count-info').textContent =
    `活跃 ${activeCount} 只 · 显示 ${sortedData.length} 只`;

  renderTable();
}

function getV(id) {
  const v = document.getElementById(id)?.value.trim();
  return (!v || v === '') ? null : Number(v);
}

function updateHighlights() {
  FILTER_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('has-value', el.value.trim() !== '');
  });
  const pairs = [
    ['priceMin','priceMax','价格'],
    ['volMin','volMax','成交量'],
    ['dayRangeMin','dayRangeMax','当日波动'],
    ['spreadMin','spreadMax','价差'],
  ];
  const pills = document.getElementById('filterPills');
  if (!pills) return;
  pills.innerHTML = pairs
    .filter(([a, b]) => document.getElementById(a)?.value.trim() || document.getElementById(b)?.value.trim())
    .map(([a, b, label]) => {
      const va = document.getElementById(a)?.value.trim();
      const vb = document.getElementById(b)?.value.trim();
      const range = va && vb ? `${va}–${vb}` : va ? `≥${va}` : `≤${vb}`;
      return `<span class="filter-pill">${label} ${range}</span>`;
    }).join('');
}

function clearFilters() {
  FILTER_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = ''; el.classList.remove('has-value'); }
  });
  syncFiltersToUrl();
  applyFilter();
}

function toggleFilter() {
  filterOpen = !filterOpen;
  document.getElementById('filterBody').classList.toggle('open', filterOpen);
  document.getElementById('filterChevron').classList.toggle('open', filterOpen);
}

// ── SORT ──────────────────────────────────────────────────────────────────
function sortBy(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = -1; }
  document.querySelectorAll('thead th').forEach((th, i) => {
    th.classList.remove('sort-asc', 'sort-desc');
  });
  const idx = ['symbol','last_price','change_pct','total_volume','day_range','bid','spread','trade_count','first_detected_at'].indexOf(key);
  const th = document.querySelectorAll('thead th')[idx];
  if (th) th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
  applyFilter();
}

// ── RENDER ───────────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('tbody');
  if (sortedData.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="9">暂无活跃成交股票</td></tr>`;
    return;
  }
  tbody.innerHTML = sortedData.map(buildRowHTML).join('');
}

function buildRowHTML(r) {
  const pct  = Number(r.change_pct) || 0;
  const pcls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const sign = pct > 0 ? '+' : '';
  const vol  = Number(r.total_volume) || 0;
  const vPct = Math.min(100, maxVol > 0 ? vol / maxVol * 100 : 0);
  const bidAsk = (r.bid != null && r.ask != null) ? `${fmt(r.bid,3)} / ${fmt(r.ask,3)}` : '—';
  const spreadStr = r.spread != null ? fmt(r.spread, 4) : '—';

  const isGrace   = r._active === false;
  let rowClass  = isGrace ? (r._pinned ? ' grace-row grace-pinned' : ' grace-row') : '';

  if (r._icebergPinned) {
    rowClass += ' iceberg-row';
    if (r._icebergFlash) rowClass += ' iceberg-flash';
  }

  const graceBadge = isGrace
    ? `<span class="grace-badge${r._pinned ? ' pinned' : ''}">${r._pinned ? '置顶保留中' : '保留中'}</span>`
    : '';

  let icebergBadge = '';
  if (r._icebergPinned) {
    icebergBadge = `<span class="burst-badge">⚡ ${r.iceberg_size}股×${r.iceberg_count}连击</span>`;
  }

  return `<tr data-sym="${r.symbol}" class="${rowClass.trim()}">
    <td><div class="symbol-cell"><span class="sym symbol">${r.symbol}</span><button class="btn-block-inline" onclick="blockStock('${r.symbol}')" title="屏蔽此股票">×</button>${icebergBadge}${graceBadge}</div></td>
    <td class="${pcls}">${fmt(r.last_price, 2)}</td>
    <td class="${pcls}">${sign}${pct.toFixed(2)}%</td>
    <td><div class="vol-cell">${fmtVol(vol)}<div class="mini-bar"><div class="mini-bar-fill" style="width:${vPct.toFixed(1)}%"></div></div></div></td>
    <td>${r.day_range != null ? fmt(r.day_range, 2) : '—'}</td>
    <td>${bidAsk}</td>
    <td>${spreadStr}</td>
    <td>${r.trade_count != null ? r.trade_count : '—'}</td>
    <td style="color:#888;font-size:12px;">${fmtTime(r.first_detected_at)}</td>
  </tr>`;
}

// ── BLOCKED STOCKS（所有页面共享 localStorage key，跨页面同步）──────────────
function saveBlocked() {
  localStorage.setItem('sharedBlockedStocks', JSON.stringify(blockedStocks));
  const btn = document.getElementById('btn-manage-block');
  if (btn) {
    if (blockedStocks.length > 0) {
      btn.classList.add('has-blocked');
      btn.textContent = `🚫 屏蔽管理 (${blockedStocks.length})`;
    } else {
      btn.classList.remove('has-blocked');
      btn.textContent = '🚫 屏蔽管理';
    }
  }
  renderBlockedPills();
  renderBlockList();
}

function blockStock(sym) {
  sym = (sym || '').trim().toUpperCase();
  if (!sym || blockedStocks.includes(sym)) return;
  blockedStocks.push(sym);
  saveBlocked();
  applyFilter();
}

function unblockStock(sym) {
  blockedStocks = blockedStocks.filter(s => s !== sym);
  saveBlocked();
  applyFilter();
}

function clearAllBlocked() {
  if (blockedStocks.length === 0) return;
  if (!confirm('确认清空所有屏蔽股票?')) return;
  blockedStocks = [];
  saveBlocked();
  applyFilter();
}

function renderBlockedPills() {
  const pills = document.getElementById('blockedPills');
  if (!pills) return;
  pills.innerHTML = blockedStocks.map(sym =>
    `<span class="filter-pill" style="background:#ef53501a; border-color:#ef535044; color:#ef5350; display:flex; align-items:center;">
      ${sym} <span style="cursor:pointer; margin-left:4px; font-weight:bold; font-size:12px;" onclick="unblockStock('${sym}')">×</span>
    </span>`
  ).join('');
}

function addBlocked() {
  const input = document.getElementById('blockInput');
  if (!input) return;
  const val = input.value.trim().toUpperCase();
  if (!val) return;

  const symbols = val.split(/[,，\s]+/).map(s => s.trim()).filter(s => s);
  for (const sym of symbols) blockStock(sym);
  input.value = '';
}

function addManualBlock() {
  const input = document.getElementById('manual-block-input');
  if (!input) return;
  const val = input.value.trim().toUpperCase();
  if (!val) return;
  const symbols = val.split(/[,，\s]+/).map(s => s.trim()).filter(s => s);
  for (const sym of symbols) blockStock(sym);
  input.value = '';
}

function openBlockModal() {
  renderBlockList();
  document.getElementById('block-modal-overlay').classList.add('open');
}

function closeBlockModal(e) {
  if (e && e.target !== document.getElementById('block-modal-overlay')) return;
  document.getElementById('block-modal-overlay').classList.remove('open');
}

function renderBlockList() {
  const container = document.getElementById('block-list');
  if (!container) return;
  if (blockedStocks.length === 0) {
    container.innerHTML = '<div class="modal-empty">暂无屏蔽股票</div>';
    return;
  }
  container.innerHTML = [...blockedStocks].sort().map(sym => `
    <div class="block-item">
      <span class="block-item-code">${sym}</span>
      <button class="unblock-btn" onclick="unblockStock('${sym}')">解除屏蔽</button>
    </div>
  `).join('');
}

// ── UTILS ─────────────────────────────────────────────────────────────────
function fmt(v, dec) {
  const n = Number(v);
  return isNaN(n) ? '—' : n.toFixed(dec);
}
function fmtVol(v) {
  return v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(1)+'K' : String(Math.round(v));
}
function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('zh-CN', { hour12: false });
}

// ── COUNTDOWN & AUTO REFRESH ──────────────────────────────────────────────
setInterval(() => {
  if (countdown <= 0) {
    fetchData();
    countdown = 10;
  } else {
    countdown--;
  }
  document.getElementById('refresh-timer').textContent = `${countdown}s 后刷新`;
}, 1000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { fetchData(); countdown = 10; }
});

FILTER_IDS.forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', () => applyFilter());
  el.addEventListener('keydown', e => { if (e.key === 'Enter') applyFilter(); });
});

restoreFiltersFromUrl();
rememberCurrentUrl();
hydrateRememberedNavLinks();

const blockInputEl = document.getElementById('blockInput');
if (blockInputEl) {
  blockInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addBlocked();
    }
  });
}

const manualBlockInputEl = document.getElementById('manual-block-input');
if (manualBlockInputEl) {
  manualBlockInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addManualBlock();
    }
  });
}

// ── 右键菜单：屏蔽此股票 ──────────────────────────────────────────────────
let ctxTarget = null;
const ctxMenu = document.getElementById('ctx-menu');

document.getElementById('tbody').addEventListener('contextmenu', e => {
  const tr = e.target.closest('tr[data-sym]');
  if (!tr) return;
  e.preventDefault();
  ctxTarget = tr.dataset.sym;

  document.getElementById('ctx-block').textContent = `🚫 屏蔽 ${ctxTarget}`;
  ctxMenu.style.display = 'block';
  const x = Math.min(e.clientX, window.innerWidth  - ctxMenu.offsetWidth  - 4);
  const y = Math.min(e.clientY, window.innerHeight - ctxMenu.offsetHeight - 4);
  ctxMenu.style.left = x + 'px';
  ctxMenu.style.top  = y + 'px';
});

document.getElementById('ctx-block').addEventListener('click', () => {
  if (ctxTarget) blockStock(ctxTarget);
  ctxMenu.style.display = 'none';
});

document.addEventListener('click', () => { ctxMenu.style.display = 'none'; });
document.addEventListener('contextmenu', e => {
  if (!e.target.closest('#tbody')) ctxMenu.style.display = 'none';
});

saveBlocked();
fetchData();
</script>

<script>
  (function() {
    const el = document.getElementById('wl-status');
    if (!el) return;
    function update() {
      if (!window.Whitelist) return;
      const list = window.Whitelist.get();
      el.textContent = list.length > 0 ? '白名单: ' + list.length + '只' : '';
    }
    update();
    window.addEventListener('whitelist-changed', update);
  })();
</script>
