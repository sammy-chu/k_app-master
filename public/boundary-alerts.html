<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>边界预警</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #1a1a1a;
    color: #ddd;
    padding: 20px;
    line-height: 1.6;
  }
  .container { max-width: 1600px; margin: 0 auto; }

  /* ── 导航 ── */
  .nav-links { text-align: center; margin-bottom: 20px; }
  .nav-links a {
    color: #007acc; text-decoration: none; padding: 6px 14px; margin: 0 6px;
    border: 1px solid #007acc; border-radius: 4px; transition: all 0.2s;
    display: inline-block; font-size: 13px;
  }
  .nav-links a:hover { background-color: #007acc; color: white; }
  .nav-links a.active { background-color: #007acc; color: white; }

  /* ── 标题栏 ── */
  .header-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; border-bottom: 1px solid #333; padding-bottom: 12px;
  }
  .title { font-size: 1.4em; color: #ddd; font-weight: normal; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .refresh-info { font-size: 12px; color: #888; white-space: nowrap; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #555; margin-right: 6px; vertical-align: middle;
    transition: background 0.3s;
  }
  .status-dot.live  { background: #26a69a; box-shadow: 0 0 5px #26a69a; }
  .status-dot.error { background: #ef5350; }

  /* ── 筛选面板 ── */
  .filter-panel-wrap { margin-bottom: 14px; }
  .filter-toggle-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 14px; background: #2a2a2a; border-radius: 6px;
    cursor: pointer; user-select: none;
    border: 1px solid #333; transition: border-color 0.15s;
  }
  .filter-toggle-bar:hover { border-color: #444; }
  .filter-toggle-left { display: flex; align-items: center; gap: 10px; }
  .filter-toggle-label { font-size: 12px; color: #666; }
  .filter-active-pills { display: flex; gap: 5px; flex-wrap: wrap; }
  .filter-pill {
    font-size: 11px; padding: 1px 8px; border-radius: 10px;
    background: #007acc1a; border: 1px solid #007acc44; color: #7ac0f0;
  }
  .filter-chevron { font-size: 10px; color: #555; transition: transform 0.2s ease; }
  .filter-chevron.open { transform: rotate(180deg); }
  .filter-body {
    overflow: hidden; max-height: 0; opacity: 0;
    transition: max-height 0.25s ease, opacity 0.2s ease;
  }
  .filter-body.open { max-height: 180px; opacity: 1; }
  .filter-panel {
    background: #2a2a2a; padding: 12px 16px 14px;
    border-radius: 0 0 6px 6px; border-top: 1px solid #333;
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end;
  }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 12px; color: #888; }
  .filter-row { display: flex; align-items: center; gap: 5px; }
  .filter-sep { font-size: 12px; color: #555; }

  input[type=number], input[type=text] {
    background: #1a1a1a; border: 1px solid #444; color: #ddd;
    padding: 5px 8px; border-radius: 4px; font-size: 13px;
    outline: none; transition: border-color 0.15s;
  }
  input[type=number] { width: 80px; -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number]:focus, input[type=text]:focus { border-color: #007acc; }
  input[type=number]::placeholder,
  input[type=text]::placeholder { color: #555; }
  input[type=number].has-value { border-color: #007acc55; color: #7ac0f0; }

  .filter-actions { display: flex; align-items: flex-end; gap: 8px; margin-left: auto; }
  .btn {
    padding: 6px 16px; border-radius: 4px; border: 1px solid #444;
    background: #1a1a1a; color: #ccc; font-size: 13px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { border-color: #888; color: #fff; }
  .btn.primary { border-color: #007acc; color: #7ac0f0; background: #007acc18; }
  .btn.primary:hover { background: #007acc30; }

  /* ── 状态栏 ── */
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: #888; margin-bottom: 8px; padding: 0 2px;
  }
  .rule-summary { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .rule-tag {
    padding: 2px 8px; border-radius: 3px; font-size: 11px;
    border: 1px solid #ffa72644; color: #ffa726; background: #ffa7260a;
  }

  /* ── 表格 ── */
  table {
    width: 100%; border-collapse: collapse;
    background-color: #252525; border-radius: 8px; overflow: hidden;
    font-size: 13px;
  }
  th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid #2e2e2e; }
  th {
    background-color: #333; color: #bbb; font-weight: 600;
    font-size: 12px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { color: #fff; }
  th.sort-asc::after  { content: ' ↑'; color: #007acc; }
  th.sort-desc::after { content: ' ↓'; color: #007acc; }
  th:first-child, td:first-child { text-align: left; padding-left: 14px; }
  tr:hover td { background-color: #2a2a2a; }

  .sym { font-weight: bold; color: #fff; font-size: 14px; cursor: pointer; }
  .sym:hover { color: #7ac0f0; text-decoration: underline; }
  .up   { color: #26a69a; }
  .down { color: #ef5350; }
  .flat { color: #888; }

  /* ── 触发类型徽标 ── */
  .trigger-badge {
    display: inline-block; font-size: 11px; padding: 1px 7px;
    border-radius: 3px; font-weight: bold; margin-left: 4px;
    vertical-align: middle;
  }
  .trigger-4a {
    background: #26a69a18; border: 1px solid #26a69a55; color: #26a69a;
  }
  .trigger-4b {
    background: #ffa72618; border: 1px solid #ffa72655; color: #ffa726;
  }
  .trigger-4a-up {
    background: #26a69a30; border: 1px solid #26a69a88; color: #4dd0c4;
  }
  .trigger-4b-up {
    background: #ffa72630; border: 1px solid #ffa72688; color: #ffcc02;
  }

  /* ── 置顶闪烁行 ── */
  @keyframes flash-row {
    0%, 100% { background-color: transparent; }
    50%       { background-color: #ffa72610; }
  }
  tr.pinned td { font-weight: 500; }
  tr.pinned { animation: flash-row 1.2s ease-in-out infinite; border-left: 2px solid #ffa726; }
  .pin-badge {
    font-size: 10px; padding: 1px 5px; border-radius: 2px;
    background: #ffa72622; border: 1px solid #ffa72655;
    color: #ffa726; margin-left: 5px; vertical-align: middle;
  }

  /* ── 倒计时进度条 ── */
  .expire-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .expire-time { font-size: 12px; color: #888; }
  .expire-bar { width: 48px; height: 3px; background: #333; border-radius: 2px; overflow: hidden; }
  .expire-bar-fill { height: 100%; border-radius: 2px; transition: width 1s linear; }
  .expire-bar-fill.fresh  { background: #26a69a; }
  .expire-bar-fill.mid    { background: #ffa726; }
  .expire-bar-fill.ending { background: #ef5350; }

  /* ── A/B 价格条 ── */
  .ab-cell {
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 1px; font-size: 12px;
  }
  .ab-a { color: #26a69a; }
  .ab-b { color: #ffa726; }

  /* ── 计数胶囊 ── */
  .count-cell { display: flex; justify-content: flex-end; gap: 5px; }
  .cnt {
    font-size: 11px; padding: 1px 6px; border-radius: 3px;
    font-weight: bold;
  }
  .cnt-a { background: #26a69a18; border: 1px solid #26a69a44; color: #26a69a; }
  .cnt-b { background: #ffa72618; border: 1px solid #ffa72644; color: #ffa726; }
  .cnt-a.hi { background: #26a69a35; border-color: #26a69a88; color: #4dd0c4; }
  .cnt-b.hi { background: #ffa72635; border-color: #ffa72888; color: #ffcc02; }

  /* vol bar */
  .vol-cell { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
  .mini-bar { width: 32px; height: 3px; background: #333; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
  .mini-bar-fill { height: 100%; background: #007acc; border-radius: 2px; }

  .empty-row td { text-align: center; padding: 60px; color: #555; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #333; border-top-color: #007acc;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .filter-panel { gap: 10px; }
    .header-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- 导航 -->
  <div class="nav-links">
    <a href="/alerts">价格提醒</a>
    <a href="/volume-alerts">放量提醒</a>
    <a href="/hills">山丘形态</a>
    <a href="/hill-alerts">山丘放量</a>
    <a href="/ranking">涨跌排名</a>
    <a href="/l2-alerts">L2大单</a>
    <a href="/screener">选股器</a>
    <a href="/swing-screener">波段扫描</a>
    <a href="/stable-screener">稳定选股</a>
    <a href="/oscillator-screener">震荡筛选</a>
    <a href="/boundary-alerts" class="active">边界预警</a>
  </div>

  <!-- 标题栏 -->
  <div class="header-bar">
    <h1 class="title">边界预警
      <span style="font-size:0.6em;color:#555;margin-left:8px;">7分钟滚动窗口 · 边界高频试探 · 主力试盘捕捉</span>
    </h1>
    <div class="header-right">
      <span id="status-text" style="font-size:12px;color:#888;">
        <span class="status-dot" id="status-dot"></span>初始化
      </span>
      <span class="refresh-info" id="refresh-timer">10s 后刷新</span>
    </div>
  </div>

  <!-- 筛选面板 -->
  <div class="filter-panel-wrap">
    <div class="filter-toggle-bar" onclick="toggleFilter()">
      <div class="filter-toggle-left">
        <span class="filter-toggle-label">筛选条件</span>
        <div class="filter-active-pills" id="filterPills"></div>
      </div>
      <span class="filter-chevron" id="filterChevron">▼</span>
    </div>
    <div class="filter-body" id="filterBody">
      <div class="filter-panel">
        <div class="filter-group">
          <label>价格区间</label>
          <div class="filter-row">
            <input type="number" id="priceMin" placeholder="最低" step="1" min="0">
            <span class="filter-sep">—</span>
            <input type="number" id="priceMax" placeholder="最高" step="1" min="0">
          </div>
        </div>
        <div class="filter-group">
          <label>今日成交量</label>
          <div class="filter-row">
            <input type="number" id="volMin" placeholder="最低" step="1000" min="0">
            <span class="filter-sep">—</span>
            <input type="number" id="volMax" placeholder="最高" step="1000" min="0">
          </div>
        </div>
        <div class="filter-group">
          <label>当日波动区间</label>
          <div class="filter-row">
            <input type="number" id="dayRangeMin" placeholder="最低" step="0.1" min="0">
            <span class="filter-sep">—</span>
            <input type="number" id="dayRangeMax" placeholder="最高" step="0.1" min="0">
          </div>
        </div>
        <div class="filter-group">
          <label>十日波动均值</label>
          <div class="filter-row">
            <input type="number" id="avgRangeMin" placeholder="最低" step="0.1" min="0">
            <span class="filter-sep">—</span>
            <input type="number" id="avgRangeMax" placeholder="最高" step="0.1" min="0">
          </div>
        </div>
        <div class="filter-group" style="min-width: 180px;">
          <label>屏蔽股票 (逗号分隔或回车)</label>
          <div class="filter-row">
            <input type="text" id="blockInput" placeholder="如 AAPL, TSLA" style="width: 120px; text-transform: uppercase;">
            <button class="btn" onclick="addBlocked()">屏蔽</button>
          </div>
          <div class="filter-active-pills" id="blockedPills" style="margin-top: 6px; max-width: 220px;"></div>
        </div>
        <div class="filter-actions">
          <button class="btn" onclick="clearFilters()">清空</button>
          <button class="btn primary" onclick="applyFilter()">筛选</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="rule-summary">
      <span class="rule-tag">7分钟滚动窗口</span>
      <span class="rule-tag">A = 低点 + 振幅 × 10%</span>
      <span class="rule-tag">B = 低点 + 振幅 × 90%</span>
      <span class="rule-tag">绝对约束 &lt; 0.15元</span>
      <span class="rule-tag">周期成交 &gt; 100股</span>
      <span class="rule-tag">触碰 ≥ 4次预警 · 同向达5次升级置顶闪烁3分钟</span>
    </div>
    <span id="count-info">—</span>
  </div>

  <!-- 主表格 -->
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('symbol')">代码</th>
        <th onclick="sortBy('last_price')">现价</th>
        <th onclick="sortBy('change_pct')">涨跌%</th>
        <th onclick="sortBy('total_volume')">今日量</th>
        <th onclick="sortBy('day_range')">当日波动</th>
        <th onclick="sortBy('avg_range')">10日均波动</th>
        <th onclick="sortBy('winHigh')" title="7分钟窗口高低点">窗口高/低</th>
        <th onclick="sortBy('priceA')" title="预警价A（下轨10%）和B（上轨90%）">A价 / B价</th>
        <th onclick="sortBy('maxA')" title="周期内触碰下轨(a)和上轨(b)的K线数；9点后按A/B最大值排序" class="sort-desc">触碰次数</th>
        <th onclick="sortBy('cycleVol')" title="7分钟周期内成交量">周期量</th>
        <th onclick="sortBy('anchorTime')" title="首次触发时间及到期倒计时">触发 / 剩余</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr class="empty-row"><td colspan="11"><span class="spinner"></span>加载中...</td></tr>
    </tbody>
  </table>

</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────
let allData    = [];
let sortedData = [];
let sortKey    = 'maxA';
let sortDir    = -1;
let maxVol     = 1;
let countdown  = 10;
let isFetching = false;
let blockedStocks = JSON.parse(localStorage.getItem('boundaryBlockedStocks') || '[]');

const SORT_KEYS = ['symbol','last_price','change_pct','total_volume','day_range','avg_range','winHigh','priceA','maxA','cycleVol','anchorTime'];
const FILTER_IDS = ['priceMin','priceMax','volMin','volMax','dayRangeMin','dayRangeMax','avgRangeMin','avgRangeMax'];

// ── BLOCKED STOCKS ────────────────────────────────────────────────────────
function renderBlockedPills() {
  const pills = document.getElementById('blockedPills');
  if (!pills) return;
  pills.innerHTML = blockedStocks.map(sym => 
    `<span class="filter-pill" style="background:#ef53501a; border-color:#ef535044; color:#ef5350; display:flex; align-items:center;">
      ${sym} <span style="cursor:pointer; margin-left:4px; font-weight:bold; font-size:12px;" onclick="removeBlocked('${sym}')">×</span>
    </span>`
  ).join('');
}

function addBlocked() {
  const input = document.getElementById('blockInput');
  if (!input) return;
  const val = input.value.trim().toUpperCase();
  if (!val) return;
  
  const symbols = val.split(/[,，\s]+/).map(s => s.trim()).filter(s => s);
  let changed = false;
  for (const sym of symbols) {
    if (!blockedStocks.includes(sym)) {
      blockedStocks.push(sym);
      changed = true;
    }
  }
  if (changed) {
    localStorage.setItem('boundaryBlockedStocks', JSON.stringify(blockedStocks));
    renderBlockedPills();
    applyFilter();
  }
  input.value = '';
}

function removeBlocked(sym) {
  blockedStocks = blockedStocks.filter(s => s !== sym);
  localStorage.setItem('boundaryBlockedStocks', JSON.stringify(blockedStocks));
  renderBlockedPills();
  applyFilter();
}


// ── FILTER TOGGLE ─────────────────────────────────────────────────────────
let filterOpen = false;
function toggleFilter() {
  filterOpen = !filterOpen;
  document.getElementById('filterBody').classList.toggle('open', filterOpen);
  document.getElementById('filterChevron').classList.toggle('open', filterOpen);
}

function getV(id) {
  const v = document.getElementById(id)?.value.trim();
  return (!v || v === '') ? null : Number(v);
}

// 判断北京时间是否已过 9:00（开盘8:00后1小时）
// 8:00-9:00 触碰次数排序仅看 maxA；9:00 之后 A/B 权限合并，取 max(maxA, maxB)
function isAfter9amBJ() {
  const bj = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
  const h = bj.getHours();
  return h >= 9;
}

function getTouchSortValue(row) {
  const a = Number(row.maxA) || 0;
  if (!isAfter9amBJ()) return a;
  const b = Number(row.maxB) || 0;
  return Math.max(a, b);
}

function updateHighlights() {
  FILTER_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('has-value', el.value.trim() !== '');
  });
  const pairs = [
    ['priceMin','priceMax','价格'],
    ['volMin','volMax','成交量'],
    ['dayRangeMin','dayRangeMax','当日波动'],
    ['avgRangeMin','avgRangeMax','10日均波动'],
  ];
  const pills = document.getElementById('filterPills');
  if (!pills) return;
  pills.innerHTML = pairs
    .filter(([a, b]) => document.getElementById(a)?.value.trim() || document.getElementById(b)?.value.trim())
    .map(([a, b, label]) => {
      const va = document.getElementById(a)?.value.trim();
      const vb = document.getElementById(b)?.value.trim();
      const range = va && vb ? `${va}–${vb}` : va ? `≥${va}` : `≤${vb}`;
      return `<span class="filter-pill">${label} ${range}</span>`;
    }).join('');
}

function clearFilters() {
  FILTER_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = ''; el.classList.remove('has-value'); }
  });
  applyFilter();
}

// ── SORT ──────────────────────────────────────────────────────────────────
function sortBy(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = -1; }
  document.querySelectorAll('thead th').forEach((th, i) => {
    th.classList.remove('sort-asc','sort-desc');
    if (SORT_KEYS[i] === key) th.classList.add(sortDir === -1 ? 'sort-desc' : 'sort-asc');
  });
  applyFilter();
}

// ── FETCH ─────────────────────────────────────────────────────────────────
async function fetchData() {
  if (isFetching) return;
  isFetching = true;
  const dot  = document.getElementById('status-dot');
  const stxt = document.getElementById('status-text');
  try {
    const params = {};
    const priceMin    = getV('priceMin');
    const priceMax    = getV('priceMax');
    const volMin      = getV('volMin');
    const volMax      = getV('volMax');
    const dayRangeMin = getV('dayRangeMin');
    const dayRangeMax = getV('dayRangeMax');
    const avgRangeMin = getV('avgRangeMin');
    const avgRangeMax = getV('avgRangeMax');
    if (priceMin    !== null) params.price_min     = priceMin;
    if (priceMax    !== null) params.price_max     = priceMax;
    if (volMin      !== null) params.vol_min       = volMin;
    if (volMax      !== null) params.vol_max       = volMax;
    if (dayRangeMin !== null) params.day_range_min = dayRangeMin;
    if (dayRangeMax !== null) params.day_range_max = dayRangeMax;
    if (avgRangeMin !== null) params.avg_range_min = avgRangeMin;
    if (avgRangeMax !== null) params.avg_range_max = avgRangeMax;

    const qs = Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
    const res = await fetch(`/api/boundary-alerts${qs ? '?'+qs : ''}`);
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    allData = json.alerts || [];
    // 预解析时间戳，避免每次渲染/每秒倒计时都重新 new Date() 解析字符串
    for (const r of allData) {
      r._anchorMs = new Date(r.anchorTime).getTime();
      r._expireMs = new Date(r.expireAt).getTime();
      r._pinnedUntilMs = r.pinnedUntil ? new Date(r.pinnedUntil).getTime() : null;
    }
    maxVol  = allData.reduce((m, r) => Math.max(m, Number(r.total_volume)||0), 1);

    if (dot) dot.className = 'status-dot live';
    if (stxt) stxt.innerHTML = `<span class="status-dot live"></span>实时 · ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`;

    applyFilter();
  } catch(e) {
    if (dot) dot.className = 'status-dot error';
    if (stxt) stxt.innerHTML = `<span class="status-dot error"></span>连接失败`;
    console.error(e);
  } finally {
    isFetching = false;
  }
}

// ── APPLY FILTER & SORT ───────────────────────────────────────────────────
function applyFilter() {
  updateHighlights();
  // 前端二次筛选（API 已过滤，这里处理实时输入联动）
  const priceMin    = getV('priceMin');
  const priceMax    = getV('priceMax');
  const volMin      = getV('volMin');
  const volMax      = getV('volMax');
  const dayRangeMin = getV('dayRangeMin');
  const dayRangeMax = getV('dayRangeMax');
  const avgRangeMin = getV('avgRangeMin');
  const avgRangeMax = getV('avgRangeMax');

  const filtered = allData.filter(row => {
    if (blockedStocks.includes(row.symbol)) return false;
    
    const price    = Number(row.last_price)  || 0;
    const vol      = Number(row.total_volume) || 0;
    const dayRange = Number(row.day_range)   || 0;
    const avgRange = row.avg_range != null ? Number(row.avg_range) : null;
    if (priceMin    !== null && price    < priceMin)    return false;
    if (priceMax    !== null && price    > priceMax)    return false;
    if (volMin      !== null && vol      < volMin)      return false;
    if (volMax      !== null && vol      > volMax)      return false;
    if (dayRangeMin !== null && dayRange < dayRangeMin) return false;
    if (dayRangeMax !== null && dayRange > dayRangeMax) return false;
    if (avgRangeMin !== null && (avgRange === null || avgRange < avgRangeMin)) return false;
    if (avgRangeMax !== null && (avgRange === null || avgRange > avgRangeMax)) return false;
    return true;
  });

  // 置顶行永远排最前，然后按 sortKey
  sortedData = [...filtered].sort((a, b) => {
    if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
    const va = sortKey === 'symbol'
      ? a[sortKey]
      : sortKey === 'anchorTime'
        ? a._anchorMs
        : sortKey === 'maxA'
          ? getTouchSortValue(a)
          : (Number(a[sortKey]) ?? -Infinity);
    const vb = sortKey === 'symbol'
      ? b[sortKey]
      : sortKey === 'anchorTime'
        ? b._anchorMs
        : sortKey === 'maxA'
          ? getTouchSortValue(b)
          : (Number(b[sortKey]) ?? -Infinity);
    return va < vb ? sortDir : va > vb ? -sortDir : 0;
  });

  const pinnedCount = sortedData.filter(r => r.isPinned).length;
  document.getElementById('count-info').textContent =
    `预警 ${allData.length} 只 · 显示 ${sortedData.length} 只` +
    (pinnedCount ? ` · 置顶闪烁 ${pinnedCount} 只` : '');

  renderTable();
}

// ── RENDER TABLE ──────────────────────────────────────────────────────────
const rowMap = new Map(); // symbol -> tr，增量维护，避免每次重新扫描 DOM

function renderTable() {
  const tbody = document.getElementById('tbody');
  if (sortedData.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="11">暂无预警</td></tr>`;
    rowMap.clear();
    return;
  }

  const now = Date.now();
  const seen = new Set();
  let ci = 0;
  for (const row of sortedData) {
    const html = buildRowHTML(row, now);
    let tr = rowMap.get(row.symbol);
    if (!tr) {
      tr = document.createElement('tr');
      tr.dataset.sym = row.symbol;
      rowMap.set(row.symbol, tr);
    }
    if (tr._lastHtml !== html) { tr.innerHTML = html; tr._lastHtml = html; }
    tr.className = row.isPinned ? 'pinned' : '';
    if (tbody.children[ci] !== tr) tbody.insertBefore(tr, tbody.children[ci] || null);
    seen.add(row.symbol);
    ci++;
  }
  while (tbody.children.length > sortedData.length) tbody.removeChild(tbody.lastChild);
  // 清理已不在数据集中的行，防止 rowMap 无限增长
  for (const [sym, tr] of rowMap) {
    if (!seen.has(sym)) rowMap.delete(sym);
  }
}

function buildRowHTML(r, now) {
  const pct  = Number(r.change_pct);
  const pcls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const sign = pct > 0 ? '+' : '';
  const vol  = Number(r.total_volume) || 0;
  const vPct = Math.min(100, maxVol > 0 ? vol / maxVol * 100 : 0);

  // 触发类型徽标
  const isUpgraded = r.isPinned || (r.triggerType === '4a' && r.maxA >= 5) ||
                     (r.triggerType === '4b' && r.maxB >= 5);
  const triggerClass = r.triggerType === '4a'
    ? (isUpgraded ? 'trigger-4a-up' : 'trigger-4a')
    : (isUpgraded ? 'trigger-4b-up' : 'trigger-4b');
  const triggerLabel = r.triggerType === '4a'
    ? (r.maxA >= 5 ? '5a↑' : '4a')
    : (r.maxB >= 5 ? '5b↑' : '4b');
  const triggerBadge = `<span class="trigger-badge ${triggerClass}">${triggerLabel}</span>`;

  // 置顶徽标
  let pinBadge = '';
  if (r.isPinned && r._pinnedUntilMs) {
    const remainMs  = Math.max(0, r._pinnedUntilMs - now);
    const remainSec = Math.ceil(remainMs / 1000);
    const mm = String(Math.floor(remainSec / 60)).padStart(2, '0');
    const ss = String(remainSec % 60).padStart(2, '0');
    pinBadge = `<span class="pin-badge">📌 ${mm}:${ss}</span>`;
  }

  // 倒计时进度条
  const anchorMs  = r._anchorMs;
  const expireMs  = r._expireMs;
  const totalMs   = expireMs - anchorMs;
  const remainMs2 = Math.max(0, expireMs - now);
  const pctFill   = totalMs > 0 ? (remainMs2 / totalMs * 100).toFixed(1) : 0;
  const remainSec2 = Math.ceil(remainMs2 / 1000);
  const fillCls   = pctFill > 60 ? 'fresh' : pctFill > 30 ? 'mid' : 'ending';
  const mm2 = String(Math.floor(remainSec2 / 60)).padStart(2, '0');
  const ss2 = String(remainSec2 % 60).padStart(2, '0');
  const anchorStr = new Date(anchorMs).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});

  // 触碰计数胶囊
  const aHi = r.maxA >= 5;
  const bHi = r.maxB >= 5;
  const countHTML = `
    <div class="count-cell">
      <span class="cnt cnt-a ${aHi ? 'hi' : ''}">a:${r.maxA}</span>
      <span class="cnt cnt-b ${bHi ? 'hi' : ''}">b:${r.maxB}</span>
    </div>`;

  return `
    <td><span class="sym" onclick="void(0)">${r.symbol}</span>${triggerBadge}${pinBadge}</td>
    <td class="${pcls}">${fmt(r.last_price, 2)}</td>
    <td class="${pcls}">${sign}${pct.toFixed(2)}%</td>
    <td><div class="vol-cell">${fmtVol(vol)}<div class="mini-bar"><div class="mini-bar-fill" style="width:${vPct.toFixed(1)}%"></div></div></div></td>
    <td style="color:#90caf9;">${fmt(r.day_range, 2)}</td>
    <td style="color:#90caf9;">${r.avg_range != null ? fmt(r.avg_range, 2) : '—'}</td>
    <td style="color:#bbb;font-size:12px;">${fmt(r.winHigh,2)} / ${fmt(r.winLow,2)}</td>
    <td><div class="ab-cell"><span class="ab-a">A ${fmt(r.priceA,2)}</span><span class="ab-b">B ${fmt(r.priceB,2)}</span></div></td>
    <td>${countHTML}</td>
    <td style="color:#26a69a;">${fmtVol(r.cycleVol)}</td>
    <td>
      <div class="expire-cell">
        <span class="expire-time">${anchorStr} · ${mm2}:${ss2}</span>
        <div class="expire-bar"><div class="expire-bar-fill ${fillCls}" style="width:${pctFill}%"></div></div>
      </div>
    </td>`;
}

// ── LIGHTWEIGHT PER-SECOND UPDATE (倒计时进度条) ──────────────────────────
// 每秒只更新进度条宽度/样式和文字内容，不重新拼接/diff 整行 HTML，
// 避免每秒对全部数据做一次 buildRowHTML + innerHTML 写入造成的卡顿。
function updateExpireBars() {
  const now = Date.now();
  for (const row of sortedData) {
    const tr = rowMap.get(row.symbol);
    if (!tr) continue;

    // 倒计时进度条
    const totalMs   = row._expireMs - row._anchorMs;
    const remainMs  = Math.max(0, row._expireMs - now);
    const pctFill   = totalMs > 0 ? (remainMs / totalMs * 100) : 0;
    const remainSec = Math.ceil(remainMs / 1000);
    const mm = String(Math.floor(remainSec / 60)).padStart(2, '0');
    const ss = String(remainSec % 60).padStart(2, '0');
    const fillCls = pctFill > 60 ? 'fresh' : pctFill > 30 ? 'mid' : 'ending';

    const fillEl = tr.querySelector('.expire-bar-fill');
    const timeEl = tr.querySelector('.expire-time');
    if (fillEl) {
      fillEl.style.width = pctFill.toFixed(1) + '%';
      fillEl.className = 'expire-bar-fill ' + fillCls;
    }
    if (timeEl) {
      const anchorStr = new Date(row._anchorMs).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
      timeEl.textContent = `${anchorStr} · ${mm}:${ss}`;
    }

    // 置顶倒计时徽标
    if (row.isPinned && row._pinnedUntilMs) {
      const pinEl = tr.querySelector('.pin-badge');
      if (pinEl) {
        const remainPinSec = Math.ceil(Math.max(0, row._pinnedUntilMs - now) / 1000);
        const pmm = String(Math.floor(remainPinSec / 60)).padStart(2, '0');
        const pss = String(remainPinSec % 60).padStart(2, '0');
        pinEl.textContent = `📌 ${pmm}:${pss}`;
      }
    }
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────────
function fmt(v, dec) {
  const n = Number(v);
  return isNaN(n) ? '—' : n.toFixed(dec);
}
function fmtVol(v) {
  return v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(1)+'K' : String(Math.round(v));
}

// ── COUNTDOWN & AUTO REFRESH ──────────────────────────────────────────────
setInterval(() => {
  if (countdown <= 0) {
    fetchData();
    countdown = 10;
  } else {
    countdown--;
    // 每秒只做轻量级 DOM 更新（进度条宽度/文本），不重新渲染整表
    updateExpireBars();
  }
  document.getElementById('refresh-timer').textContent = `${countdown}s 后刷新`;
}, 1000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { fetchData(); countdown = 10; }
});

FILTER_IDS.forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', () => applyFilter());
  el.addEventListener('keydown', e => { if (e.key === 'Enter') applyFilter(); });
});

const blockInputEl = document.getElementById('blockInput');
if (blockInputEl) {
  blockInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addBlocked();
    }
  });
}

renderBlockedPills();
fetchData();
</script>
