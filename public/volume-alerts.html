<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成交量提醒列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ddd;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 30px;
        }

        .nav-links a {
            color: #007acc;
            text-decoration: none;
            padding: 8px 16px;
            margin: 0 10px;
            border: 1px solid #007acc;
            border-radius: 4px;
            transition: all 0.2s;
            display: inline-block;
        }

        .nav-links a:hover {
            background-color: #007acc;
            color: white;
        }

        .alerts-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .alerts-title {
            font-size: 1.5em;
            color: #ddd;
            font-weight: normal;
        }

        /* 配置面板样式 */
        .config-panel {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .config-header {
            background-color: #333;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .config-header h3 {
            margin: 0;
            font-size: 1.1em;
            color: #ddd;
            font-weight: normal;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #007acc;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.2s;
        }

        .toggle-btn:hover {
            color: #0099ff;
        }

        .config-content {
            padding: 16px;
            display: block;
        }

        .config-content.collapsed {
            display: none;
        }

        .config-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .config-row label {
            color: #ddd;
            min-width: 120px;
        }

        .alerts-list {
            list-style: none;
            padding: 0;
        }

        .alert-item {
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .alert-item:last-child {
            border-bottom: none;
        }

        .alert-symbol {
            font-weight: bold;
            color: #ffffff;
            min-width: 80px;
        }

        .alert-time {
            color: #888;
            min-width: 120px;
            font-size: 13px;
        }

        .alert-amplitude {
            font-weight: bold;
            min-width: 120px; /* 稍微宽一点以容纳"量比 xxx%" */
        }

        .alert-direction {
            min-width: 20px;
            font-size: 16px;
        }

        .alert-info {
            color: #888;
            font-size: 13px;
            flex: 1;
        }

        .alert-price-diff {
            min-width: 100px;
            font-size: 13px;
            color: #aaa;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
        }

        .no-alerts {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* 振幅/量比颜色 */
        .amp-up { color: #26a69a; }      /* 绿色 */
        .amp-down { color: #ef5350; }    /* 红色 */
        .amp-flat { color: #888; }       /* 灰色 */
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .alert-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
                padding: 12px 0;
            }

            .alert-symbol,
            .alert-time,
            .alert-amplitude,
            .alert-direction {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/alerts">价格提醒</a>
            <a href="/volume-alerts" style="background-color: #007acc; color: white;">成交量提醒</a>
            <a href="/hills">山丘扫描</a>
            <a href="/hill-alerts">山丘提醒</a>
            <a href="/ranking">涨跌排名</a>
            <a href="/l2-alerts">L2大单</a>
        
            <a href="/screener">选股器</a>
    <a href="/stable-screener">稳定选股</a>
    <a href="/swing-screener">波段扫描</a>
        </div>

        <div class="alerts-header">
            <h2 class="alerts-title">成交量提醒列表（最近）</h2>
        </div>

        <!-- 系统设置面板 -->
        <div class="config-panel" style="border-color: #007acc;">
            <div class="config-header" style="background-color: #004470;">
                <h3 style="color: white;">⚙️ 系统参数配置</h3>
                <button id="toggle-sys-config" class="toggle-btn" style="color: white;">▼</button>
            </div>
            <div id="sys-config-content" class="config-content">
                <div id="checkpoints-editor" style="margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 15px;">
                    <h4 style="color: #ddd; margin-bottom: 10px;">时间检查点配置 (Time Checkpoints)</h4>
                    <table id="checkpoints-table" style="width: 100%; text-align: left; border-collapse: collapse; color: #ddd;">
                        <thead>
                            <tr style="border-bottom: 1px solid #555;">
                                <th style="padding: 5px;">时间 (分钟)</th>
                                <th style="padding: 5px;">预期完成 %</th>
                                <th style="padding: 5px;">标签 (Label)</th>
                                <th style="padding: 5px;">操作</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <div style="margin-top: 10px; display: flex; gap: 10px;">
                        <input type="number" id="new-cp-mins" placeholder="分钟 (e.g. 120)" style="width: 100px; padding: 5px; background: #333; border: 1px solid #555; color: white;">
                        <input type="number" id="new-cp-pct" placeholder="预期% (0.3)" step="0.01" style="width: 100px; padding: 5px; background: #333; border: 1px solid #555; color: white;">
                        <input type="text" id="new-cp-label" placeholder="标签" style="width: 150px; padding: 5px; background: #333; border: 1px solid #555; color: white;">
                        <button id="add-cp-btn" style="padding: 5px 10px; background: #007acc; color: white; border: none; cursor: pointer;">添加</button>
                    </div>
                </div>
                <div id="settings-container" class="config-row">
                    <!-- Settings will be injected here -->
                    <div class="loading">加载设置中...</div>
                </div>
                <div style="margin-top: 15px; display: flex; gap: 10px; align-items: center;">
                    <button id="save-settings-btn" style="padding: 8px 16px; background: #007acc; border: none; color: white; border-radius: 4px; cursor: pointer;">保存配置</button>
                    <button id="trigger-scan-btn" style="padding: 8px 16px; background: #2a2a2a; border: 1px solid #555; color: #ddd; border-radius: 4px; cursor: pointer;">立即扫描</button>
                    <span id="save-status" style="margin-left: 10px; font-size: 0.9em;"></span>
                </div>
            </div>
        </div>

        <!-- 筛选面板 -->
        <div class="config-panel">
            <div class="config-header">
                <h3>筛选配置</h3>
                <button id="toggle-config" class="toggle-btn">▼</button>
            </div>
            <div id="config-content" class="config-content">
                <div class="config-row">
                    <label for="threshold">最小差距百分比：</label>
                    <input type="number" id="threshold" min="0" step="0.01" placeholder="0.1" value="0.1">
                    <label for="enable-filter">
                        <input type="checkbox" id="enable-filter" checked>
                        启用量比筛选
                    </label>
                </div>
                <div class="config-row" style="border-top: 1px solid #444; margin-top: 10px; padding-top: 10px;">
                    <label for="price-threshold">5分价格变动：</label>
                    <input type="number" id="price-threshold" min="0" step="0.1" placeholder="0.5" value="0.5" style="width: 80px;">
                    <label for="enable-price-filter">
                        <input type="checkbox" id="enable-price-filter">
                        启用价格筛选
                    </label>
                </div>
                <div class="config-status">
                    <span id="filter-status">筛选状态: ...</span><br>
                    <span id="price-filter-status" style="color: #888; font-size: 0.9em;">价格筛选: 已禁用</span>
                </div>
            </div>
        </div>

        <ul class="alerts-list" id="alerts-list">
            <li class="loading">正在加载提醒数据...</li>
        </ul>
    </div>

    <script>
        // 格式化北京时间 - 简化格式
        function formatBeijingTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('zh-CN', {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).replace(/\//g, '/');
        }

        const RULE_LABELS = {
            'volume_surge': '放量',
            'volume_shrink': '缩量',
            'consecutive_high': '连续放量'
        };

        function getRuleLabel(ruleId) {
            return RULE_LABELS[ruleId] || ruleId || '放量';
        }

        function getRuleIcon(ruleId) {
            if (ruleId === 'volume_shrink') return '📉';
            if (ruleId === 'consecutive_high') return '🔥';
            return '⚡';
        }

        // 获取样式类
        function getClass(ratio, ruleId) {
            if (ruleId === 'volume_shrink') return 'amp-down';
            if (ratio >= 1) return 'amp-up';
            return 'amp-flat';
        }

        // --- Settings Management ---
        let currentSettings = {};
        let timeCheckpoints = [];

        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                if (!res.ok) throw new Error('Failed to load settings');
                const settings = await res.json();
                
                const container = document.getElementById('settings-container');
                container.innerHTML = '';
                currentSettings = {};
                timeCheckpoints = [];

                settings.forEach(s => {
                    currentSettings[s.key] = s;
                    
                    if (s.key === 'time_checkpoints') {
                        timeCheckpoints = s.value;
                        if (typeof timeCheckpoints === 'string') {
                             try { timeCheckpoints = JSON.parse(timeCheckpoints); } catch(e) {}
                        }
                        renderCheckpointsTable();
                        return; // Don't render in generic list
                    }
                    
                    // Skip price filter settings as per user request to remove them from UI
                    if (s.key === 'price_filter_minutes' || s.key === 'price_filter_threshold') {
                        return;
                    }
                    
                    const div = document.createElement('div');
                    div.className = 'config-item';
                    div.style.cssText = 'display: flex; flex-direction: column; margin-right: 20px; margin-bottom: 10px;';
                    
                    const label = document.createElement('label');
                    label.textContent = s.description || s.key;
                    label.style.marginBottom = '5px';
                    label.style.fontSize = '0.9em';
                    label.style.color = '#aaa';
                    
                    let input;
                    if (s.value_type === 'boolean') {
                        input = document.createElement('input');
                        input.type = 'checkbox';
                        input.checked = s.value;
                    } else {
                        input = document.createElement('input');
                        input.type = 'number';
                        input.value = s.value;
                        input.style.padding = '5px';
                        input.style.backgroundColor = '#333';
                        input.style.border = '1px solid #555';
                        input.style.color = 'white';
                        input.style.borderRadius = '3px';
                        
                        if (s.value_type === 'float') input.step = '0.01';
                        if (s.min_value !== null) input.min = s.min_value;
                        if (s.max_value !== null) input.max = s.max_value;
                    }
                    input.id = `setting-${s.key}`;
                    
                    div.appendChild(label);
                    div.appendChild(input);
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('settings-container').innerHTML = '<div class="error">加载配置失败</div>';
            }
        }

        function renderCheckpointsTable() {
            const tbody = document.querySelector('#checkpoints-table tbody');
            tbody.innerHTML = '';
            
            // Sort by elapsed_minutes
            timeCheckpoints.sort((a, b) => a.elapsed_minutes - b.elapsed_minutes);

            timeCheckpoints.forEach((cp, index) => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid #333';
                tr.innerHTML = `
                    <td style="padding: 8px;">${cp.elapsed_minutes}</td>
                    <td style="padding: 8px;">${(cp.expected_pct * 100).toFixed(0)}%</td>
                    <td style="padding: 8px;">${cp.label || ''}</td>
                    <td style="padding: 8px;">
                        <button onclick="deleteCheckpoint(${index})" style="color: #ff5252; background: none; border: none; cursor: pointer;">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.deleteCheckpoint = function(index) {
            timeCheckpoints.splice(index, 1);
            renderCheckpointsTable();
        };

        document.getElementById('add-cp-btn').addEventListener('click', () => {
            const mins = parseInt(document.getElementById('new-cp-mins').value);
            const pct = parseFloat(document.getElementById('new-cp-pct').value);
            const label = document.getElementById('new-cp-label').value;

            if (!mins || isNaN(pct)) {
                alert('请输入有效的时间和百分比');
                return;
            }

            timeCheckpoints.push({ elapsed_minutes: mins, expected_pct: pct, label: label });
            renderCheckpointsTable();
            
            // Clear inputs
            document.getElementById('new-cp-mins').value = '';
            document.getElementById('new-cp-pct').value = '';
            document.getElementById('new-cp-label').value = '';
        });

        async function saveSettings() {
            const status = document.getElementById('save-status');
            const saveBtn = document.getElementById('save-settings-btn');
            
            status.textContent = '保存中...';
            status.style.color = '#aaa';
            saveBtn.disabled = true;

            try {
                // Save Checkpoints
                await fetch('/api/settings/time_checkpoints', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ value: timeCheckpoints })
                });

                // Save other settings
                for (const key in currentSettings) {
                    if (key === 'time_checkpoints') continue;
                    
                    const setting = currentSettings[key];
                    const input = document.getElementById(`setting-${key}`);
                    if (!input) continue;

                    let newValue;
                    if (setting.value_type === 'boolean') {
                        newValue = input.checked;
                    } else {
                        newValue = input.value;
                    }

                    if (String(newValue) !== String(setting.value)) {
                        await fetch(`/api/settings/${key}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ value: newValue })
                        });
                    }
                }
                status.textContent = '保存成功!';
                status.style.color = '#4caf50';
                await loadSettings(); 
            } catch (err) {
                console.error(err);
                status.textContent = '保存失败: ' + err.message;
                status.style.color = '#ff5252';
            } finally {
                saveBtn.disabled = false;
                setTimeout(() => { if(status.textContent === '保存成功!') status.textContent = ''; }, 3000);
            }
        }

        async function triggerScan() {
            const status = document.getElementById('save-status');
            const btn = document.getElementById('trigger-scan-btn');
            
            btn.disabled = true;
            status.textContent = '正在触发扫描...';
            
            try {
                const res = await fetch('/api/settings/trigger-volume-scan', { method: 'POST' });
                if (!res.ok) throw new Error('Request failed');
                status.textContent = '扫描已在后台启动';
                status.style.color = '#4caf50';
            } catch (err) {
                status.textContent = '触发失败';
                status.style.color = '#ff5252';
            } finally {
                btn.disabled = false;
                setTimeout(() => status.textContent = '', 3000);
            }
        }

        // --- End Settings Management ---

        // 渲染提醒列表
        function renderAlerts(alerts) {
            const alertsList = document.getElementById('alerts-list');
            
            if (!alerts || alerts.length === 0) {
                alertsList.innerHTML = '<li class="no-alerts">暂无提醒数据</li>';
                return;
            }

            // 应用筛选
            const filteredAlerts = applyFilter(alerts);
            
            if (filteredAlerts.length === 0) {
                alertsList.innerHTML = '<li class="no-alerts">没有符合筛选条件的提醒数据</li>';
                return;
            }

            alertsList.innerHTML = filteredAlerts.map(alert => {
                // Parse Checkpoint Info
                // rule_id: checkpoint_{minutes}min_{pct}pct
                const actualPct = parseFloat(alert.volume_ratio);
                const ruleId = alert.rule_id || '';
                
                let label = ruleId;
                let expectedPct = 0;
                let minutes = 0;
                
                if (ruleId.startsWith('checkpoint_')) {
                    const parts = ruleId.split('_');
                    // parts[1] like "120min", parts[2] like "30pct"
                    minutes = parseInt(parts[1]);
                    expectedPct = parseInt(parts[2]) / 100;
                    
                    // Try to find label in current checkpoints
                    const cp = timeCheckpoints.find(c => c.elapsed_minutes === minutes);
                if (cp) label = cp.label;
                else label = `开市${minutes}分钟`;
            } else if (RULE_LABELS[ruleId]) {
                label = RULE_LABELS[ruleId];
            }

            const excess = actualPct - expectedPct;
            const excessText = (excess * 100).toFixed(1) + '%';
            
            // Color based on excess?
            // If excess is large, maybe green/up?
            const excessClass = 'amp-up';

            const time = formatBeijingTime(alert.created_at);

            return `
                <li class="alert-item">
                    <span class="alert-symbol">${alert.symbol}</span>
                    <span class="alert-time">${time}</span>
                    <span class="alert-amplitude ${excessClass}">超出: ${excessText}</span>
                    <span class="alert-info">
                        [${label}] 已达日均量的 ${(actualPct*100).toFixed(1)}% (目标 ${(expectedPct*100).toFixed(0)}%) ✓
                        (当前量: ${Number(alert.current_cum_vol).toLocaleString()})
                    </span>
                    <span class="alert-price-diff" data-symbol="${alert.symbol}">价格计算中...</span>
                </li>
            `;
        }).join('');
        
        // Render 完成后，启动价格检查队列
        setTimeout(processPriceQueue, 100);
    }

    // 应用筛选
    function applyFilter(alerts) {
        const enableFilter = document.getElementById('enable-filter').checked;
        const thresholdInput = document.getElementById('threshold');
        let threshold = parseFloat(thresholdInput.value);
        
        if (isNaN(threshold) || threshold < 0) {
            threshold = 0.0; // Default 0 if invalid
        }

        // Update status text
        const statusSpan = document.getElementById('filter-status');
        if (enableFilter) {
             statusSpan.textContent = `筛选状态: 已启用，只显示超出目标 ${threshold * 100}% 以上的提醒`;
        } else {
             statusSpan.textContent = '筛选状态: 已禁用 (显示所有)';
        }
        
        if (!enableFilter) {
            return alerts;
        }
        
        return alerts.filter(alert => {
            const ruleId = alert.rule_id || '';
            // For non-checkpoint alerts, keep them
            if (!ruleId.startsWith('checkpoint_')) return true; 
            
            const parts = ruleId.split('_');
            if (parts.length < 3) return true;
            
            const actualPct = parseFloat(alert.volume_ratio);
            const expectedPct = parseInt(parts[2]) / 100;
            const excess = actualPct - expectedPct;
            
            return excess >= threshold;
        });
    }
        
        // --- Price Filter Logic ---
        const priceCache = {};
        
        async function fetchPriceDiff(symbol) {
            const now = Date.now();
            // Cache for 1 minute
            if (priceCache[symbol] && (now - priceCache[symbol].ts < 60000)) {
                return priceCache[symbol].diff;
            }

            try {
                // Use new lightweight API
                const res = await fetch(`/api/price-snapshot?symbol=${symbol}&minutes=5`);
                const data = await res.json();
                
                if (!data || typeof data.change === 'undefined') return 0;
                
                // Return absolute difference for filtering logic
                const diff = Math.abs(data.change);
                priceCache[symbol] = { diff, ts: now };
                return diff;
            } catch (e) {
                console.error(`Error fetching price for ${symbol}:`, e);
                return 0;
            }
        }

        async function processPriceQueue() {
            const rows = document.querySelectorAll('.alert-item');
            const uniqueSymbols = new Set();
            rows.forEach(row => {
                const sym = row.querySelector('.alert-symbol').textContent;
                uniqueSymbols.add(sym);
            });
            
            const queue = Array.from(uniqueSymbols);
            console.log(`Starting price check for ${queue.length} symbols...`);

            // Process in batches of 3
            for (let i = 0; i < queue.length; i += 3) {
                const batch = queue.slice(i, i + 3);
                await Promise.all(batch.map(async (sym) => {
                    const diff = await fetchPriceDiff(sym);
                    updateRowPrice(sym, diff);
                }));
            }
        }

        function updateRowPrice(symbol, diff) {
            const rows = document.querySelectorAll('.alert-item');
            const threshold = parseFloat(document.getElementById('price-threshold').value) || 0.5;
            const enabled = document.getElementById('enable-price-filter').checked;

            rows.forEach(row => {
                const symSpan = row.querySelector('.alert-symbol');
                if (symSpan && symSpan.textContent === symbol) {
                    const diffSpan = row.querySelector('.alert-price-diff');
                    if (diffSpan) {
                        diffSpan.textContent = `5分变动: ${diff.toFixed(2)}`;
                        if (diff >= 0.5) {
                            diffSpan.style.color = '#ff9800'; // Highlight significant change
                            diffSpan.style.fontWeight = 'bold';
                        } else {
                            diffSpan.style.color = '#666';
                        }
                    }
                    
                    // Apply visibility logic
                    if (enabled && diff < threshold) {
                        row.style.display = 'none';
                    } else {
                        // Restore display if it wasn't hidden by other filters
                        // Actually, renderAlerts only renders what passed the volume filter.
                        // So we are safe to show it.
                        row.style.display = 'flex';
                    }
                }
            });
        }

        // 加载提醒数据
        async function loadAlerts() {
            try {
                // 调用新接口
                const response = await fetch('/api/volume-alerts-data?limit=200');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const alerts = await response.json();
                console.log('Loaded alerts:', alerts.length);
                
                window.cachedAlerts = alerts;
                renderAlerts(alerts);
            } catch (error) {
                console.error('Error loading alerts:', error);
                document.getElementById('alerts-list').innerHTML = 
                    '<li class="error">加载提醒数据失败，请稍后重试</li>';
            }
        }

        function reRenderAlerts() {
            if (window.cachedAlerts) {
                renderAlerts(window.cachedAlerts);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('Volume Alerts page loaded');
            initFilter();
            loadAlerts();
            setInterval(loadAlerts, 10000);
        });

        // 初始化筛选功能
        function initFilter() {
            const thresholdInput = document.getElementById('threshold');
            const enableFilterCheckbox = document.getElementById('enable-filter');
            const filterStatusSpan = document.getElementById('filter-status');
            
            const priceThresholdInput = document.getElementById('price-threshold');
            const enablePriceCheckbox = document.getElementById('enable-price-filter');
            const priceStatusSpan = document.getElementById('price-filter-status');

            const toggleBtn = document.getElementById('toggle-config');
            const configContent = document.getElementById('config-content');

            // 从URL/LocalStorage加载配置 (简化版)
            const savedConfig = localStorage.getItem('volumeFilterConfig');
            if (savedConfig) {
                try {
                    const config = JSON.parse(savedConfig);
                    thresholdInput.value = config.threshold || 0.1;
                    enableFilterCheckbox.checked = config.enabled !== false;
                    
                    if (config.priceThreshold !== undefined) priceThresholdInput.value = config.priceThreshold;
                    if (config.priceEnabled !== undefined) enablePriceCheckbox.checked = config.priceEnabled;
                } catch(e) {}
            }

            toggleBtn.addEventListener('click', function() {
                const isCollapsed = configContent.classList.contains('collapsed');
                if (isCollapsed) {
                    configContent.classList.remove('collapsed');
                    toggleBtn.textContent = '▼';
                } else {
                    configContent.classList.add('collapsed');
                    toggleBtn.textContent = '▶';
                }
            });

            // Volume Filter Listeners
            thresholdInput.addEventListener('input', updateConfig);
            enableFilterCheckbox.addEventListener('change', updateConfig);
            
            // Price Filter Listeners
            priceThresholdInput.addEventListener('input', updateConfig);
            enablePriceCheckbox.addEventListener('change', updateConfig);

            function updateConfig() {
                // Volume Filter
                const threshold = parseFloat(thresholdInput.value) || 0;
                const enabled = enableFilterCheckbox.checked;

                // Price Filter
                const priceThreshold = parseFloat(priceThresholdInput.value) || 0;
                const priceEnabled = enablePriceCheckbox.checked;

                localStorage.setItem('volumeFilterConfig', JSON.stringify({ 
                    threshold, enabled, 
                    priceThreshold, priceEnabled 
                }));
                
                // Update Status Text
                if (enabled) {
                    filterStatusSpan.textContent = `量比筛选: 已启用 (超出 ${threshold * 100}%)`;
                } else {
                    filterStatusSpan.textContent = '量比筛选: 已禁用';
                }

                if (priceEnabled) {
                    priceStatusSpan.textContent = `价格筛选: 已启用 (变动 >= ${priceThreshold})`;
                    priceStatusSpan.style.color = '#4caf50';
                } else {
                    priceStatusSpan.textContent = '价格筛选: 已禁用';
                    priceStatusSpan.style.color = '#888';
                }

                // Re-render (for volume filter)
                reRenderAlerts();
                
                // Apply price filter (for visuals)
                // Note: reRenderAlerts calls renderAlerts which calls processPriceQueue which calls updateRowPrice
                // But updateRowPrice reads the DOM values directly, so it will pick up new settings.
                // However, reRenderAlerts reconstructs the DOM, so existing price diffs (text) might be lost if we don't cache carefully?
                // We have priceCache, so processPriceQueue will be fast (from cache).
                // So reRenderAlerts is fine.
            }

            // Initial status update
            updateConfig();
            
            // ... rest of init
            // Settings UI Init
            loadSettings();
            document.getElementById('save-settings-btn').addEventListener('click', saveSettings);
            document.getElementById('trigger-scan-btn').addEventListener('click', triggerScan);
            
            const toggleSysBtn = document.getElementById('toggle-sys-config');
            const sysContent = document.getElementById('sys-config-content');
            toggleSysBtn.addEventListener('click', () => {
                if (sysContent.classList.contains('collapsed')) {
                    sysContent.classList.remove('collapsed');
                    toggleSysBtn.textContent = '▼';
                } else {
                    sysContent.classList.add('collapsed');
                    toggleSysBtn.textContent = '▶';
                }
            });
        }
    </script>
</body>
</html>
