<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波动筛选器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --bg:        #0a0c0f;
    --bg2:       #10141a;
    --bg3:       #161c24;
    --border:    #1e2733;
    --border2:   #263040;
    --text:      #e8f2fc;
    --text-dim:  #8fa8c0;
    --text-mute: #4a5f72;
    --up:        #00e676;
    --down:      #ff4d6a;
    --accent:    #40a9ff;
    --accent-dim:#40a9ff15;
    --gold:      #ffd666;
    --mono:      'IBM Plex Mono', monospace;
    --sans:      'IBM Plex Sans SC', sans-serif;
    --col-widths: 90px 80px 80px 74px 74px 80px 72px 72px 100px 90px 60px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
  }

  /* ── 整体布局：flex 列，固定视口高度 ── */
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;   /* 禁止 body 滚动 */
  }

  /* ── 固定顶部区域 ── */
  .top-fixed {
    flex-shrink: 0;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }

  .header-left { display: flex; align-items: center; gap: 16px; }

  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .logo span { color: var(--text-dim); font-weight: 400; }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-mute);
    transition: background 0.3s;
  }
  .status-dot.live  { background: var(--up);   box-shadow: 0 0 6px var(--up); }
  .status-dot.error { background: var(--down); }

  .last-update {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .control-group { display: flex; align-items: center; gap: 6px; }

  .control-label {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  input[type=number] {
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 3px;
    width: 100px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=number]:focus { border-color: var(--accent); }

  .btn {
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn:hover  { border-color: var(--accent); color: var(--accent); }
  .btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .divider { width: 1px; height: 20px; background: var(--border); }

  .count-badge {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-left: auto;
  }
  .count-badge b { color: var(--gold); font-weight: 600; }

  .rules-bar {
    display: flex;
    gap: 6px;
    padding: 8px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .rules-bar::-webkit-scrollbar { display: none; }

  .rule-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 3px 9px;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }
  .rule-pill .range { color: var(--accent); font-weight: 500; }
  .rule-pill .sep   { color: var(--text-mute); }

  /* ── thead 固定在 top-fixed 底部 ── */
  .thead-wrap {
    flex-shrink: 0;
    overflow: hidden;   /* 隐藏横向滚动条，与 tbody 同步 */
    background: var(--bg2);
    border-bottom: 2px solid var(--border2);
  }

  /* ── tbody 区域，唯一滚动容器 ── */
  .tbody-wrap {
    flex: 1;
    overflow: auto;     /* 垂直+水平都可滚动 */
  }

  /* ── 共用表格样式 ── */
  .tbl {
    border-collapse: collapse;
    table-layout: fixed;
    /* 总宽 = 各列宽之和，确保 thead/tbody 完全对齐 */
    width: 862px;
    min-width: 100%;
  }

  .tbl col:nth-child(1)  { width: 90px;  }
  .tbl col:nth-child(2)  { width: 80px;  }
  .tbl col:nth-child(3)  { width: 80px;  }
  .tbl col:nth-child(4)  { width: 74px;  }
  .tbl col:nth-child(5)  { width: 74px;  }
  .tbl col:nth-child(6)  { width: 80px;  }
  .tbl col:nth-child(7)  { width: 72px;  }
  .tbl col:nth-child(8)  { width: 72px;  }
  .tbl col:nth-child(9)  { width: 100px; }
  .tbl col:nth-child(10) { width: 90px;  }
  .tbl col:nth-child(11) { width: 60px;  }

  thead th {
    background: var(--bg2);
    padding: 9px 12px;
    text-align: right;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
  }
  thead th:hover            { color: var(--accent); }
  thead th.sort-asc::after  { content: ' ↑'; color: var(--accent); }
  thead th.sort-desc::after { content: ' ↓'; color: var(--accent); }
  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  tbody tr:hover { background: var(--bg3); }

  td {
    padding: 7px 12px;
    text-align: right;
    font-family: var(--mono);
    font-size: 12px;
    white-space: nowrap;
  }
  td:first-child { text-align: left; }

  .symbol {
    font-weight: 600;
    font-size: 13px;
    color: #e8f0f8;
    letter-spacing: 0.03em;
  }

  .up   { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--text-dim); }

  .swing-val { font-weight: 600; color: var(--gold); }

  .source-badge {
    display: inline-block;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 2px;
    vertical-align: middle;
  }
  .source-badge.realtime { background: #00e67615; color: var(--up); border: 1px solid #00e67630; }

  .vol-bar-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
  .vol-bar      { height: 3px; background: var(--border2); border-radius: 2px; width: 40px; overflow: hidden; }
  .vol-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }

  .empty-row td {
    text-align: center;
    padding: 60px;
    color: var(--text-dim);
    font-size: 12px;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes rowflash {
    0%   { background: var(--accent-dim); }
    100% { background: transparent; }
  }
  tr.flash { animation: rowflash 1s ease-out; }

  /* ── symbol 搜索 ── */
  .search-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .search-input {
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 3px;
    width: 120px;
    outline: none;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-mute); text-transform: none; letter-spacing: 0; }
  .search-result {
    font-family: var(--mono);
    font-size: 11px;
    min-width: 80px;
    transition: color 0.2s;
  }
  .search-result.found    { color: var(--up); }
  .search-result.notfound { color: var(--down); }

  @keyframes rowhighlight {
    0%   { background: #40a9ff30; }
    60%  { background: #40a9ff18; }
    100% { background: transparent; }
  }
  tr.highlight { animation: rowhighlight 2s ease-out; }

  ::-webkit-scrollbar       { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── 导航 ── */
  .nav-links {
    text-align: center;
    padding: 10px 0;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .nav-links a {
    color: var(--accent); text-decoration: none; padding: 6px 14px; margin: 0 6px;
    border: 1px solid var(--accent); border-radius: 4px; transition: all 0.2s;
    display: inline-block; font-size: 13px; font-family: var(--sans);
  }
  .nav-links a:hover { background-color: var(--accent); color: var(--bg); }
  .nav-links a.active { background-color: var(--accent); color: var(--bg); }
</style>
</head>
<body>

<div class="top-fixed">
  <!-- 导航 -->
  <div class="nav-links">
    <a href="/alerts">价格提醒</a>
    <a href="/volume-alerts">放量提醒</a>
    <a href="/hills">山丘形态</a>
    <a href="/hill-alerts">山丘放量</a>
    <a href="/ranking">涨跌排名</a>
    <a href="/l2-alerts">L2大单</a>
    <a href="/screener">选股器</a>
    <a href="/stable-screener">稳定选股</a>
    <a href="/swing-screener" class="active">波段扫描</a>
  </div>

  <div class="header">
    <div class="header-left">
      <div class="logo">SWING<span>/SCAN</span></div>
      <div class="status-dot" id="statusDot"></div>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" placeholder="查找 symbol" maxlength="20" autocomplete="off" spellcheck="false">
      <span class="search-result" id="searchResult"></span>
    </div>
    <div class="last-update" id="lastUpdate">--:--:--</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <span class="control-label">最小成交量</span>
      <input type="number" id="minVolume" value="0" min="0" step="1000" placeholder="0">
    </div>
    <div class="divider"></div>
    <button class="btn active" id="btnAll"  onclick="setDir('all')">全部</button>
    <button class="btn"        id="btnUp"   onclick="setDir('up')">↑ 涨</button>
    <button class="btn"        id="btnDown" onclick="setDir('down')">↓ 跌</button>
    <div class="divider"></div>
    <button class="btn" onclick="fetchData()">刷新</button>
    <span class="count-badge" id="countBadge">—</span>
  </div>

  <div class="rules-bar">
    <div class="rule-pill" style="color:var(--text-mute);border-color:var(--border);">2min窗口</div>
    <div class="rule-pill"><span class="range">&lt;20</span><span class="sep">|</span>波动&gt;0.20<span class="sep">·</span>涨跌&gt;2%</div>
    <div class="rule-pill"><span class="range">20–100</span><span class="sep">|</span>波动&gt;0.50<span class="sep">·</span>涨跌&gt;1%</div>
    <div class="rule-pill"><span class="range">100–300</span><span class="sep">|</span>波动&gt;1.00<span class="sep">·</span>涨跌&gt;0.5%</div>
    <div class="rule-pill"><span class="range">300–600</span><span class="sep">|</span>波动&gt;1.50<span class="sep">·</span>涨跌&gt;0.35%</div>
    <div class="rule-pill"><span class="range">≥600</span><span class="sep">|</span>波动&gt;2.00<span class="sep">·</span>涨跌&gt;0.3%</div>
  </div>

  <!-- thead 独立表格，不参与滚动 -->
  <div class="thead-wrap">
    <table class="tbl">
      <colgroup>
        <col><col><col><col><col><col><col><col><col><col><col>
      </colgroup>
      <thead>
        <tr>
          <th onclick="sortBy('symbol')">代码</th>
          <th onclick="sortBy('last_price')">现价</th>
          <th onclick="sortBy('change_pct')">涨跌% <span style="color:var(--text-mute);font-weight:400;">2m</span></th>
          <th onclick="sortBy('change_amount')">涨跌额 <span style="color:var(--text-mute);font-weight:400;">2m</span></th>
          <th onclick="sortBy('swing')">波动额</th>
          <th onclick="sortBy('window_high')">区间高</th>
          <th onclick="sortBy('window_low')">区间低</th>
          <th onclick="sortBy('open_price')">开盘价</th>
          <th onclick="sortBy('total_volume')">今日量</th>
          <th onclick="sortBy('avg_vol_10d')">10日均量</th>
          <th>数据源</th>
        </tr>
      </thead>
    </table>
  </div>
</div>

<!-- tbody 独立滚动区域 -->
<div class="tbody-wrap" id="tbodyWrap" style="will-change:transform;contain:strict;">
  <div id="vspacer" style="position:relative;">
    <table class="tbl" id="vtable" style="position:absolute;top:0;left:0;width:100%;">
      <colgroup>
        <col><col><col><col><col><col><col><col><col><col><col>
      </colgroup>
      <tbody id="tbody">
        <tr class="empty-row"><td colspan="11"><span class="spinner"></span>加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 横向滚动同步：thead-wrap 跟随 tbody-wrap -->
<script>
  document.getElementById('tbodyWrap').addEventListener('scroll', function() {
    document.querySelector('.thead-wrap').scrollLeft = this.scrollLeft;
    renderVisible();
  });
</script>

<script>
  let allData   = [];
  let sortKey   = 'swing';
  let sortDir   = -1;
  let dirFilter = 'all';
  let maxVol    = 1;
  let autoTimer = null;
  const REFRESH_MS = 10000;

  function sortBy(key) {
    const cols = ['symbol','last_price','change_pct','change_amount','swing',
                  'window_high','window_low','open_price','total_volume','avg_vol_10d','_src'];
    if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = -1; }
    document.querySelectorAll('thead th').forEach((th, i) => {
      th.classList.remove('sort-asc','sort-desc');
      if (i === cols.indexOf(key)) th.classList.add(sortDir === -1 ? 'sort-desc' : 'sort-asc');
    });
    render();
  }

  function setDir(d) {
    dirFilter = d;
    ['All','Up','Down'].forEach(n =>
      document.getElementById('btn'+n).classList.toggle('active', d === n.toLowerCase())
    );
    render();
  }

  async function fetchData() {
    const minVol = Number(document.getElementById('minVolume').value) || 0;
    const dot = document.getElementById('statusDot');
    try {
      const res = await fetch(`/api/price-swing-screener?min_volume=${minVol}`);
      if (!res.ok) throw new Error(res.status);
      allData = await res.json();
      maxVol = allData.reduce((m, r) => Math.max(m, Number(r.total_volume) || 0), 1);
      dot.className = 'status-dot live';
      document.getElementById('lastUpdate').textContent =
        new Date().toLocaleTimeString('zh-CN', { hour12: false });
      render();
    } catch(e) {
      dot.className = 'status-dot error';
      console.error('fetch error:', e);
    }
  }

  // ── 虚拟滚动 ──────────────────────────────────────────
  const ROW_H    = 33;
  const OVERSCAN = 8;
  let sortedData = [];

  function rowHTML(r) {
    const pct    = Number(r.change_pct);
    const cls    = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
    const sign   = pct > 0 ? '+' : '';
    const swing  = Number(r.swing);
    const vol    = Number(r.total_volume);
    const avgVol = Number(r.avg_vol_10d) || 0;
    const volPct = Math.min(100, maxVol > 0 ? vol / maxVol * 100 : 0);
    const srcCls = r.swing_source === 'realtime' ? 'realtime' : 'daily';
    const srcLbl = r.swing_source === 'realtime' ? 'RT' : 'D';
    return `<tr style="height:${ROW_H}px" data-sym="${r.symbol}">
      <td><span class="symbol">${r.symbol}</span></td>
      <td class="${cls}">${fmt(r.last_price,3)}</td>
      <td class="${cls}">${sign}${pct.toFixed(2)}%</td>
      <td class="${cls}">${sign}${fmt(r.change_amount,3)}</td>
      <td><span class="swing-val">${fmt(swing,3)}</span></td>
      <td class="up">${fmt(r.window_high,3)}</td>
      <td class="down">${fmt(r.window_low,3)}</td>
      <td class="flat">${fmt(r.open_price,2)}</td>
      <td><div class="vol-bar-wrap">${fmtVol(vol)}<div class="vol-bar"><div class="vol-bar-fill" style="width:${volPct.toFixed(1)}%"></div></div></div></td>
      <td class="flat">${avgVol > 0 ? fmtVol(avgVol) : '—'}</td>
      <td><span class="source-badge ${srcCls}">${srcLbl}</span></td>
    </tr>`;
  }

  function renderVisible() {
    const wrap   = document.getElementById('tbodyWrap');
    const tbody  = document.getElementById('tbody');
    const vtable = document.getElementById('vtable');
    const spacer = document.getElementById('vspacer');
    const total  = sortedData.length;

    if (total === 0) {
      spacer.style.height = '120px';
      vtable.style.top    = '0px';
      tbody.innerHTML = '<tr class="empty-row"><td colspan="11">暂无符合条件的股票</td></tr>';
      return;
    }

    const scrollTop  = wrap.scrollTop;
    const viewHeight = wrap.clientHeight;
    const firstVis   = Math.floor(scrollTop / ROW_H);
    const lastVis    = Math.ceil((scrollTop + viewHeight) / ROW_H);
    const startIdx   = Math.max(0, firstVis - OVERSCAN);
    const endIdx     = Math.min(total - 1, lastVis + OVERSCAN);

    spacer.style.height = (total * ROW_H) + 'px';
    vtable.style.top    = (startIdx * ROW_H) + 'px';
    tbody.innerHTML     = sortedData.slice(startIdx, endIdx + 1).map(rowHTML).join('');
  }

  function render() {
    let data = [...allData];
    if (dirFilter === 'up')   data = data.filter(r => Number(r.change_pct) > 0);
    if (dirFilter === 'down') data = data.filter(r => Number(r.change_pct) < 0);
    data.sort((a, b) => {
      const va = sortKey === 'symbol' ? a[sortKey] : Number(a[sortKey]) || 0;
      const vb = sortKey === 'symbol' ? b[sortKey] : Number(b[sortKey]) || 0;
      return va < vb ? sortDir : va > vb ? -sortDir : 0;
    });
    sortedData = data;
    document.getElementById('countBadge').innerHTML =
      `命中 <b>${data.length}</b> / ${allData.length}`;
    document.getElementById('tbodyWrap').scrollTop = 0;
    renderVisible();
  }

  function fmt(v, dec) {
    const n = Number(v);
    return isNaN(n) || n === 0 ? '—' : n.toFixed(dec);
  }
  function fmtVol(v) {
    if (v >= 1e6) return (v/1e6).toFixed(1)+'M';
    if (v >= 1e3) return (v/1e3).toFixed(1)+'K';
    return String(v);
  }

  function startAutoRefresh() {
    if (autoTimer) clearInterval(autoTimer);
    autoTimer = setInterval(fetchData, REFRESH_MS);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearInterval(autoTimer); }
    else { fetchData(); startAutoRefresh(); }
  });

  let debounceTimer;
  document.getElementById('minVolume').addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(fetchData, 600);
  });

  fetchData();
  startAutoRefresh();

  // ── symbol 搜索（虚拟滚动版）────────────────────────
  // 在数据里找索引，滚动到对应位置，等渲染后再高亮
  function searchSymbol(raw) {
    const q        = raw.trim().toUpperCase();
    const resultEl = document.getElementById('searchResult');

    if (!q) { resultEl.textContent = ''; resultEl.className = 'search-result'; return; }

    const idx = sortedData.findIndex(r => r.symbol === q);

    if (idx === -1) {
      resultEl.textContent = '✗ 不在结果里';
      resultEl.className   = 'search-result notfound';
      return;
    }

    // 滚动到目标行居中
    const wrap      = document.getElementById('tbodyWrap');
    const targetTop = idx * ROW_H - wrap.clientHeight / 2 + ROW_H / 2;
    wrap.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });

    // 等滚动+渲染完成后高亮该行
    setTimeout(() => {
      const row = wrap.querySelector(`tr[data-sym="${q}"]`);
      if (row) {
        row.classList.remove('highlight');
        void row.offsetWidth;
        row.classList.add('highlight');
      }
    }, 350);

    resultEl.textContent = '✓ 已定位';
    resultEl.className   = 'search-result found';
  }

  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') searchSymbol(searchInput.value);
  });
  searchInput.addEventListener('input', () => {
    if (!searchInput.value.trim()) {
      document.getElementById('searchResult').textContent = '';
      document.getElementById('searchResult').className  = 'search-result';
    }
  });
</script>
</body>
</html>
