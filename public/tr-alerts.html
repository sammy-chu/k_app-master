<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TR 五大预警实时看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#1a1a1a; color:#ddd; padding:20px; }
        .container { max-width: 1900px; margin: 0 auto; }
        .nav-links { text-align:center; margin-bottom:30px; }
        .nav-links a { color:#007acc; text-decoration:none; padding:8px 16px; margin:0 8px; border:1px solid #007acc; border-radius:4px; transition:all .2s; display:inline-block; }
        .nav-links a:hover, .nav-links a.active { background:#007acc; color:#fff; }
        .header-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid #333; padding-bottom:14px; }
        .title { font-size:1.4em; color:#ddd; font-weight:normal; }
        .refresh-info { font-size:12px; color:#666; }
        .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:#999; margin-bottom:14px; }
        .legend span { display:inline-flex; align-items:center; gap:5px; }
        .dot { width:10px; height:10px; border-radius:2px; display:inline-block; }
        .section-title { font-size:1.1em; color:#ccc; margin:10px 0; padding-bottom:6px; border-bottom:1px solid #333; }
        .section-title .count { color:#26a69a; font-weight:700; margin-left:8px; }
        table { width:100%; border-collapse:collapse; background:#252525; border-radius:8px; overflow:hidden; font-size:13px; }
        th, td { padding:9px 10px; text-align:right; border-bottom:1px solid #2e2e2e; }
        th { background:#2f2f2f; color:#999; font-weight:600; font-size:12px; position:sticky; top:0; z-index:1; }
        th:nth-child(1), td:nth-child(1), th:nth-child(2), td:nth-child(2) { text-align:left; }
        tr:last-child td { border-bottom:none; }
        .symbol { font-weight:600; color:#fff; }
        .icon { font-size:15px; }
        .no-alert { text-align:center; padding:24px; color:#26a69a; font-size:14px; }
        .loading { text-align:center; padding:40px; color:#666; }

        /* ── 涨绿跌红（TR 口径，与站内其它页相反）── */
        .up   { color:#26a69a; font-weight:700; }  /* 涨=绿 */
        .down { color:#f85149; font-weight:700; }  /* 跌=红 */

        /* ── 五种预警视觉（Step 5 使用）── */
        .row-pin-permanent { background:#3a1414; }             /* 预警1 醒目底 */
        .row-bg-yellow     { background:#4a4210; }             /* 预警5 黄高亮 */
        @keyframes flashGreen { 0%,100%{ background:#252525;} 50%{ background:#12492f;} }
        @keyframes flashRed   { 0%,100%{ background:#252525;} 50%{ background:#5a1717;} }
        @keyframes flashYellow{ 0%,100%{ background:#252525;} 50%{ background:#5a5010;} }
        .row-flash-green  { animation: flashGreen 1s ease-in-out infinite; }
        .row-flash-red    { animation: flashRed   1s ease-in-out infinite; }
        .row-flash-yellow { animation: flashYellow 1s ease-in-out infinite; }
    </style>
</head>
<body>
<div class="container">

    <div class="nav-links">
        <a href="/ranking-tr">TR排名</a>
        <a href="/l2-alerts-tr">TR-L2大单</a>
        <a href="/tr-alerts" class="active">TR预警</a>
        <a href="/volume-surge-alerts">放量引爆</a>
        <a href="/crossed-market">倒挂监控</a>
        <a href="/">Dashboard</a>
    </div>

    <div class="header-bar">
        <h1 class="title">TR 五大预警 · 实时看板</h1>
        <span class="refresh-info">每 2s 刷新 · 涨绿跌红 · 时间为引擎本地时间</span>
    </div>

    <div class="legend">
        <span><i class="dot" style="background:#c0392b"></i>暴跌永久(置顶)</span>
        <span><i class="dot" style="background:#26a69a"></i>急速波动·涨</span>
        <span><i class="dot" style="background:#f85149"></i>急速波动·跌</span>
        <span><i class="dot" style="background:#5a5010"></i>爆量脉冲(黄闪)</span>
        <span><i class="dot" style="background:#4a4210"></i>周期放量(黄高亮)</span>
        <span><i class="dot" style="background:#555"></i>大单托盘(图标)</span>
    </div>

    <h2 class="section-title">当前生效预警 <span class="count" id="alert-count"></span></h2>
    <div id="alert-content"><div class="loading">加载中...</div></div>

</div>

<script>
    let alertData = [];

    function fmtPrice(v){ return v==null ? '—' : Number(v).toFixed(4); }
    function fmtNum(v){ return v==null ? '—' : Math.round(Number(v)).toLocaleString(); }
    function fmtPct(v){ if(v==null) return '—'; const n=Number(v); return (n>0?'+':'')+n.toFixed(2)+'%'; }
    function fmtTime(s){ return s ? String(s) : '—'; }

    async function fetchAlerts(){
        try {
            const res = await fetch('/api/tr-alerts/active', { cache:'no-store' });
            const data = await res.json();
            alertData = data.alerts || [];
            render();
        } catch(e){ console.error('fetchAlerts:', e); }
    }

    function render(){
        // Step 4/5 填充
        const el = document.getElementById('alert-content');
        el.innerHTML = '<div class="no-alert">✓ 当前无生效预警</div>';
    }

    fetchAlerts();
    setInterval(fetchAlerts, 2000);
</script>
</body>
</html>
