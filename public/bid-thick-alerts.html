<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>买盘厚度监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #ddd; padding: 20px; }
        .container { max-width: 1800px; margin: 0 auto; }
        .nav-links { text-align: center; margin-bottom: 30px; }
        .nav-links a { color: #007acc; text-decoration: none; padding: 8px 16px; margin: 0 10px; border: 1px solid #007acc; border-radius: 4px; transition: all 0.2s; display: inline-block; }
        .nav-links a:hover { background-color: #007acc; color: white; }
        .nav-links a.active { background-color: #007acc; color: white; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #333; padding-bottom: 14px; }
        .title { font-size: 1.4em; color: #ddd; font-weight: normal; }
        .refresh-info { font-size: 12px; color: #666; }
        .section-title { font-size: 1.1em; color: #ccc; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #333; }
        .section-title .count { color: #26a69a; font-weight: 700; margin-left: 8px; }
        .filter-bar { display: flex; gap: 12px; align-items: center; background: #2a2a2a; padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; flex-wrap: wrap; }
        .filter-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aaa; }
        .filter-group select, .filter-group input { background: #1a1a1a; border: 1px solid #444; color: #ddd; padding: 4px 8px; border-radius: 3px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; background: #252525; border-radius: 8px; overflow: hidden; font-size: 13px; }
        th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid #2e2e2e; }
        th { background: #2f2f2f; color: #999; font-weight: 600; font-size: 12px; position: sticky; top: 0; z-index: 1; cursor: pointer; user-select: none; }
        th:hover { color: #ccc; }
        th.sorted { color: #007acc; }
        th:first-child, td:first-child { text-align: center; width: 36px; color: #555; }
        th:nth-child(2), td:nth-child(2) { text-align: left; }
        tr:last-child td { border-bottom: none; }
        tr.data-row:hover { background: #2a2a2a; }
        .symbol { font-weight: 600; color: #fff; }
        .ratio-val { color: #26a69a; font-weight: 700; }
        .duration-val { color: #faac30; }
        .time-cell { color: #666; font-size: 12px; white-space: nowrap; }
        .active-row { border-left: 3px solid #26a69a; background: rgba(38,166,154,0.08) !important; }
        .active-row:hover { background: rgba(38,166,154,0.14) !important; }
        .expand-cell { text-align: center; width: 28px; cursor: pointer; color: #888; user-select: none; }
        .expand-cell:hover { color: #ddd; }
        .detail-row td { background: #1e1e1e; padding: 0; }
        .detail-box { padding: 10px 16px; }
        .detail-box table { background: #202020; }
        .detail-box th { background: #262626; position: static; cursor: default; }
        .empty { text-align: center; padding: 30px; color: #555; font-size: 13px; }
        .no-alert { text-align: center; padding: 20px; color: #26a69a; font-size: 14px; }
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
<div class="container">

    <div class="nav-links">
        <a href="/alerts">价格提醒</a>
        \n        <a href="/volume-surge">放量监控</a>
        <a href="/volume-surge-alerts">放量引爆</a>
        <a href="/hills">山丘形态</a>
        <a href="/ranking">涨跌排名</a>
        <a href="/l2-alerts">L2大单</a>
        <a href="/crossed-market">倒挂监控</a>
        <a href="/bid-thick-alerts" class="active">买盘厚度</a>
        <a href="/screener">选股器</a>
        <a href="/boundary-alerts">边界预警</a>
        <a href="/active-trading">活跃主买</a>
        <a href="/abnormal-trades">异常成交</a>
    </div>

    <div class="header-bar">
        <h1 class="title">Bid Thickness 买盘厚度监控</h1>
        <span class="refresh-info">活跃区每 1s 刷新</span>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>代码</label>
            <input type="text" id="filter-symbol" placeholder="如 AAPL" style="width:110px">
        </div>
        <div class="filter-group">
            <label>历史范围</label>
            <select id="filter-hours">
                <option value="1">近1小时</option>
                <option value="6">近6小时</option>
                <option value="24" selected>近24小时</option>
                <option value="168">近7天</option>
            </select>
        </div>
        <div class="filter-group">
            <label>最小倍数</label>
            <input type="number" id="filter-min-ratio" placeholder="如 3" style="width:70px" min="0" step="0.5">
        </div>
    </div>

    <h2 class="section-title">🟢 当前活跃 <span class="count" id="active-count"></span></h2>
    <div id="active-content"><div class="loading">加载中...</div></div>

    <h2 class="section-title" style="margin-top:30px">📋 历史记录</h2>
    <div id="history-content"><div class="loading">加载中...</div></div>

</div>

<script>
    let activeData = [];
    let historyData = [];
    let historySortCol = 'detected_at';
    let historySortDir = 'desc';
    const expanded = new Set();  // 记录展开的行 id,保持 1s 重渲染后状态

    function getSymbol()   { return document.getElementById('filter-symbol').value.trim().toUpperCase(); }
    function getHours()    { return document.getElementById('filter-hours').value; }
    function getMinRatio() { return document.getElementById('filter-min-ratio').value.trim(); }

    function fmtPrice(v) { return v == null ? '—' : Number(v).toFixed(4); }
    function fmtRatio(v) { return v == null ? '—' : Number(v).toFixed(2) + '×'; }
    function fmtVol(v)   { if (v == null) return '—'; v = Number(v); return isNaN(v) ? '—' : v.toLocaleString(); }
    function fmtTime(s)  { if (!s) return '—'; return new Date(s).toLocaleString('zh-CN', { hour12: false, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' }); }
    function fmtDuration(row) {
        if (row.duration_sec != null) {
            const s = Number(row.duration_sec);
            if (s < 60) return s.toFixed(1) + 's';
            return Math.floor(s/60) + 'm' + Math.round(s%60) + 's';
        }
        if (row.detected_at) {
            const s = (Date.now() - new Date(row.detected_at).getTime()) / 1000;
            if (s < 60) return Math.floor(s) + 's';
            if (s < 3600) return Math.floor(s/60) + 'm' + String(Math.floor(s%60)).padStart(2,'0') + 's';
            return Math.floor(s/3600) + 'h' + String(Math.floor((s%3600)/60)).padStart(2,'0') + 'm';
        }
        return '—';
    }

    function parseLevels(jsonb) {
        if (!jsonb) return [];
        if (Array.isArray(jsonb)) return jsonb;
        if (typeof jsonb === 'string') { try { return JSON.parse(jsonb); } catch(e) { return []; } }
        return [];
    }

    function detailRowHtml(row, colspan) {
        const levels = parseLevels(row.levels);
        if (!levels.length) {
            return `<tr class="detail-row" data-detail="${row.id}"><td colspan="${colspan}"><div class="detail-box" style="color:#666">无逐档数据</div></td></tr>`;
        }
        let sub = `<div class="detail-box"><table><thead><tr>
            <th style="text-align:center">档位</th><th>Bid价</th><th>Bid量</th><th>Ask价</th><th>Ask量</th><th>倍数</th>
        </tr></thead><tbody>`;
        levels.forEach(lv => {
            sub += `<tr>
                <td style="text-align:center">${lv.level ?? '—'}</td>
                <td>${fmtPrice(lv.bid_price)}</td>
                <td>${fmtVol(lv.bid_vol)}</td>
                <td>${fmtPrice(lv.ask_price)}</td>
                <td>${fmtVol(lv.ask_vol)}</td>
                <td><span class="ratio-val">${fmtRatio(lv.ratio)}</span></td>
            </tr>`;
        });
        sub += '</tbody></table></div>';
        return `<tr class="detail-row" data-detail="${row.id}"><td colspan="${colspan}">${sub}</td></tr>`;
    }

    function toggleDetail(id) {
        // 由于 id 可能是字符串（如从数据库获取的 BIGINT 可能被转为字符串），统一转为字符串处理
        const strId = String(id);
        if (expanded.has(strId)) {
            expanded.delete(strId);
        } else {
            expanded.add(strId);
        }
        renderActive();
        renderHistory();
    }

    // ── 活跃区 ──
    async function fetchActive() {
        try {
            let url = '/api/bid-thick-alerts?status=active';
            const symbol = getSymbol(); if (symbol) url += '&symbol=' + encodeURIComponent(symbol);
            const mr = getMinRatio();   if (mr) url += '&min_ratio=' + mr;
            const res = await fetch(url);
            activeData = await res.json();
            renderActive();
        } catch (e) { console.error('fetchActive:', e); }
    }

    function renderActive() {
        const el = document.getElementById('active-content');
        document.getElementById('active-count').textContent = activeData.length > 0 ? activeData.length + ' 只' : '';
        if (!activeData.length) { el.innerHTML = '<div class="no-alert">✓ 当前无买盘厚度信号</div>'; return; }
        const COLS = 12;
        let html = `<table><thead><tr>
            <th></th><th>Symbol</th><th>档数</th><th>min倍数</th><th>avg倍数</th><th>max倍数</th>
            <th>最小买量</th><th>L1 Bid</th><th>L1 Ask</th><th>持续时间</th><th>发现时间</th><th>#</th>
        </tr></thead><tbody>`;
        activeData.forEach((r, i) => {
            const strId = String(r.id);
            const icon = expanded.has(strId) ? '▼' : '▶';
            html += `<tr class="data-row active-row">
                <td class="expand-cell" onclick="toggleDetail('${strId}')">${icon}</td>
                <td><span class="symbol">${r.symbol}</span></td>
                <td>${r.levels_compared ?? '—'}</td>
                <td><span class="ratio-val">${fmtRatio(r.min_ratio)}</span></td>
                <td><span class="ratio-val">${fmtRatio(r.avg_ratio)}</span></td>
                <td>${fmtRatio(r.max_ratio)}</td>
                <td>${fmtVol(r.min_bid_vol)}</td>
                <td>${fmtPrice(r.l1_bid)}</td>
                <td>${fmtPrice(r.l1_ask)}</td>
                <td><span class="duration-val">${fmtDuration(r)}</span></td>
                <td class="time-cell">${fmtTime(r.detected_at)}</td>
                <td>${i+1}</td>
            </tr>`;
            if (expanded.has(strId)) html += detailRowHtml(r, COLS);
        });
        html += '</tbody></table>';
        el.innerHTML = html;
    }

    // ── 历史区 ──
    async function fetchHistory() {
        try {
            let url = `/api/bid-thick-alerts?status=recovered&hours=${getHours()}&limit=200&sort=${historySortCol}&order=${historySortDir}`;
            const symbol = getSymbol(); if (symbol) url += '&symbol=' + encodeURIComponent(symbol);
            const mr = getMinRatio();   if (mr) url += '&min_ratio=' + mr;
            const res = await fetch(url);
            historyData = await res.json();
            renderHistory();
        } catch (e) { console.error('fetchHistory:', e); }
    }

    function renderHistory() {
        const el = document.getElementById('history-content');
        if (!historyData.length) { el.innerHTML = '<div class="empty">暂无历史记录</div>'; return; }
        const thIcon = col => historySortCol !== col ? '<span style="color:#444">↕</span>' : (historySortDir === 'desc' ? '↓' : '↑');
        const thCls  = col => historySortCol === col ? 'sorted' : '';
        const COLS = 13;
        let html = `<table><thead><tr>
            <th></th><th>Symbol</th><th>档数</th>
            <th onclick="sortHistory('min_ratio')" class="${thCls('min_ratio')}">min倍数 ${thIcon('min_ratio')}</th>
            <th onclick="sortHistory('avg_ratio')" class="${thCls('avg_ratio')}">avg倍数 ${thIcon('avg_ratio')}</th>
            <th onclick="sortHistory('max_ratio')" class="${thCls('max_ratio')}">max倍数 ${thIcon('max_ratio')}</th>
            <th>最小买量</th><th>L1 Bid</th><th>L1 Ask</th>
            <th onclick="sortHistory('duration_sec')" class="${thCls('duration_sec')}">持续时间 ${thIcon('duration_sec')}</th>
            <th onclick="sortHistory('detected_at')" class="${thCls('detected_at')}">发现时间 ${thIcon('detected_at')}</th>
            <th>恢复时间</th><th>#</th>
        </tr></thead><tbody>`;
        historyData.forEach((r, i) => {
            const strId = String(r.id);
            const icon = expanded.has(strId) ? '▼' : '▶';
            html += `<tr class="data-row">
                <td class="expand-cell" onclick="toggleDetail('${strId}')">${icon}</td>
                <td><span class="symbol">${r.symbol}</span></td>
                <td>${r.levels_compared ?? '—'}</td>
                <td><span class="ratio-val">${fmtRatio(r.min_ratio)}</span></td>
                <td><span class="ratio-val">${fmtRatio(r.avg_ratio)}</span></td>
                <td>${fmtRatio(r.max_ratio)}</td>
                <td>${fmtVol(r.min_bid_vol)}</td>
                <td>${fmtPrice(r.l1_bid)}</td>
                <td>${fmtPrice(r.l1_ask)}</td>
                <td><span class="duration-val">${fmtDuration(r)}</span></td>
                <td class="time-cell">${fmtTime(r.detected_at)}</td>
                <td class="time-cell">${fmtTime(r.recovered_at)}</td>
                <td>${i+1}</td>
            </tr>`;
            if (expanded.has(strId)) html += detailRowHtml(r, COLS);
        });
        html += '</tbody></table>';
        el.innerHTML = html;
    }

    function sortHistory(col) {
        historySortDir = historySortCol === col ? (historySortDir === 'desc' ? 'asc' : 'desc') : 'desc';
        historySortCol = col;
        fetchHistory();
    }

    // ── 事件绑定 ──
    document.getElementById('filter-symbol').addEventListener('input', () => { fetchActive(); fetchHistory(); });
    document.getElementById('filter-hours').addEventListener('change', fetchHistory);
    document.getElementById('filter-min-ratio').addEventListener('input', () => { fetchActive(); fetchHistory(); });

    // ── 启动 ──
    fetchActive();
    fetchHistory();
    setInterval(fetchActive, 1000);
    setInterval(renderActive, 1000);  // 持续时间实时更新
</script>
    <script src="/js/open-stock.js" defer></script>
</body>
</html>
