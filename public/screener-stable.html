<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>稳定选股器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #1a1a1a;
    color: #ddd;
    padding: 20px;
    line-height: 1.6;
  }
  .container { max-width: 1600px; margin: 0 auto; }

  /* ── 导航 ── */
  .nav-links { text-align: center; margin-bottom: 20px; }
  .nav-links a {
    color: #007acc; text-decoration: none; padding: 6px 14px; margin: 0 6px;
    border: 1px solid #007acc; border-radius: 4px; transition: all 0.2s;
    display: inline-block; font-size: 13px;
  }
  .nav-links a:hover { background-color: #007acc; color: white; }
  .nav-links a.active { background-color: #007acc; color: white; }

  /* ── 标题栏 ── */
  .header-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; border-bottom: 1px solid #333; padding-bottom: 12px;
  }
  .title { font-size: 1.4em; color: #ddd; font-weight: normal; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .refresh-info { font-size: 12px; color: #888; white-space: nowrap; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #555; margin-right: 6px; vertical-align: middle;
    transition: background 0.3s;
  }
  .status-dot.live  { background: #26a69a; box-shadow: 0 0 5px #26a69a; }
  .status-dot.error { background: #ef5350; }

  /* ── 筛选面板 ── */
  .filter-panel-wrap { margin-bottom: 14px; }
  .filter-toggle-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 14px; background: #2a2a2a; border-radius: 6px;
    cursor: pointer; user-select: none;
    border: 1px solid #333; transition: border-color 0.15s;
  }
  .filter-toggle-bar:hover { border-color: #444; }
  .filter-toggle-left { display: flex; align-items: center; gap: 10px; }
  .filter-toggle-label { font-size: 12px; color: #666; }
  .filter-active-pills { display: flex; gap: 5px; flex-wrap: wrap; }
  .filter-pill {
    font-size: 11px; padding: 1px 8px; border-radius: 10px;
    background: #007acc1a; border: 1px solid #007acc44; color: #7ac0f0;
  }
  .filter-chevron { font-size: 10px; color: #555; transition: transform 0.2s ease; }
  .filter-chevron.open { transform: rotate(180deg); }
  .filter-body {
    overflow: hidden; max-height: 0; opacity: 0;
    transition: max-height 0.25s ease, opacity 0.2s ease;
  }
  .filter-body.open { max-height: 160px; opacity: 1; }
  .filter-panel {
    background: #2a2a2a; padding: 12px 16px 14px;
    border-radius: 0 0 6px 6px; border-top: 1px solid #333;
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end;
  }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 12px; color: #888; }
  .filter-row { display: flex; align-items: center; gap: 5px; }
  .filter-sep { font-size: 12px; color: #555; }

  input[type=number], input[type=text] {
    background: #1a1a1a; border: 1px solid #444; color: #ddd;
    padding: 5px 8px; border-radius: 4px; font-size: 13px;
    outline: none; transition: border-color 0.15s;
  }
  input[type=number] {
    width: 80px;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number]:focus, input[type=text]:focus { border-color: #007acc; }
  input[type=number]::placeholder,
  input[type=text]::placeholder { color: #555; }
  input[type=number].has-value { border-color: #007acc55; color: #7ac0f0; }

  .filter-actions { display: flex; align-items: flex-end; gap: 8px; margin-left: auto; }
  .btn {
    padding: 6px 16px; border-radius: 4px; border: 1px solid #444;
    background: #1a1a1a; color: #ccc; font-size: 13px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { border-color: #888; color: #fff; }
  .btn.primary { border-color: #007acc; color: #7ac0f0; background: #007acc18; }
  .btn.primary:hover { background: #007acc30; }

  /* ── 屏蔽管理按钮 ── */
  .block-btn {
    background: #1a1a1a; border: 1px solid #444; color: #aaa;
    padding: 5px 12px; border-radius: 4px; font-size: 13px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .block-btn:hover { border-color: #ef5350; color: #ef5350; }
  .block-btn.has-blocked { border-color: #ef5350; color: #ef5350; }

  /* ── 右键菜单 ── */
  #ctx-menu {
    position: fixed; background: #2a2a2a; border: 1px solid #444;
    border-radius: 4px; padding: 4px 0; z-index: 9999; min-width: 150px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5); display: none;
  }
  #ctx-menu .ctx-item { padding: 8px 14px; font-size: 13px; cursor: pointer; color: #ddd; white-space: nowrap; }
  #ctx-menu .ctx-item:hover { background: #3a3a3a; }
  #ctx-menu .ctx-item.danger { color: #ef5350; }

  /* ── 屏蔽管理浮层 ── */
  #block-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 9000; align-items: center; justify-content: center;
  }
  #block-modal-overlay.open { display: flex; }
  #block-modal {
    background: #252525; border: 1px solid #444; border-radius: 8px;
    width: 420px; max-height: 70vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid #333; font-size: 14px; color: #ddd;
  }
  .modal-close { background: none; border: none; color: #666; font-size: 18px; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: #ddd; }
  .modal-add { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #333; }
  .modal-add input { flex: 1; }
  .modal-add button {
    background: none; border: 1px solid #555; color: #aaa; padding: 5px 12px;
    border-radius: 3px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .modal-add button:hover { border-color: #ef5350; color: #ef5350; }
  .modal-body { flex: 1; overflow-y: auto; padding: 10px 16px; }
  .modal-empty { text-align: center; padding: 30px; color: #555; font-size: 13px; }
  .block-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid #2e2e2e; font-size: 13px;
  }
  .block-item:last-child { border-bottom: none; }
  .block-item-code { color: #fff; font-weight: 600; }
  .unblock-btn {
    background: none; border: 1px solid #555; color: #aaa; padding: 2px 8px;
    border-radius: 3px; font-size: 12px; cursor: pointer;
  }
  .unblock-btn:hover { border-color: #26a69a; color: #26a69a; }
  .modal-footer { padding: 10px 16px; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 8px; }
  .modal-footer button {
    padding: 5px 14px; border-radius: 3px; font-size: 13px; cursor: pointer;
    border: 1px solid #555; background: none; color: #aaa;
  }
  .modal-footer button:hover { border-color: #ddd; color: #ddd; }
  .modal-footer .btn-danger { border-color: #ef5350; color: #ef5350; }
  .modal-footer .btn-danger:hover { background: rgba(239,83,80,0.12); }

  /* ── 代码列：行内屏蔽按钮，hover 时显示 ── */
  .symbol-cell { display: inline-flex; align-items: center; gap: 5px; }
  .btn-block-inline {
    display: none; background: none; border: 1px solid #555; color: #777;
    font-size: 11px; line-height: 1; padding: 1px 4px; border-radius: 3px;
    cursor: pointer; flex-shrink: 0;
  }
  tr:hover .btn-block-inline { display: inline-block; }
  .btn-block-inline:hover { border-color: #ef5350; color: #ef5350; }

  /* ── 代码查询框 ── */
  .lookup-panel {
    background: #222; border: 1px solid #333; border-radius: 6px;
    margin-bottom: 14px; padding: 12px 16px;
  }
  .lookup-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lookup-row label { font-size: 12px; color: #888; white-space: nowrap; }
  #symbolInput {
    width: 130px; font-size: 14px; font-weight: bold;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .lookup-result {
    margin-top: 10px; display: none;
    background: #1a1a1a; border: 1px solid #333; border-radius: 4px;
    padding: 10px 14px;
  }
  .lookup-result.show { display: block; }

  /* 历史时间点面板 */
  .history-panel {
    margin-top: 10px; display: none;
    background: #1a1a1a; border: 1px solid #333; border-radius: 4px;
    padding: 12px 14px;
  }
  .history-panel.show { display: block; }
  .history-header {
    font-size: 12px; color: #666; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .history-header strong { color: #aaa; }
  .history-empty { font-size: 13px; color: #555; padding: 6px 0; }
  .timeline { display: flex; flex-direction: column; position: relative; }
  .timeline::before {
    content: ''; position: absolute; left: 56px; top: 8px; bottom: 8px;
    width: 1px; background: #2e2e2e; z-index: 0;
  }
  .tl-item { display: flex; align-items: flex-start; gap: 12px; padding: 5px 0; }
  .tl-time { font-size: 12px; color: #888; white-space: nowrap; width: 48px; text-align: right; padding-top: 3px; flex-shrink: 0; }
  .tl-dot { width: 9px; height: 9px; border-radius: 50%; background: #26a69a; flex-shrink: 0; margin-top: 4px; position: relative; z-index: 1; box-shadow: 0 0 0 2px #1a1a1a; }
  .tl-dot.current { background: #ffd54f; box-shadow: 0 0 0 2px #1a1a1a, 0 0 6px #ffd54f88; }
  .tl-body { flex: 1; }
  .tl-label { font-size: 12px; color: #aaa; }
  .tl-label.current { color: #ffd54f; }
  .tl-vals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; font-size: 11px; color: #555; }
  .tl-val-item span { color: #26a69a; }
  .lookup-sym {
    font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 8px;
  }
  .lookup-sym span { font-size: 12px; font-weight: normal; margin-left: 10px; }
  .lookup-sym .pass-all { color: #26a69a; }
  .lookup-sym .fail-some { color: #ef5350; }
  .lookup-sym .no-data { color: #888; }
  .rule-detail-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
    margin-top: 6px;
  }
  .rule-card {
    background: #252525; border-radius: 4px; padding: 8px 10px;
    border-left: 3px solid #333;
  }
  .rule-card.pass { border-left-color: #26a69a; }
  .rule-card.fail { border-left-color: #ef5350; }
  .rule-card.na   { border-left-color: #444; opacity: 0.6; }
  .rule-card-title { font-size: 11px; color: #666; margin-bottom: 3px; }
  .rule-card-value { font-size: 13px; font-weight: bold; }
  .rule-card.pass .rule-card-value { color: #26a69a; }
  .rule-card.fail .rule-card-value { color: #ef5350; }
  .rule-card.na   .rule-card-value { color: #555; }
  .rule-card-threshold { font-size: 10px; color: #555; margin-top: 2px; }

  /* ── 状态栏 ── */
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: #888; margin-bottom: 8px; padding: 0 2px;
  }
  .rule-summary { display: flex; gap: 10px; align-items: center; }
  .rule-tag {
    padding: 2px 8px; border-radius: 3px; font-size: 11px;
    border: 1px solid #26a69a44; color: #26a69a; background: #26a69a0a;
  }

  /* ── 表格 ── */
  table {
    width: 100%; border-collapse: collapse;
    background-color: #252525; border-radius: 8px; overflow: hidden;
    font-size: 13px;
  }
  th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid #2e2e2e; }
  th {
    background-color: #333; color: #bbb; font-weight: 600;
    font-size: 12px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { color: #fff; }
  th.sort-asc::after  { content: ' ↑'; color: #007acc; }
  th.sort-desc::after { content: ' ↓'; color: #007acc; }
  th:first-child, td:first-child { text-align: left; padding-left: 14px; }
  tr:hover { background-color: #2a2a2a; }

  .sym { font-weight: bold; color: #fff; font-size: 14px; cursor: pointer; }
  .sym:hover { color: #7ac0f0; text-decoration: underline; }
  .up   { color: #26a69a; }
  .down { color: #ef5350; }
  .flat { color: #888; }

  /* rule value cells */
  td.r-pass { color: #26a69a; }
  td.r-fail { color: #ef5350; }
  td.r-na   { color: #555; }

  /* vol bar */
  .vol-cell { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
  .mini-bar { width: 32px; height: 3px; background: #333; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
  .mini-bar-fill { height: 100%; background: #007acc; border-radius: 2px; }

  .empty-row td { text-align: center; padding: 60px; color: #555; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #333; border-top-color: #007acc;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  tr.grace td { color: #40a9ff !important; }
  tr.grace .up, tr.grace .down, tr.grace .flat { color: #40a9ff !important; }
  tr.grace .r-pass { color: #40a9ff !important; }
  tr.grace-pinned td { color: #40a9ff !important; font-weight: 500; }
  tr.grace-pinned .up, tr.grace-pinned .down, tr.grace-pinned .flat { color: #40a9ff !important; }
  tr.grace-pinned .r-pass { color: #40a9ff !important; }
  tr.grace-pinned { border-left: 2px solid #40a9ff; }
  .grace-badge {
    font-size: 10px; padding: 1px 5px; border-radius: 2px;
    background: #40a9ff22; border: 1px solid #40a9ff55;
    color: #40a9ff; margin-left: 5px; vertical-align: middle;
  }

  @media (max-width: 900px) {
    .filter-panel { gap: 10px; }
    .header-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
    .rule-detail-grid { grid-template-columns: repeat(2, 1fr); }
    #block-modal { width: 90vw; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- 导航 -->
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/alerts">价格提醒</a>
    <a href="/volume-alerts">放量提醒</a>
    <a href="/hills">山丘形态</a>
    <a href="/hill-alerts">山丘放量</a>
    <a href="/ranking">涨跌排名</a>
    <a href="/l2-alerts">L2大单</a>
    <a href="/screener">选股器</a>
    <a href="/swing-screener">波段扫描</a>
    <a href="/stable-screener" class="active">稳定选股</a>
    <a href="/oscillator-screener">震荡选股</a>
    <a href="/boundary-alerts">边界预警</a>
    <a href="/active-trading">活跃主买</a>
    <a href="/abnormal-trades">异常成交</a>
  </div>

  <!-- 标题栏 -->
  <div class="header-bar">
    <h1 class="title">稳定选股器
      <span style="font-size:0.6em;color:#555;margin-left:8px;">6条规则全部通过</span>
    </h1>
    <div class="header-right">
      <button class="block-btn" id="btn-manage-block" onclick="openBlockModal()">🚫 屏蔽管理</button>
      <span id="status-text" style="font-size:12px;color:#888;">
        <span class="status-dot" id="status-dot"></span>初始化
      </span>
      <span class="refresh-info" id="refresh-timer">10s 后刷新</span>
    </div>
  </div>

  <!-- 基础筛选面板 -->
  <div class="filter-panel-wrap">
    <div class="filter-toggle-bar" onclick="toggleFilter()">
      <div class="filter-toggle-left">
        <span class="filter-toggle-label">筛选条件</span>
        <div class="filter-active-pills" id="filterPills"></div>
      </div>
      <span class="filter-chevron" id="filterChevron">▼</span>
    </div>
    <div class="filter-body" id="filterBody">
      <div class="filter-panel">
        <div class="filter-group">
          <label>价格区间</label>
          <div class="filter-row">
            <input type="number" id="priceMin" placeholder="最低" step="1" min="0">
            <span class="filter-sep">—</span>
            <input type="number" id="priceMax" placeholder="最高" step="1" min="0">
          </div>
        </div>

        <div class="filter-group">
          <label>涨跌幅绝对值 %</label>
          <div class="filter-row">
            <input type="number" id="changeMin" placeholder="最低" step="0.1" min="0">
            <span class="filter-sep">—</span>
            <input type="number" id="changeMax" placeholder="最高" step="0.1" min="0">
          </div>
        </div>

        <div class="filter-group">
          <label>成交量区间</label>
          <div class="filter-row">
            <input type="number" id="volMin" placeholder="最低" step="1000" min="0">
            <span class="filter-sep">—</span>
            <input type="number" id="volMax" placeholder="最高" step="1000" min="0">
          </div>
        </div>

        <div class="filter-group">
          <label>涨跌额绝对值</label>
          <div class="filter-row">
            <input type="number" id="changeAmtMin" placeholder="最低" step="0.01" min="0">
            <span class="filter-sep">—</span>
            <input type="number" id="changeAmtMax" placeholder="最高" step="0.01" min="0">
          </div>
        </div>

        <div class="filter-actions">
          <button class="btn" onclick="clearFilters()">清空</button>
          <button class="btn primary" onclick="run()">筛选</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 代码查询面板 -->
  <div class="lookup-panel">
    <div class="lookup-row">
      <label>查询单只股票规则详情</label>
      <input type="text" id="symbolInput" placeholder="输入代码" maxlength="20"
             oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')handleLookup()">
      <input type="text" id="timeFrom" placeholder="开始 HH:MM" maxlength="5"
             style="width:108px;"
             oninput="this.value=this.value.replace(/[^0-9:]/g,'')"
             onkeydown="if(event.key==='Enter')handleLookup()">
      <span style="font-size:12px;color:#555;">—</span>
      <input type="text" id="timeTo" placeholder="结束 HH:MM" maxlength="5"
             style="width:108px;"
             oninput="this.value=this.value.replace(/[^0-9:]/g,'')"
             onkeydown="if(event.key==='Enter')handleLookup()">
      <button class="btn" onclick="handleLookup()">查询</button>
      <button class="btn" onclick="lookupHistory()" title="查询今日满足全部条件的历史时间点">📅 今日时间点</button>
      <button class="btn" onclick="clearLookup()" style="color:#555;border-color:#333;">清除</button>
      <span style="font-size:12px;color:#555;margin-left:4px;">时间留空查实时，填时间查历史快照</span>
    </div>
    <div class="lookup-result" id="lookupResult"></div>
    <div class="history-panel" id="historyPanel"></div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="rule-summary">
      <span class="rule-tag">R1 振幅&lt;1.2%</span>
      <span class="rule-tag">R2 量≥310</span>
      <span class="rule-tag">R3 价偏分档</span>
      <span class="rule-tag">R4 漂移分档</span>
      <span class="rule-tag">R5 ≥6/10分钟安静</span>
      <span class="rule-tag">R6 触轨a≥3或b≥3</span>
    </div>
    <span id="count-info">—</span>
  </div>

  <!-- 主表格 -->
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('symbol')">代码</th>
        <th onclick="sortBy('last_price')">现价</th>
        <th onclick="sortBy('change_pct')" class="sort-desc">涨跌%</th>
        <th onclick="sortBy('change_amount')">涨跌额</th>
        <th onclick="sortBy('total_volume')">今日量</th>
        <th onclick="sortBy('vol_ratio')">量比</th>
        <th onclick="sortBy('r1_val')" title="7分钟振幅%，&lt;1.2%">R1 振幅%</th>
        <th onclick="sortBy('r2_vol')" title="7分钟总量，≥310">R2 量</th>
        <th onclick="sortBy('r3_pct')" title="现价偏离均价%，按开盘价分档">R3 价偏%</th>
        <th onclick="sortBy('r4_pct')" title="首尾中间价漂移%，按开盘价分档">R4 漂%</th>
        <th onclick="sortBy('r5_cnt')" title="最近10分钟内安静分钟数，≥6">R5 分钟</th>
        <th onclick="sortBy('r6_a')" title="7分钟触下轨(a)和上轨(b)的K线数，a≥3或b≥3才通过">R6 触轨</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr class="empty-row"><td colspan="12"><span class="spinner"></span>加载中...</td></tr>
    </tbody>
  </table>

</div>

<!-- 右键菜单 -->
<div id="ctx-menu">
  <div class="ctx-item danger" id="ctx-block">屏蔽此股票</div>
</div>

<!-- 屏蔽管理浮层 -->
<div id="block-modal-overlay" onclick="closeBlockModal(event)">
  <div id="block-modal">
    <div class="modal-header">
      <span>🚫 屏蔽股票管理 <span style="color:#555;font-size:12px;margin-left:8px">所有页面同步，仅存本机浏览器</span></span>
      <button class="modal-close" onclick="closeBlockModal()">×</button>
    </div>
    <div class="modal-add">
      <input type="text" id="manual-block-input" placeholder="手动输入代码,如 AAPL">
      <button onclick="addManualBlock()">添加屏蔽</button>
    </div>
    <div class="modal-body" id="block-list"></div>
    <div class="modal-footer">

      <button onclick="closeBlockModal()">关闭</button>
    </div>
  </div>
</div>

<script src="/js/whitelist.js"></script>
<script>
// ── STATE ─────────────────────────────────────────────────────────────────
let allData    = [];   // 全部从接口返回的数据（未过滤）
let sortedData = [];   // 过滤+排序后用于渲染的数据
let sortKey    = 'change_pct';
let sortDir    = -1;
let maxVol     = 1;
let countdown  = 10;
let lastParams = {};
let isFetching = false;
let blockedStocks = JSON.parse(localStorage.getItem('sharedBlockedStocks') || '[]');

// ── BLOCKED STOCKS（所有页面共享 localStorage key，跨页面同步）──────────────
function saveBlocked() {
  localStorage.setItem('sharedBlockedStocks', JSON.stringify(blockedStocks));
  const btn = document.getElementById('btn-manage-block');
  if (btn) {
    if (blockedStocks.length > 0) {
      btn.classList.add('has-blocked');
      btn.textContent = `🚫 屏蔽管理 (${blockedStocks.length})`;
    } else {
      btn.classList.remove('has-blocked');
      btn.textContent = '🚫 屏蔽管理';
    }
  }
  renderBlockList();
}

function blockStock(sym) {
  sym = (sym || '').trim().toUpperCase();
  if (!sym || blockedStocks.includes(sym)) return;
  blockedStocks.push(sym);
  saveBlocked();
  applyFilter();
}

function unblockStock(sym) {
  blockedStocks = blockedStocks.filter(s => s !== sym);
  saveBlocked();
  applyFilter();
}

function clearAllBlocked() {
  if (blockedStocks.length === 0) return;
  if (!confirm('确认清空所有屏蔽股票?')) return;
  blockedStocks = [];
  saveBlocked();
  applyFilter();
}

function addManualBlock() {
  const input = document.getElementById('manual-block-input');
  if (!input) return;
  const val = input.value.trim().toUpperCase();
  if (!val) return;
  const symbols = val.split(/[,，\s]+/).map(s => s.trim()).filter(s => s);
  for (const sym of symbols) blockStock(sym);
  input.value = '';
}

function openBlockModal() {
  renderBlockList();
  document.getElementById('block-modal-overlay').classList.add('open');
}

function closeBlockModal(e) {
  if (e && e.target !== document.getElementById('block-modal-overlay')) return;
  document.getElementById('block-modal-overlay').classList.remove('open');
}

function renderBlockList() {
  const container = document.getElementById('block-list');
  if (!container) return;
  if (blockedStocks.length === 0) {
    container.innerHTML = '<div class="modal-empty">暂无屏蔽股票</div>';
    return;
  }
  container.innerHTML = [...blockedStocks].sort().map(sym => `
    <div class="block-item">
      <span class="block-item-code">${sym}</span>
      <button class="unblock-btn" onclick="unblockStock('${sym}')">解除屏蔽</button>
    </div>
  `).join('');
}

// ── 宽限期状态 ────────────────────────────────────────────────────────────
// 退出后立即消失；5分钟内任意相邻分钟波动≥0.5%则置顶2分钟后消失
// symbol -> { exitAt, priceHistory:[{price,ts}], pinned, pinnedAt, row }
const graceMap = new Map();
let prevPassSymbols = new Set();
const MONITOR_MS      = 5 * 60 * 1000;   // 退出后监控5分钟
const PINNED_MS       = 2 * 60 * 1000;   // 置顶显示2分钟
const MOVE_THRESH     = 0.005;            // 分钟级波动阈值0.5%
const MIN_INTERVAL_MS = 50 * 1000;       // 相邻采样至少50秒才算相邻分钟

function updateGrace(passSymbols, allRows) {
  const now = Date.now();

  // 1. 更新已在监控/置顶中的股票
  for (const [sym, g] of graceMap) {
    const curRow = allRows.find(r => r.symbol === sym);
    const price  = curRow ? Number(curRow.last_price) : 0;
    if (price > 0) {
      g.row = curRow;
      g.priceHistory.push({ price, ts: now });
      // 检测相邻分钟（间隔≥50s）波动是否≥0.5%
      if (!g.pinned) {
        const hist = g.priceHistory;
        for (let i = hist.length - 1; i >= 1; i--) {
          if (hist[i].ts - hist[i - 1].ts >= MIN_INTERVAL_MS) {
            const move = Math.abs(hist[i].price - hist[i - 1].price) / hist[i - 1].price;
            if (move >= MOVE_THRESH) {
              g.pinned   = true;
              g.pinnedAt = now;
            }
            break;
          }
        }
      }
    }
    // 清理：未置顶且监控期过，或置顶期过
    const monitorExpired = now - g.exitAt > MONITOR_MS;
    const pinnedExpired  = g.pinned && (now - g.pinnedAt > PINNED_MS);
    if ((!g.pinned && monitorExpired) || pinnedExpired) graceMap.delete(sym);
  }

  // 2. 之前通过、现在退出 → 加入监控（不显示，静默监控）
  for (const sym of prevPassSymbols) {
    if (!passSymbols.has(sym) && !graceMap.has(sym)) {
      const row   = allRows.find(r => r.symbol === sym);
      if (!row) continue;
      const price = Number(row.last_price) || 0;
      graceMap.set(sym, {
        exitAt:       now,
        priceHistory: price > 0 ? [{ price, ts: now }] : [],
        pinned:       false,
        pinnedAt:     null,
        row,
      });
    }
    // 重新满足条件 → 退出监控
    if (passSymbols.has(sym) && graceMap.has(sym)) graceMap.delete(sym);
  }

  // 3. 更新 prevPassSymbols
  prevPassSymbols = new Set(passSymbols);
}

function getGraceRows() {
  // 只返回已触发置顶且置顶期未过的行
  const now = Date.now();
  return [...graceMap.entries()]
    .filter(([, g]) => g.pinned && g.row && now - g.pinnedAt <= PINNED_MS)
    .map(([, g]) => ({
      ...g.row,
      _grace:    true,
      _pinned:   true,
      _remainMs: PINNED_MS - (now - g.pinnedAt),
    }));
}

const SORT_KEYS = [
  'symbol','last_price','change_pct','change_amount','total_volume','vol_ratio',
  'r1_val','r2_vol','r3_pct','r4_pct','r5_cnt','r6_a'
];

// ── 分档阈值函数（与 server.js 保持一致）─────────────────────────────────
function getR35Thresh(openPrice) {
  const p = Math.max(Number(openPrice) || 0, 0);
  if (p < 125)  return 0.5;   // %
  if (p < 267)  return 0.4;
  if (p < 480)  return 0.3;
  if (p < 1000) return 0.25;
  return 0.15;
}
function getR4Thresh(openPrice) {
  const p = Math.max(Number(openPrice) || 0, 0);
  if (p < 200)  return 0.3;   // %
  if (p < 400)  return 0.2;
  if (p < 800)  return 0.15;
  return 0.1;
}

// ── RULE EVAL（固定6条，全部必须通过）─────────────────────────────────────
function evalRow(row) {
  const op = Number(row.open_price) || Number(row.last_price) || 0;
  const r35T = getR35Thresh(op);
  const r4T  = getR4Thresh(op);
  const r1_pass = row.r1_val !== null && row.r1_val !== undefined ? row.r1_val < 1.2    : null;
  const r2_pass = row.r2_vol !== null && row.r2_vol !== undefined ? row.r2_vol >= 310   : null;
  const r3_pass = row.r3_pct !== null && row.r3_pct !== undefined ? row.r3_pct < r35T  : null;
  const r4_pass = row.r4_pct !== null && row.r4_pct !== undefined ? row.r4_pct < r4T   : null;
  const r5_pass = row.r5_cnt !== null && row.r5_cnt !== undefined ? row.r5_cnt >= 6    : null;
  // R6: 7分钟内触下轨(a)和触上轨(b)的K线数，a >= 3 或 b >= 3 才通过
  const r6_pass = (row.r6_a !== null && row.r6_a !== undefined &&
                   row.r6_b !== null && row.r6_b !== undefined)
    ? (row.r6_a >= 3 || row.r6_b >= 3)
    : null;
  const passAll = r1_pass === true && r2_pass === true && r3_pass === true
               && r4_pass === true && r5_pass === true && r6_pass === true;
  return { r1_pass, r2_pass, r3_pass, r4_pass, r5_pass, r6_pass, passAll, r35T, r4T };
}

// ── INPUTS ────────────────────────────────────────────────────────────────
const FILTER_IDS = ['priceMin','priceMax','changeMin','changeMax','volMin','volMax',
                    'changeAmtMin','changeAmtMax'];
const FILTER_QUERY_KEYS = FILTER_IDS.map(id => id.replace(/([A-Z])/g, '_$1').toLowerCase());
const NAV_STATE_KEY = 'rememberedFilterUrls';
const NAV_PERSIST_PATHS = new Set(['/ranking','/screener','/stable-screener','/active-trading','/swing-screener','/oscillator-screener','/abnormal-trades']);

function queryKeyToId(key) {
  return key.replace(/_([a-z])/g, (_, ch) => ch.toUpperCase());
}
function readFiltersFromDom() {
  const filters = {};
  FILTER_IDS.forEach(id => {
    const value = document.getElementById(id)?.value.trim();
    if (value) filters[id.replace(/([A-Z])/g, '_$1').toLowerCase()] = value;
  });
  return filters;
}
function writeFiltersToDom(filters) {
  FILTER_QUERY_KEYS.forEach(key => {
    const el = document.getElementById(queryKeyToId(key));
    if (el) el.value = filters[key] || '';
  });
}
function syncFiltersToUrl() {
  const url = new URL(window.location.href);
  FILTER_QUERY_KEYS.forEach(key => url.searchParams.delete(key));
  Object.entries(readFiltersFromDom()).forEach(([key, value]) => {
    if (value) url.searchParams.set(key, value);
  });
  window.history.replaceState({}, '', url);
  rememberCurrentUrl();
  hydrateRememberedNavLinks();
}
function restoreFiltersFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const filters = {};
  FILTER_QUERY_KEYS.forEach(key => {
    const value = params.get(key);
    if (value !== null) filters[key] = value;
  });
  writeFiltersToDom(filters);
}
function loadRememberedNavUrls() {
  try {
    return JSON.parse(sessionStorage.getItem(NAV_STATE_KEY) || '{}');
  } catch (_) {
    return {};
  }
}
function hydrateRememberedNavLinks() {
  const saved = loadRememberedNavUrls();
  document.querySelectorAll('.nav-links a[href]').forEach(link => {
    const href = link.getAttribute('href');
    if (NAV_PERSIST_PATHS.has(href) && saved[href]) link.href = saved[href];
  });
}
function rememberCurrentUrl() {
  const path = window.location.pathname;
  if (!NAV_PERSIST_PATHS.has(path)) return;
  const saved = loadRememberedNavUrls();
  saved[path] = `${path}${window.location.search}${window.location.hash}`;
  sessionStorage.setItem(NAV_STATE_KEY, JSON.stringify(saved));
}

function getV(id) {
  const v = document.getElementById(id)?.value.trim();
  return (!v || v === '') ? null : Number(v);
}

let filterOpen = false;
function toggleFilter() {
  filterOpen = !filterOpen;
  document.getElementById('filterBody').classList.toggle('open', filterOpen);
  document.getElementById('filterChevron').classList.toggle('open', filterOpen);
}

function updateHighlights() {
  FILTER_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('has-value', el.value.trim() !== '');
  });
  const pairs = [
    ['priceMin','priceMax','价格'],
    ['changeMin','changeMax','涨跌%'],
    ['volMin','volMax','成交量'],
    ['changeAmtMin','changeAmtMax','涨跌额'],
  ];
  const pills = document.getElementById('filterPills');
  if (!pills) return;
  pills.innerHTML = pairs
    .filter(([a, b]) => document.getElementById(a)?.value.trim() || document.getElementById(b)?.value.trim())
    .map(([a, b, label]) => {
      const va = document.getElementById(a)?.value.trim();
      const vb = document.getElementById(b)?.value.trim();
      const range = va && vb ? `${va}–${vb}` : va ? `≥${va}` : `≤${vb}`;
      return `<span class="filter-pill">${label} ${range}</span>`;
    })
    .join('');
}
function clearFilters() {
  FILTER_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = ''; el.classList.remove('has-value'); }
  });
  syncFiltersToUrl();
  applyFilter();
}

// ── SORT ──────────────────────────────────────────────────────────────────
function sortBy(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = -1; }
  document.querySelectorAll('thead th').forEach((th, i) => {
    th.classList.remove('sort-asc','sort-desc');
    if (SORT_KEYS[i] === key) th.classList.add(sortDir === -1 ? 'sort-desc' : 'sort-asc');
  });
  applyFilter();
}

// ── FETCH ─────────────────────────────────────────────────────────────────
async function fetchData(params) {
  if (isFetching) return;
  isFetching = true;
  const dot  = document.getElementById('status-dot');
  const stxt = document.getElementById('status-text');
  try {
    const qs  = Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
    const res = await fetch(`/api/screener-stable${qs ? '?'+qs : ''}`);
    if (!res.ok) throw new Error(res.status);
    allData = await res.json();
    if (window.Whitelist) allData = window.Whitelist.filter(allData);
    maxVol  = allData.reduce((m, r) => Math.max(m, Number(r.total_volume)||0), 1);
    if (dot) dot.className = 'status-dot live';
    if (stxt) stxt.innerHTML = `<span class="status-dot live"></span>实时 · ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`;
    applyFilter();
    const sym  = document.getElementById('symbolInput').value.trim().toUpperCase();
    const from = document.getElementById('timeFrom').value.trim();
    const to   = document.getElementById('timeTo').value.trim();
    // 有时间输入时处于历史诊断模式，自动刷新不覆盖诊断结果
    if (sym && !from && !to) renderLookup(sym);
  } catch(e) {
    if (dot) dot.className = 'status-dot error';
    if (stxt) stxt.innerHTML = `<span class="status-dot error"></span>连接失败`;
    console.error(e);
  } finally {
    isFetching = false;
  }
}

function run() {
  updateHighlights();
  syncFiltersToUrl();
  if (allData.length === 0) {
    // 尚无数据，先拉取
    fetchData({});
  } else {
    applyFilter();
  }
}

// ── APPLY FILTER（只保留6条规则全部通过的）────────────────────────────────
function applyFilter() {
  const priceMin  = getV('priceMin');
  const priceMax  = getV('priceMax');
  const changeMin = getV('changeMin');
  const changeMax = getV('changeMax');
  const volMin    = getV('volMin');
  const volMax    = getV('volMax');
  const changeAmtMin = getV('changeAmtMin');
  const changeAmtMax = getV('changeAmtMax');

  const withEval = allData.map(row => {
    const ev  = evalRow(row);
    const vol = Number(row.total_volume) || 0;
    const avg = Number(row.avg_vol_10d)  || 0;
    return { ...row, ...ev, vol_ratio: avg > 0 ? vol / avg : 0 };
  });

  // 满足全部条件的 symbol 集合
  const passRows = withEval.filter(row => {
    if (!row.passAll) return false;
    if (blockedStocks.includes(row.symbol)) return false;
    const price = Number(row.last_price)   || 0;
    const pct   = Number(row.change_pct)   || 0;
    const vol   = Number(row.total_volume) || 0;
    const amt   = Math.abs(Number(row.change_amount) || 0);
    if (priceMin     !== null && price < priceMin)          return false;
    if (priceMax     !== null && price > priceMax)          return false;
    if (changeMin    !== null && Math.abs(pct) < changeMin) return false;
    if (changeMax    !== null && Math.abs(pct) > changeMax) return false;
    if (volMin       !== null && vol   < volMin)            return false;
    if (volMax       !== null && vol   > volMax)            return false;
    if (changeAmtMin !== null && amt   < changeAmtMin)      return false;
    if (changeAmtMax !== null && amt   > changeAmtMax)      return false;
    return true;
  });

  const passSymbols = new Set(passRows.map(r => r.symbol));

  // 更新宽限期状态
  updateGrace(passSymbols, withEval);

  // 正常行排序
  const sorted = [...passRows].sort((a, b) => {
    const va = sortKey === 'symbol' ? a[sortKey] : (Number(a[sortKey]) ?? -Infinity);
    const vb = sortKey === 'symbol' ? b[sortKey] : (Number(b[sortKey]) ?? -Infinity);
    return va < vb ? sortDir : va > vb ? -sortDir : 0;
  });

  // 置顶行排最前，其余正常排序
  const graceRows = getGraceRows();
  const pinnedRows = [...graceRows].sort((a, b) => b._remainMs - a._remainMs);

  sortedData = [...pinnedRows, ...sorted];

  const total = allData.filter(r => evalRow(r).passAll).length;
  document.getElementById('count-info').textContent =
    `全部通过 ${total} 只 · 当前筛选 ${sorted.length} 只` +
    (graceRows.length ? ` · 置顶中 ${graceRows.length} 只` : '');

  renderTable();
}

// ── RENDER TABLE ──────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('tbody');
  if (sortedData.length === 0) {
    const msg = allData.length === 0
      ? '<span class="spinner"></span>加载中...'
      : '暂无符合条件的股票';
    tbody.innerHTML = `<tr class="empty-row"><td colspan="12">${msg}</td></tr>`;
    return;
  }

  const existingRows = {};
  for (const tr of tbody.querySelectorAll('tr[data-sym]')) {
    existingRows[tr.dataset.sym] = tr;
  }

  let ci = 0;
  for (const row of sortedData) {
    const html = buildRowHTML(row);
    let tr = existingRows[row.symbol];
    if (!tr) {
      tr = document.createElement('tr');
      tr.dataset.sym = row.symbol;
    }
    if (tr._lastHtml !== html) { tr.innerHTML = html; tr._lastHtml = html; }
    // 宽限期样式
    tr.className = row._pinned ? 'grace-pinned' : row._grace ? 'grace' : '';
    if (tbody.children[ci] !== tr) tbody.insertBefore(tr, tbody.children[ci] || null);
    ci++;
  }
  while (tbody.children.length > sortedData.length) tbody.removeChild(tbody.lastChild);
}

function buildRowHTML(r) {
  const pct  = Number(r.change_pct);
  const pcls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const sign = pct > 0 ? '+' : '';
  const vol  = Number(r.total_volume) || 0;
  const vPct = Math.min(100, maxVol > 0 ? vol / maxVol * 100 : 0);
  const vr   = r.vol_ratio || 0;

  // 置顶徽标
  let graceBadge = '';
  if (r._pinned) {
    const remainSec = Math.max(0, Math.ceil((r._remainMs || 0) / 1000));
    const mm = String(Math.floor(remainSec / 60)).padStart(2, '0');
    const ss = String(remainSec % 60).padStart(2, '0');
    graceBadge = `<span class="grace-badge">📌 置顶 ${mm}:${ss}</span>`;
  }

  // 规则列：全部通过才显示，所以值只会是绿色
  const rVal = (v, format) => v != null ? format(v) : '—';

  return `
    <td><div class="symbol-cell"><span class="sym" onclick="lookupAndShow('${r.symbol}')">${r.symbol}</span><button class="btn-block-inline" onclick="blockStock('${r.symbol}')" title="屏蔽此股票">×</button>${graceBadge}</div></td>
    <td class="${pcls}">${fmt(r.last_price,2)}</td>
    <td class="${pcls}">${sign}${pct.toFixed(2)}%</td>
    <td class="${pcls}">${sign}${fmt(r.change_amount,3)}</td>
    <td><div class="vol-cell">${fmtVol(vol)}<div class="mini-bar"><div class="mini-bar-fill" style="width:${vPct.toFixed(1)}%"></div></div></div></td>
    <td class="${vr >= 2 ? 'up' : 'flat'}">${vr > 0 ? vr.toFixed(2)+'x' : '—'}</td>
    <td class="r-pass">${rVal(r.r1_val, v => v.toFixed(2)+'%')}</td>
    <td class="r-pass">${rVal(r.r2_vol, v => fmtVol(v))}</td>
    <td class="r-pass">${rVal(r.r3_pct, v => v.toFixed(2)+'%')}</td>
    <td class="r-pass">${rVal(r.r4_pct, v => v.toFixed(2)+'%')}</td>
    <td class="r-pass">${rVal(r.r5_cnt, v => v+'分')}</td>
    <td class="r-pass">${r.r6_a != null ? `a:${r.r6_a} b:${r.r6_b}` : '—'}</td>`;
}

// ── 代码查询 ──────────────────────────────────────────────────────────────
function lookupAndShow(sym) {
  document.getElementById('symbolInput').value = sym;
  document.getElementById('timeFrom').value    = '';   // 点击表格代码 → 回实时模式
  document.getElementById('timeTo').value      = '';
  const hp = document.getElementById('historyPanel');
  hp.className = 'history-panel';
  hp.innerHTML = '';
  renderLookup(sym);
  document.getElementById('lookupResult').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function lookupSymbol() {
  const sym = document.getElementById('symbolInput').value.trim().toUpperCase();
  if (!sym) return;
  renderLookup(sym);
}

function clearLookup() {
  document.getElementById('symbolInput').value = '';
  document.getElementById('timeFrom').value    = '';
  document.getElementById('timeTo').value      = '';
  document.getElementById('lookupResult').className = 'lookup-result';
  document.getElementById('lookupResult').innerHTML = '';
  document.getElementById('historyPanel').className = 'history-panel';
  document.getElementById('historyPanel').innerHTML = '';
}

// 统一入口：有时间 → 历史快照诊断，无时间 → 实时查询
function handleLookup() {
  const from = document.getElementById('timeFrom').value.trim();
  const to   = document.getElementById('timeTo').value.trim();
  if (from || to) {
    diagnoseSymbol();
  } else {
    lookupSymbol();
  }
}

async function diagnoseSymbol() {
  const sym  = document.getElementById('symbolInput').value.trim().toUpperCase();
  const from = document.getElementById('timeFrom').value.trim();
  const to   = document.getElementById('timeTo').value.trim();
  if (!sym) { alert('请输入股票代码'); return; }

  const timeRe = /^\d{2}:\d{2}$/;
  if (from && !timeRe.test(from)) { alert('开始时间格式错误，请输入 HH:MM'); return; }
  if (to   && !timeRe.test(to))   { alert('结束时间格式错误，请输入 HH:MM'); return; }

  const el = document.getElementById('lookupResult');
  el.className = 'lookup-result show';
  document.getElementById('historyPanel').className = 'history-panel';
  document.getElementById('historyPanel').innerHTML = '';

  // 只填了一个时间 → 单点查询；两个都填 → 范围查询
  const isSingle = (from && !to) || (!from && to);
  const singleTime = from || to;

  if (isSingle) {
    el.innerHTML = `<div style="color:#888;font-size:13px;"><span class="spinner"></span>查询 ${sym} @ ${singleTime} 快照中…</div>`;
    try {
      const res  = await fetch(`/api/screener-stable/diagnose?symbol=${encodeURIComponent(sym)}&time=${encodeURIComponent(singleTime)}`);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      renderDiagnose(sym, singleTime, data);
    } catch(e) {
      el.innerHTML = `<div style="color:#ef5350;font-size:13px;">查询失败：${e.message}</div>`;
    }
  } else {
    el.innerHTML = `<div style="color:#888;font-size:13px;"><span class="spinner"></span>查询 ${sym} ${from}–${to} 快照中…</div>`;
    try {
      const res  = await fetch(`/api/screener-stable/diagnose-range?symbol=${encodeURIComponent(sym)}&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      renderDiagnoseRange(sym, data);
    } catch(e) {
      el.innerHTML = `<div style="color:#ef5350;font-size:13px;">查询失败：${e.message}</div>`;
    }
  }
}

function renderDiagnose(sym, time, data) {
  const el = document.getElementById('lookupResult');
  if (!data.found) {
    el.innerHTML = `<div style="color:#888;font-size:13px;">
      <b style="color:#fff">${sym}</b> 在 <b style="color:#fff">${time}</b>
      暂无快照数据（该时间点无交易记录，或快照尚未写入）
    </div>`;
    return;
  }
  const pct  = Number(data.change_pct);
  const pcls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const sign = pct > 0 ? '+' : '';
  const statusLabel = data.pass_all
    ? `<span class="pass-all">✓ 全部通过</span>`
    : `<span class="fail-some">✗ 未全部通过</span>`;
  el.innerHTML = `
    <div class="lookup-sym" style="margin-bottom:6px;">
      ${sym}
      <span class="${pcls}">${fmt(data.last_price,2)}  ${sign}${pct.toFixed(2)}%</span>
      ${statusLabel}
      <span style="color:#555;font-size:11px;margin-left:10px;">@ ${time} · ${data.bars_count} 根K线</span>
    </div>
    <div class="rule-detail-grid">${buildRuleCards(data.rules)}</div>`;
}

function renderDiagnoseRange(sym, data) {
  const el = document.getElementById('lookupResult');
  if (data.count === 0) {
    el.innerHTML = `<div style="color:#888;font-size:13px;">
      <b style="color:#fff">${sym}</b> 在 ${data.from.slice(0,5)}–${data.to.slice(0,5)} 内暂无快照数据
    </div>`;
    return;
  }

  const passCount = data.records.filter(r => r.pass_all).length;

  const rows = data.records.map(rec => {
    const passAll = rec.pass_all;
    const timeStr = rec.snap_time.slice(0, 5);

    // 6条规则内联单元格
    const ruleCells = rec.rules.map(r => {
      let valStr;
      if (r.value === null)   valStr = '—';
      else if (r.id === 'R6') valStr = `a${r.value.a}/b${r.value.b}`;
      else if (r.id === 'R5') valStr = `${Number(r.value).toFixed(0)}`;
      else                    valStr = `${Number(r.value).toFixed(3)}`;

      const color = r.pass === null ? '#555'
                  : r.pass          ? '#26a69a'
                  :                   '#ef5350';
      const title = r.delta ? `${r.id}: ${r.delta}` : r.id;
      return `<td title="${title}" style="padding:6px 8px;text-align:right;color:${color};font-size:12px;white-space:nowrap;">${valStr}</td>`;
    }).join('');

    const statusColor = passAll ? '#26a69a' : '#ef5350';
    const statusText  = passAll ? '✓' : `✗`;
    const failIds     = passAll ? '' : rec.rules.filter(r => r.pass === false).map(r => r.id).join(' ');

    return `<tr style="border-bottom:1px solid #2e2e2e;">
      <td style="padding:6px 10px;color:#aaa;font-size:12px;white-space:nowrap;">${timeStr}</td>
      <td style="padding:6px 8px;text-align:center;">
        <span style="color:${statusColor};font-size:12px;font-weight:bold;">${statusText}</span>
        ${failIds ? `<span style="color:#555;font-size:10px;margin-left:4px;">${failIds}</span>` : ''}
      </td>
      ${ruleCells}
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div style="margin-bottom:8px;font-size:12px;color:#888;">
      <b style="color:#fff;font-size:14px;">${sym}</b>
      <span style="margin-left:10px;">${data.from.slice(0,5)} — ${data.to.slice(0,5)}</span>
      <span style="margin-left:10px;">${data.count} 个时间点</span>
      <span style="margin-left:10px;color:#26a69a;">${passCount} 个全部通过</span>
    </div>
    <table style="width:100%;border-collapse:collapse;background:#252525;border-radius:6px;overflow:hidden;font-size:13px;">
      <thead><tr style="background:#333;">
        <th style="padding:6px 10px;text-align:left;color:#aaa;font-weight:600;font-size:11px;">时间</th>
        <th style="padding:6px 8px;text-align:center;color:#aaa;font-weight:600;font-size:11px;">结果</th>
        <th style="padding:6px 8px;text-align:right;color:#aaa;font-weight:600;font-size:11px;" title="振幅% &lt;1.2%">R1 振幅%</th>
        <th style="padding:6px 8px;text-align:right;color:#aaa;font-weight:600;font-size:11px;" title="成交量 ≥310">R2 量</th>
        <th style="padding:6px 8px;text-align:right;color:#aaa;font-weight:600;font-size:11px;" title="价格偏离%">R3 价偏%</th>
        <th style="padding:6px 8px;text-align:right;color:#aaa;font-weight:600;font-size:11px;" title="中间价漂移%">R4 漂%</th>
        <th style="padding:6px 8px;text-align:right;color:#aaa;font-weight:600;font-size:11px;" title="安静分钟数 ≥6">R5 安静</th>
        <th style="padding:6px 8px;text-align:right;color:#aaa;font-weight:600;font-size:11px;" title="触轨 a≥3或b≥3">R6 触轨</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function buildRuleCards(rules) {
  return rules.map(r => {
    const cls  = r.pass === null ? 'na' : r.pass ? 'pass' : 'fail';
    const icon = r.pass === null ? '' : r.pass ? '✓ ' : '✗ ';
    let valueStr;
    if (r.value === null)   valueStr = '—';
    else if (r.id === 'R6') valueStr = `a=${r.value.a} / b=${r.value.b}`;
    else                    valueStr = `${Number(r.value).toFixed(r.id==='R5'?0:3)}${r.unit}`;
    const threshStr = r.id === 'R6' ? `a≥${r.threshold} 或 b≥${r.threshold}`
      : r.cmp === 'lt' ? `< ${r.threshold}${r.unit}` : `≥ ${r.threshold}${r.unit}`;
    const deltaHTML = r.delta
      ? `<div class="rule-card-threshold" style="color:#ef535088;margin-top:3px;">↑ ${r.delta}</div>` : '';
    return `<div class="rule-card ${cls}">
      <div class="rule-card-title">${r.id} ${r.label}</div>
      <div class="rule-card-value">${icon}${valueStr}</div>
      <div class="rule-card-threshold">阈值 ${threshStr}</div>
      ${deltaHTML}
    </div>`;
  }).join('');
}

async function lookupHistory() {
  const sym = document.getElementById('symbolInput').value.trim().toUpperCase();
  if (!sym) { alert('请先输入股票代码'); return; }
  const panel = document.getElementById('historyPanel');
  panel.className = 'history-panel show';
  panel.innerHTML = `<div class="history-empty">正在查询 ${sym} 今日时间点…</div>`;
  try {
    const res  = await fetch(`/api/screener-stable/history?symbol=${encodeURIComponent(sym)}`);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    renderHistory(sym, data);
  } catch(e) {
    panel.innerHTML = `<div class="history-empty" style="color:#ef5350;">查询失败：${e.message}</div>`;
  }
}

function renderHistory(sym, data) {
  const panel   = document.getElementById('historyPanel');
  const records = data.records || [];
  if (records.length === 0) {
    panel.innerHTML = `
      <div class="history-header"><strong>${sym}</strong><span>今日历史时间点</span></div>
      <div class="history-empty">今日暂无满足全部6条规则的时间点</div>`;
    return;
  }
  const latestTime = records[records.length - 1].time;
  const items = [...records].reverse().map(rec => {
    const isCurrent = rec.time === latestTime;
    const pct  = Number(rec.change_pct);
    const sign = pct > 0 ? '+' : '';
    const pcls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
    const vals = [
      { label: 'R1振幅', v: rec.r1_val != null ? rec.r1_val.toFixed(2)+'%' : '—' },
      { label: 'R2量',   v: rec.r2_vol != null ? fmtVol(rec.r2_vol) : '—' },
      { label: 'R3价偏', v: rec.r3_pct != null ? rec.r3_pct.toFixed(2)+'%' : '—' },
      { label: 'R4漂移', v: rec.r4_pct != null ? rec.r4_pct.toFixed(2)+'%' : '—' },
      { label: 'R5安静', v: rec.r5_cnt != null ? rec.r5_cnt+'分' : '—' },
      { label: 'R6触轨', v: rec.r6_a   != null ? `a${rec.r6_a}/b${rec.r6_b}` : '—' },
    ].map(x => `<div class="tl-val-item">${x.label} <span>${x.v}</span></div>`).join('');
    const priceStr = rec.last_price != null
      ? `<span class="${pcls}" style="margin-left:6px;font-size:11px;">${fmt(rec.last_price,2)} ${sign}${pct.toFixed(2)}%</span>` : '';
    return `<div class="tl-item">
      <div class="tl-time">${rec.time.slice(0,5)}</div>
      <div class="tl-dot${isCurrent ? ' current' : ''}"></div>
      <div class="tl-body">
        <div class="tl-label${isCurrent ? ' current' : ''}">${isCurrent ? '● 最新' : '✓ 通过'}${priceStr}</div>
        <div class="tl-vals">${vals}</div>
      </div>
    </div>`;
  }).join('');
  panel.innerHTML = `
    <div class="history-header">
      <strong>${sym}</strong>
      <span>今日共 <b style="color:#26a69a">${records.length}</b> 个满足条件的时间点</span>
    </div>
    <div class="timeline">${items}</div>`;
}

function renderLookup(sym) {
  const el = document.getElementById('lookupResult');
  const row = allData.find(r => r.symbol.toUpperCase() === sym);
  if (!row) {
    el.className = 'lookup-result show';
    el.innerHTML = `<div style="color:#888;font-size:13px;">
      未找到 <b style="color:#fff">${sym}</b> —— 可能不在今日数据中，或10分钟内暂无交易记录
    </div>`;
    return;
  }

  const ev = evalRow(row);
  const price = Number(row.last_price);
  const pct   = Number(row.change_pct);
  const pcls  = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const sign  = pct > 0 ? '+' : '';

  const statusLabel = ev.passAll
    ? `<span class="pass-all">✓ 全部通过</span>`
    : `<span class="fail-some">✗ 未全部通过</span>`;

  const noData = row.bars_count === 0;

  const cards = [
    {
      title: 'R1 振幅',
      pass: ev.r1_pass,
      value: row.r1_val != null ? row.r1_val.toFixed(2)+'%' : '—',
      threshold: '< 1.2%',
      desc: '7分钟 High-Low / 现价',
    },
    {
      title: 'R2 成交量',
      pass: ev.r2_pass,
      value: row.r2_vol != null ? fmtVol(row.r2_vol) : '—',
      threshold: '≥ 310 股',
      desc: '7分钟总成交量',
    },
    {
      title: 'R3 价格偏离',
      pass: ev.r3_pass,
      value: row.r3_pct != null ? row.r3_pct.toFixed(2)+'%' : '—',
      threshold: '< ' + (ev.r35T ?? getR35Thresh(row.open_price)) + '%',
      desc: '现价 vs 7分钟均价｜按开盘价分档',
    },
    {
      title: 'R4 中间价漂移',
      pass: ev.r4_pass,
      value: row.r4_pct != null ? row.r4_pct.toFixed(2)+'%' : '—',
      threshold: '< ' + (ev.r4T ?? getR4Thresh(row.open_price)) + '%',
      desc: '首根 vs 末根中间价｜按开盘价分档',
    },
    {
      title: 'R5 安静分钟',
      pass: ev.r5_pass,
      value: row.r5_cnt != null ? row.r5_cnt+'分钟' : '—',
      threshold: '≥ 6 / 10分钟',
      desc: '最近10根K线｜阈值同R3按开盘价分档',
    },
    {
      title: 'R6 触轨计数',
      pass: ev.r6_pass,
      value: row.r6_a != null ? `a=${row.r6_a} / b=${row.r6_b}` : '—',
      threshold: 'a≥3 或 b≥3',
      desc: '下轨5%触底(a) / 上轨95%触顶(b)',
    },
  ];

  const cardsHTML = cards.map(c => {
    const cls = c.pass === null ? 'na' : c.pass ? 'pass' : 'fail';
    const icon = c.pass === null ? '' : c.pass ? '✓ ' : '✗ ';
    return `<div class="rule-card ${cls}">
      <div class="rule-card-title">${c.title}</div>
      <div class="rule-card-value">${icon}${c.value}</div>
      <div class="rule-card-threshold">阈值 ${c.threshold}</div>
      <div class="rule-card-threshold" style="margin-top:2px;color:#444;">${c.desc}</div>
    </div>`;
  }).join('');

  const barsInfo = noData
    ? `<span style="color:#ef5350;font-size:11px;margin-left:12px;">⚠ 暂无10分钟数据</span>`
    : `<span style="color:#555;font-size:11px;margin-left:12px;">${row.bars_count} 根1分钟K线</span>`;

  el.className = 'lookup-result show';
  el.innerHTML = `
    <div class="lookup-sym">
      ${sym}
      <span class="${pcls}">${fmt(price,2)}  ${sign}${pct.toFixed(2)}%</span>
      ${statusLabel}
      ${barsInfo}
    </div>
    <div class="rule-detail-grid">${cardsHTML}</div>`;
}

// ── UTILS ─────────────────────────────────────────────────────────────────
function fmt(v, dec) {
  const n = Number(v);
  return isNaN(n) ? '—' : n.toFixed(dec);
}
function fmtVol(v) {
  return v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(1)+'K' : String(Math.round(v));
}

// ── COUNTDOWN & AUTO REFRESH ──────────────────────────────────────────────
setInterval(() => {
  if (countdown <= 0) {
    fetchData(lastParams);
    countdown = 10;
  } else {
    countdown--;
  }
  document.getElementById('refresh-timer').textContent = `${countdown}s 后刷新`;

  // 置顶倒计时每秒刷新
  const hasPinned = [...graceMap.values()].some(g => g.pinned);
  if (hasPinned) {
    const now = Date.now();
    for (const [sym, g] of graceMap) {
      if (g.pinned && now - g.pinnedAt > PINNED_MS) graceMap.delete(sym);
    }
    renderTable();
  }
}, 1000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { fetchData(lastParams); countdown = 10; }
});

// 所有筛选框：input 即时过滤（纯前端，无需重新请求）
['priceMin','priceMax','changeMin','changeMax','volMin','volMax',
 'changeAmtMin','changeAmtMax'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input',   () => run());
  el.addEventListener('change',  () => run());
  el.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
});

const manualBlockInputEl = document.getElementById('manual-block-input');
if (manualBlockInputEl) {
  manualBlockInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addManualBlock();
    }
  });
}

// ── 右键菜单：屏蔽此股票 ──────────────────────────────────────────────────
let ctxTarget = null;
const ctxMenu = document.getElementById('ctx-menu');

document.getElementById('tbody').addEventListener('contextmenu', e => {
  const tr = e.target.closest('tr[data-sym]');
  if (!tr) return;
  e.preventDefault();
  ctxTarget = tr.dataset.sym;

  document.getElementById('ctx-block').textContent = `🚫 屏蔽 ${ctxTarget}`;
  ctxMenu.style.display = 'block';
  const x = Math.min(e.clientX, window.innerWidth  - ctxMenu.offsetWidth  - 4);
  const y = Math.min(e.clientY, window.innerHeight - ctxMenu.offsetHeight - 4);
  ctxMenu.style.left = x + 'px';
  ctxMenu.style.top  = y + 'px';
});

document.getElementById('ctx-block').addEventListener('click', () => {
  if (ctxTarget) blockStock(ctxTarget);
  ctxMenu.style.display = 'none';
});

document.addEventListener('click', () => { ctxMenu.style.display = 'none'; });
document.addEventListener('contextmenu', e => {
  if (!e.target.closest('#tbody')) ctxMenu.style.display = 'none';
});

saveBlocked();
restoreFiltersFromUrl();
rememberCurrentUrl();
hydrateRememberedNavLinks();
run();
</script>
