<!DOCTYPE html> 
<html lang="zh-CN"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>矩形区间监控</title> 
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style> 
  * { margin: 0; padding: 0; box-sizing: border-box; } 
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: #1a1a1a; color: #ddd; padding: 20px; line-height: 1.6; 
  } 
  .container { max-width: 1600px; margin: 0 auto; } 
  .nav-links { text-align: center; margin-bottom: 20px; } 
  .nav-links a { 
    color: #007acc; text-decoration: none; padding: 6px 14px; margin: 0 6px; 
    border: 1px solid #007acc; border-radius: 4px; font-size: 13px; display: inline-block; 
  } 
  .nav-links a:hover, .nav-links a.active { background-color: #007acc; color: white; } 
  .header-bar { 
    display: flex; justify-content: space-between; align-items: center; 
    margin-bottom: 16px; border-bottom: 1px solid #333; padding-bottom: 12px; 
  } 
  .title { font-size: 1.4em; color: #ddd; } 
  .stats { font-size: 13px; color: #888; } 
  .stats .active-count { color: #26a69a; font-weight: bold; } 
  .stats .broken-count { color: #ef5350; font-weight: bold; } 
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: monospace; } 
  th, td { border: 1px solid #333; padding: 5px 8px; text-align: left; white-space: nowrap; } 
  th { background: #16213e; position: sticky; top: 0; } 
  tr.active td:first-child { border-left: 3px solid #26a69a; } 
  tr.broken td { color: #888; text-decoration: line-through; } 
  tr.broken td:first-child { border-left: 3px solid #ef5350; } 
  tr.new-flash { animation: flash-green 1s; } 
  tr.break-flash { animation: flash-red 1s; } 
  @keyframes flash-green { 0%,100% { background: transparent; } 50% { background: #1b5e20; } } 
  @keyframes flash-red { 0%,100% { background: transparent; } 50% { background: #b71c1c; } } 
  .notify { 
    position: fixed; top: 10px; right: 10px; padding: 10px 20px; 
    border-radius: 5px; font-weight: bold; display: none; z-index: 999; 
    font-size: 13px; 
  } 
  .notify.new { background: #26a69a; color: #000; } 
  .notify.break { background: #ef5350; color: #fff; } 
  .ws-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 6px; } 
  .ws-status.connected { background: #26a69a; } 
  .ws-status.disconnected { background: #ef5350; } 
</style> 
</head> 
<body> 
<div class="container"> 
  <div class="nav-links"> 
    <a href="/">排行榜</a> 
    <a href="/boundary-alerts">边界预警</a> 
    <a href="/screener-breakout">突破选股</a> 
    <a href="/screener-range">区间选股</a> 
    <a href="/rect-alerts" class="active">矩形监控</a> 
    <a href="/active-trading">活跃成交</a> 
  </div> 

  <div class="header-bar"> 
    <span class="title">📐 矩形区间实时监控</span> 
    <span class="stats"> 
      <label style="margin-right: 15px; cursor: pointer; color: #ddd; font-size: 13px;">
        <input type="checkbox" id="filter-semicond" checked style="margin-right: 4px;">仅显示半导体/热门股票
      </label>
      <span class="ws-status" id="ws-dot"></span> 
      Active: <span class="active-count" id="active-count">0</span> | 
      Broken: <span class="broken-count" id="broken-count">0</span> | 
      Total: <span id="total-count">0</span> 
    </span> 
  </div> 

  <div id="notify" class="notify"></div> 

  <table> 
    <thead> 
      <tr> 
        <th>Symbol</th><th>起止时间</th><th>区间</th><th>宽度</th> 
        <th>持续min</th><th>ActBars</th><th>Inlier%</th><th>Cov</th> 
        <th>Touch H/L</th><th>Vol</th><th>状态</th><th>突破</th><th>Bid</th><th>Ask</th><th>价差</th><th>检测时间</th> 
      </tr> 
    </thead> 
    <tbody id="signals-body"></tbody> 
  </table> 

  <div id="chart-panel" style="display:none; margin-top:20px; border:1px solid #333; border-radius:6px; padding:10px;"> 
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;"> 
      <span id="chart-title" style="font-size:14px; color:#ddd;"></span> 
      <span style="cursor:pointer; color:#888; font-size:18px;" onclick="closeChart()">✕</span> 
    </div> 
    <div id="chart-container" style="height:300px;"></div> 
  </div> 
</div> 

<script> 
const signals = new Map(); // key: symbol_rect_start 

let quoteMap = {}; // { symbol: { bid, ask, spread } } 
 
async function fetchQuotes() { 
  try { 
    const res = await fetch('/api/screener'); 
    if (!res.ok) return; 
    const data = await res.json(); 
    quoteMap = {}; 
    data.forEach(r => { 
      if (r.bid != null || r.ask != null) { 
        quoteMap[r.symbol] = { bid: r.bid, ask: r.ask, spread: r.spread }; 
      } 
    }); 
  } catch(e) { console.error('[quotes] fetch error:', e); } 
} 

const semicondSet = new Set([
  'NVDA.BL', 'AMD.BL', 'TSM.BL', 'AVGO.BL', 'INTC.BL', 'QCOM.BL', 'MU.BL', 'AMAT.BL', 'TXN.BL',
  'KLAC.BL', 'LRCX.BL', 'ASML.BL', 'ARM.BL', 'MRVL.BL', 'NXPI.BL', 'SWKS.BL', 'MCHP.BL', 'ON.BL',
  'MDB.BL', 'MPWR.BL', 'WDC.BL', 'ALTR.BL', 'SYNA.BL', 'CRUS.BL', 'QRVO.BL', 'LSCC.BL', 'SLAB.BL',
  'DIOD.BL', 'PI.BL', 'POWI.BL', 'RMBS.BL', 'WOLF.BL', 'SGH.BL', 'ENTG.BL', 'AMKR.BL', 'TER.BL',
  'STM.BL', 'COHR.BL', 'FORM.BL', 'ACLS.BL', 'AEIS.BL', 'ONTO.BL', 'UCTT.BL', 'COHU.BL', 'ICHR.BL',
  'MKSI.BL', 'PLAB.BL', 'CYA.BL', 'AOS.BL', 'INDI.BL', 'VSH.BL', 'SMTC.BL', 'SITM.BL', 'NVMI.BL',
  'ALGM.BL', 'CEVA.BL', 'MXL.BL', 'GSI.BL', 'POET.BL', 'IGIC.BL', 'RESN.BL', 'ATOM.BL', 'TXN.BL',
  'SOXX.BL', 'SOXL.BL', 'SOXS.BL', 'SMH.BL', 'USD.BL', 'SSG.BL', 'XSD.BL', 'PSI.BL', 'PTF.BL', 'FTXL.BL'
]);

let chartInstance = null; 
  
function openChart(symbol, rectStart, rectEnd, upper, lower) { 
  const panel = document.getElementById('chart-panel'); 
  const container = document.getElementById('chart-container'); 
  panel.style.display = 'block'; 
  document.getElementById('chart-title').textContent = `${symbol} K线图`; 
 
  // 取日期 
  const date = rectStart.slice(0, 10); 
 
  fetch(`/api/rect-kline?symbol=${symbol}&date=${date}`).then(r => r.json()).then(data => { 
    if (!data || data.length === 0) return; 
 
    // 清除旧图 
    container.innerHTML = ''; 
 
    const chart = LightweightCharts.createChart(container, { 
      width: container.clientWidth, 
      height: 300, 
      layout: { background: { color: '#1a1a1a' }, textColor: '#ddd' }, 
      grid: { vertLines: { color: '#2a2a2a' }, horzLines: { color: '#2a2a2a' } }, 
      timeScale: { timeVisible: true, secondsVisible: false }, 
    }); 
 
    const candleSeries = chart.addCandlestickSeries({ 
      upColor: '#26a69a', downColor: '#ef5350', 
      borderUpColor: '#26a69a', borderDownColor: '#ef5350', 
      wickUpColor: '#26a69a', wickDownColor: '#ef5350', 
    }); 
 
    const bars = data.map(d => ({ 
      time: new Date(d.t).getTime() / 1000, 
      open: Number(d.o), high: Number(d.h), low: Number(d.l), close: Number(d.c), 
    })).filter(b => b.open > 0); 
 
    candleSeries.setData(bars); 
 
    // 画矩形上下沿水平线 
    const upperLine = chart.addLineSeries({ color: 'red', lineWidth: 1, lineStyle: 2, priceLineVisible: false }); 
    const lowerLine = chart.addLineSeries({ color: 'blue', lineWidth: 1, lineStyle: 2, priceLineVisible: false }); 
    const firstTime = bars[0].time; 
    const lastTime = bars[bars.length - 1].time; 
    upperLine.setData([{ time: firstTime, value: upper }, { time: lastTime, value: upper }]); 
    lowerLine.setData([{ time: firstTime, value: lower }, { time: lastTime, value: lower }]); 
 
    chart.timeScale().fitContent(); 
    chartInstance = chart; 
  }); 
} 
 
function closeChart() { 
  document.getElementById('chart-panel').style.display = 'none'; 
  if (chartInstance) { chartInstance.remove(); chartInstance = null; } 
} 

// 初始化 
fetch('/api/rect-signals').then(r => r.json()).then(data => { 
  (data.signals || []).forEach(s => { 
    const key = s.symbol + '_' + s.rect_start; 
    signals.set(key, s); 
  }); 
  render(); 
}); 

// WebSocket 
let ws; 
function connectWs() { 
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'; 
  ws = new WebSocket(`${proto}//${location.host}/ws/rect-signals`); 
  ws.onopen = () => { document.getElementById('ws-dot').className = 'ws-status connected'; }; 
  ws.onclose = () => { 
    document.getElementById('ws-dot').className = 'ws-status disconnected'; 
    setTimeout(connectWs, 3000); 
  }; 
  ws.onerror = () => ws.close(); 
  ws.onmessage = (e) => { 
    const msg = JSON.parse(e.data); 
    if (msg.type === 'new') { 
      const key = msg.symbol + '_' + msg.start_time; 
      signals.set(key, { 
        symbol: msg.symbol, rect_start: msg.start_time, rect_end: msg.end_time, 
        upper_price: msg.upper, lower_price: msg.lower, range_width: msg.range_width, 
        duration_min: msg.duration_min, active_bars: msg.active_bar_count, 
        inlier_pct: msg.inlier_pct, bar_coverage: msg.bar_coverage, 
        high_touches: msg.high_touches, low_touches: msg.low_touches, 
        total_volume: msg.total_volume, status: 'active', 
        detected_at: msg.timestamp 
      }); 
      showNotify(`🟢 ${msg.symbol} ${fmtTime(msg.start_time)}`, 'new'); 
      render('new', key); 
    } else if (msg.type === 'break') { 
      for (const [key, s] of signals) { 
        if (s.symbol === msg.symbol && s.status === 'active') { 
          s.status = 'broken'; 
          s.break_direction = msg.direction; 
          s.break_price = msg.break_price; 
          s.break_time = msg.break_time; 
          showNotify(`⚠️ ${msg.symbol} BREAK ${msg.direction.toUpperCase()} @$${msg.break_price}`, 'break'); 
          render('break', key); 
          break; 
        } 
      } 
    } 
  }; 
} 
connectWs(); 
fetchQuotes(); 
setInterval(fetchQuotes, 10000); // 每10秒刷新 

function render(flashType, flashKey) { 
  const tbody = document.getElementById('signals-body'); 
  const sorted = [...signals.values()].sort((a, b) => { 
    if (a.status !== b.status) return a.status === 'active' ? -1 : 1; 
    return (b.detected_at || '').localeCompare(a.detected_at || ''); 
  }); 

  let activeCount = 0, brokenCount = 0; 
  let html = ''; 
  const filterEnabled = document.getElementById('filter-semicond').checked;

  sorted.forEach(s => { 
    if (filterEnabled && !semicondSet.has(s.symbol)) return;

    const isActive = s.status === 'active'; 
    if (isActive) activeCount++; else brokenCount++; 
    
    // 不显示失效股票
    if (!isActive) return;

    const key = s.symbol + '_' + s.rect_start; 
    const cls = isActive ? 'active' : 'broken'; 
    const flash = (flashKey === key) ? (flashType === 'new' ? ' new-flash' : ' break-flash') : ''; 
    const breakInfo = s.break_direction ? `${s.break_direction.toUpperCase()} @$${Number(s.break_price).toFixed(2)}` : '—'; 

    const q = quoteMap[s.symbol] || {}; 
    const bid    = q.bid    != null ? Number(q.bid).toFixed(2)    : '—'; 
    const ask    = q.ask    != null ? Number(q.ask).toFixed(2)    : '—'; 
    const spread = q.spread != null ? Number(q.spread).toFixed(3) : '—'; 

    html += `<tr class="${cls}${flash}"> 
      <td style="cursor:pointer; color:#007acc;" onclick="openChart('${s.symbol}', '${s.rect_start}', '${s.rect_end}', ${Number(s.upper_price)}, ${Number(s.lower_price)})"><b>${s.symbol}</b></td> 
      <td>${fmtTime(s.rect_start)}-${fmtTime(s.rect_end)}</td> 
      <td>$${Number(s.lower_price).toFixed(2)}-$${Number(s.upper_price).toFixed(2)}</td> 
      <td>$${Number(s.range_width).toFixed(2)}</td> 
      <td>${s.duration_min || ''}</td> 
      <td>${s.active_bars || ''}</td> 
      <td>${s.inlier_pct ? (Number(s.inlier_pct)*100).toFixed(0)+'%' : ''}</td> 
      <td>${s.bar_coverage ? Number(s.bar_coverage).toFixed(2) : ''}</td> 
      <td>${s.high_touches || ''}/${s.low_touches || ''}</td> 
      <td>${s.total_volume || ''}</td> 
      <td>${isActive ? '🟢' : '🔴'}</td> 
      <td>${breakInfo}</td> 
      <td>${bid}</td><td>${ask}</td><td>${spread}</td> 
      <td>${fmtTime(s.detected_at)}</td> 
    </tr>`; 
  }); 
  tbody.innerHTML = html; 
  document.getElementById('active-count').textContent = activeCount; 
  document.getElementById('broken-count').textContent = brokenCount; 
  document.getElementById('total-count').textContent = activeCount + brokenCount; 
} 

document.getElementById('filter-semicond').addEventListener('change', () => {
  render();
});

function fmtTime(t) { 
  if (!t) return ''; 
  if (t.length >= 16) return t.slice(11, 16); 
  if (t.length === 5) return t; 
  return t; 
} 

function showNotify(text, type) { 
  const el = document.getElementById('notify'); 
  el.textContent = text; 
  el.className = 'notify ' + type; 
  el.style.display = 'block'; 
  setTimeout(() => el.style.display = 'none', 4000); 
} 
</script> 
</body> 
</html>
