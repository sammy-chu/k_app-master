# /etc/nginx/conf.d/k-app.conf
# 部署在云服务器的 Nginx 配置文件

server {
    listen 80;
    # 替换为你前端访问的实际域名
    server_name 39.107.112.227;
    
    # 指向你上传 public/ 的服务器目录
    root /var/www/k-app/public;
    index index.html;

    # Nginx 压缩配置，建议开启以提高静态文件加载速度
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 关键：动态注入 API_BASE 到每个 HTML 的 head 中
    # 注意：如果云端使用了 gzip，建议把 API_BASE 注入放到 GitHub Actions 的 CI 步骤里直接替换，
    # 或者如果你确认上传的是未压缩的 HTML，这里可以正常工作。
    # 把 https://api.yourdomain.com 替换为你 Cloudflare Tunnel 的域名
    sub_filter '<head>' '<head><script>window.API_BASE="https://subaru-proposition-bringing-marketing.trycloudflare.com";</script>';
    sub_filter_once on;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
