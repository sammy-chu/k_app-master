# .github/workflows/deploy-frontend.yml
# GitHub Actions 自动化部署配置文件

name: Deploy Frontend to Cloud Server

on:
  push:
    branches:
      - production-only
    paths:
      - 'public/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # (可选) 如果你不想在 Nginx 使用 sub_filter，可以在这里直接注入 API_BASE
      # - name: Inject API_BASE to HTML
      #   run: |
      #     find public -name "*.html" -exec sed -i 's|<head>|<head><script>window.API_BASE="https://api.yourdomain.com";</script>|g' {} +

      - name: Deploy public/ to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "public/"
          target: "/var/www/k-app/"
          strip_components: 1

      - name: Reload Nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: systemctl reload nginx
